<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Creaturen Trail</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* ==================================================
   BASIS
================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #07120f;

    color: white;
}


/* ==================================================
   STARTSCHERM
================================================== */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:

        radial-gradient(
            circle at 50% 20%,
            rgba(70,220,130,.25),
            transparent 35%
        ),

        linear-gradient(
            160deg,
            #06110d,
            #123122,
            #06110d
        );
}


.logo {

    width: 115px;

    height: 115px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 34px;

    font-size: 62px;

    background:

        linear-gradient(
            145deg,
            #75f2a8,
            #2b9459
        );

    box-shadow:

        0 20px 55px
        rgba(0,0,0,.45);

    animation:
        logoFloat 3s ease-in-out infinite;
}


@keyframes logoFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-9px);
    }
}


#startScreen h1 {

    margin: 22px 0 0;

    font-size:
        clamp(38px, 10vw, 58px);

    font-weight: 900;

    letter-spacing: -2px;
}


.subtitle {

    margin-top: 10px;

    color: #b9cec3;

    font-size: 17px;
}


.startButton {

    margin-top: 40px;

    min-width: 245px;

    padding: 18px 35px;

    border: none;

    border-radius: 18px;

    background:

        linear-gradient(
            135deg,
            #72f1a5,
            #31b96c
        );

    color: #07120f;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:

        0 12px 35px
        rgba(50,190,110,.35);
}


/* ==================================================
   GAME
================================================== */

#game {

    display: none;

    position: fixed;

    inset: 0;
}


/* ==================================================
   MAP
================================================== */

#map {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;
}


/* ==================================================
   HUD
================================================== */

.hud {

    position: fixed;

    top: 14px;

    left: 14px;

    right: 14px;

    z-index: 2000;

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

    pointer-events: none;
}


.hudBox {

    padding: 11px 14px;

    border-radius: 18px;

    background:
        rgba(6,18,13,.92);

    backdrop-filter:
        blur(14px);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);
}


.title {

    font-size: 14px;

    font-weight: 900;
}


.level {

    margin-top: 5px;

    color: #73eda3;

    font-size: 11px;

    font-weight: bold;
}


.xpBar {

    width: 145px;

    height: 7px;

    margin-top: 7px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.12);
}


.xpFill {

    width: 0%;

    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #5ee594,
            #c8ff83
        );

    transition:
        width .4s ease;
}


.stats {

    text-align: right;

    color: #dce7e1;

    font-size: 12px;

    line-height: 1.5;
}


/* ==================================================
   MENU KNOPPEN
================================================== */

.menu {

    position: fixed;

    right: 14px;

    top: 108px;

    z-index: 2000;

    display: flex;

    flex-direction: column;

    gap: 10px;
}


.menu button {

    width: 51px;

    height: 51px;

    border: none;

    border-radius: 17px;

    background:
        rgba(6,18,13,.93);

    color: white;

    font-size: 21px;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.35);
}


.menu button:active {

    transform: scale(.94);
}


/* ==================================================
   ONDERSTE MELDING
================================================== */

.messageBox {

    position: fixed;

    left: 50%;

    bottom: 17px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 30px);

    max-width: 460px;

    padding: 15px;

    z-index: 3000;

    text-align: center;

    border-radius: 21px;

    background:
        rgba(6,18,13,.94);

    backdrop-filter:
        blur(15px);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.45);
}


#message {

    color: #dce8e1;

    font-size: 14px;
}


#lookButton {

    display: none;

    width: 100%;

    margin-top: 12px;

    padding: 14px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #71efa4,
            #35b96f
        );

    color: #07120f;

    font-size: 15px;

    font-weight: 900;
}


/* ==================================================
   CREATURE MARKER
================================================== */

.creatureMarker {

    width: 60px;

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            white,
            #e5eee9
        );

    border:
        3px solid
        #10251b;

    font-size: 31px;

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.45);

    animation:
        creatureFloat 2.5s ease-in-out infinite;
}


@keyframes creatureFloat {

    0%,
    100% {

        transform:
            translateY(0)
            scale(1);
    }

    50% {

        transform:
            translateY(-7px)
            scale(1.05);
    }
}


/* ==================================================
   SPELER
================================================== */

.playerMarker {

    width: 30px;

    height: 30px;

    border-radius: 50%;

    background: #428cff;

    border: 4px solid white;

    box-shadow:

        0 0 0 9px
        rgba(66,140,255,.22),

        0 4px 14px
        rgba(0,0,0,.5);
}


/* ==================================================
   MODAL
================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 7000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.68);

    backdrop-filter:
        blur(8px);
}


.modalCard {

    width: 100%;

    max-width: 430px;

    max-height: 80vh;

    overflow-y: auto;

    padding: 22px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #142a20,
            #08140e
        );

    border:
        1px solid
        rgba(255,255,255,.12);
}


.modalTitle {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    margin-bottom: 20px;

    font-size: 22px;

    font-weight: 900;
}


.close {

    border: none;

    background: transparent;

    color: white;

    font-size: 28px;
}


.grid {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 12px;
}


.card {

    padding: 16px;

    border-radius: 18px;

    text-align: center;

    background:
        rgba(255,255,255,.07);
}


.cardEmoji {

    font-size: 40px;
}


.cardName {

    margin-top: 7px;

    font-size: 14px;

    font-weight: bold;
}


.cardType {

    margin-top: 5px;

    color: #75e9a3;

    font-size: 10px;
}


/* ==================================================
   LEAFLET
================================================== */

.leaflet-control-zoom {

    border: none !important;
}


.leaflet-control-zoom a {

    background:
        rgba(6,18,13,.9) !important;

    color: white !important;

    border: none !important;
}


.leaflet-control-attribution {

    font-size: 8px;
}

</style>

</head>


<body>


<!-- ==================================================
     START
================================================== -->

<section id="startScreen">

    <div class="logo">
        🐾
    </div>

    <h1>
        Creaturen Trail
    </h1>

    <div class="subtitle">
        Ontdek. Vind. Vang.
    </div>

    <button
        class="startButton"
        onclick="startGame()"
    >
        START AVONTUUR
    </button>

</section>


<!-- ==================================================
     GAME
================================================== -->

<section id="game">

    <div id="map"></div>


    <!-- HUD -->

    <div class="hud">

        <div class="hudBox">

            <div class="title">
                🐾 Creaturen Trail
            </div>

            <div class="level">

                LEVEL
                <span id="level">
                    1
                </span>

            </div>

            <div class="xpBar">

                <div
                    class="xpFill"
                    id="xpFill"
                ></div>

            </div>

        </div>


        <div class="hudBox stats">

            ⭐
            <span id="xp">
                0
            </span>
            XP

            <br>

            🎒
            <span id="count">
                0
            </span>

        </div>

    </div>


    <!-- MENU -->

    <div class="menu">

        <button
            onclick="openCollection()"
        >
            📖
        </button>

        <button
            onclick="centerPlayer()"
        >
            📍
        </button>

        <button
            onclick="spawnNearPlayer()"
        >
            👾
        </button>

    </div>


    <!-- MESSAGE -->

    <div class="messageBox">

        <div id="message">
            📍 Locatie wordt gezocht...
        </div>

        <button
            id="lookButton"
            onclick="openCreature()"
        >
            👾 BEKIJK CREATURE
        </button>

    </div>

</section>


<!-- ==================================================
     CREATURE MODAL
================================================== -->

<div
    class="modal"
    id="creatureModal"
>

    <div class="modalCard">

        <div class="modalTitle">

            <span>
                👾 Creature
            </span>

            <button
                class="close"
                onclick="closeCreature()"
            >
                ×
            </button>

        </div>


        <div
            id="creatureInfo"
        ></div>

    </div>

</div>


<!-- ==================================================
     COLLECTIE
================================================== -->

<div
    class="modal"
    id="collectionModal"
>

    <div class="modalCard">

        <div class="modalTitle">

            <span>
                📖 Creaturenboek
            </span>

            <button
                class="close"
                onclick="closeCollection()"
            >
                ×
            </button>

        </div>


        <div
            class="grid"
            id="collectionGrid"
        ></div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* ==================================================
   GAME DATA
================================================== */

let map;

let playerMarker;

let playerPosition = null;

let selectedCreature = null;

let selectedCreatureData = null;

let xp = 0;

let creatureCount = 0;

let collection = [];

let spawnedCreatures = [];


/* ==================================================
   CREATURE DATABASE
================================================== */

const creatures = [

    {
        name: "Blazik",
        emoji: "🔥",
        type: "Vuur",
        biome: "stad",
        rarity: "Gewoon",
        power: 65
    },

    {
        name: "Aquari",
        emoji: "💧",
        type: "Water",
        biome: "water",
        rarity: "Gewoon",
        power: 55
    },

    {
        name: "Leafy",
        emoji: "🌿",
        type: "Natuur",
        biome: "bos",
        rarity: "Gewoon",
        power: 60
    },

    {
        name: "Sparko",
        emoji: "⚡",
        type: "Elektrisch",
        biome: "stad",
        rarity: "Zeldzaam",
        power: 85
    },

    {
        name: "Rocko",
        emoji: "🪨",
        type: "Aarde",
        biome: "berg",
        rarity: "Zeldzaam",
        power: 90
    },

    {
        name: "Mysti",
        emoji: "✨",
        type: "Mystiek",
        biome: "bos",
        rarity: "Episch",
        power: 98
    },

    {
        name: "Frosto",
        emoji: "❄️",
        type: "IJs",
        biome: "berg",
        rarity: "Zeldzaam",
        power: 88
    }

];


/* ==================================================
   GAME START
================================================== */

function startGame() {

    document
        .getElementById("startScreen")
        .style.display =
        "none";


    document
        .getElementById("game")
        .style.display =
        "block";


    createMap();

    locatePlayer();

}


/* ==================================================
   MAP MAKEN
================================================== */

function createMap() {

    map =
        L.map("map")
        .setView(
            [52.3676,4.9041],
            16
        );


    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {

            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap contributors"

        }

    ).addTo(map);

}


/* ==================================================
   GPS
================================================== */

function locatePlayer() {

    showMessage(
        "📍 Je locatie wordt gezocht..."
    );


    if (
        !navigator.geolocation
    ) {

        useDefaultLocation();

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            updatePlayer(
                position
            );


            navigator
                .geolocation
                .watchPosition(

                    updatePlayer,

                    function() {},

                    {
                        enableHighAccuracy: true,

                        maximumAge: 5000
                    }

                );

        },

        function() {

            showMessage(
                "⚠️ GPS niet beschikbaar. Testlocatie gebruikt."
            );

            useDefaultLocation();

        },

        {

            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0

        }

    );

}


/* ==================================================
   PLAYER UPDATEN
================================================== */

function updatePlayer(
    position
) {

    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;


    playerPosition = [
        lat,
        lng
    ];


    if (!playerMarker) {

        const icon =
            L.divIcon({

                className: "",

                html:
                    '<div class="playerMarker"></div>',

                iconSize: [
                    30,
                    30
                ],

                iconAnchor: [
                    15,
                    15
                ]

            });


        playerMarker =
            L.marker(
                [lat,lng],
                {
                    icon: icon
                }
            )
            .addTo(map);


        map.setView(
            [lat,lng],
            17
        );


        createWorld(
            lat,
            lng
        );

    }

    else {

        playerMarker.setLatLng(
            [lat,lng]
        );

    }


    checkDistance();

}


/* ==================================================
   TESTLOCATIE
================================================== */

function useDefaultLocation() {

    updatePlayer({

        coords: {

            latitude: 52.3676,

            longitude: 4.9041

        }

    });

}


/* ==================================================
   WERELD MAKEN
================================================== */

function createWorld(
    lat,
    lng
) {

    /*
       We maken visuele gebieden
       rondom de speler.
    */


    createBiome(
        lat + 0.003,
        lng - 0.002,
        "🌲 BOS",
        "#2d7048"
    );


    createBiome(
        lat - 0.003,
        lng + 0.003,
        "💧 MEER",
        "#397da8"
    );


    createBiome(
        lat + 0.004,
        lng + 0.004,
        "⛰️ BERGEN",
        "#77736b"
    );


    createBiome(
        lat - 0.004,
        lng - 0.003,
        "🏙️ STAD",
        "#777777"
    );


    /*
       Eerste Creaturen
    */

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        spawnCreature(
            lat,
            lng
        );

    }

}


/* ==================================================
   BIOME
================================================== */

function createBiome(
    lat,
    lng,
    name,
    color
) {

    const circle =
        L.circle(

            [lat,lng],

            {

                radius: 180,

                color: color,

                fillColor: color,

                fillOpacity: .18,

                weight: 2

            }

        )
        .addTo(map);


    circle.bindTooltip(
        name,
        {
            permanent: true,

            direction: "center",

            className:
                "biomeLabel"
        }
    );

}


/* ==================================================
   CREATURE SPAWN
================================================== */

function spawnCreature(
    lat,
    lng
) {

    const creature =
        creatures[
            Math.floor(
                Math.random() *
                creatures.length
            )
        ];


    const distance =
        0.0005 +
        Math.random() *
        0.003;


    const angle =
        Math.random() *
        Math.PI *
        2;


    const cLat =
        lat +
        Math.cos(angle) *
        distance;


    const cLng =
        lng +
        Math.sin(angle) *
        distance;


    const icon =
        L.divIcon({

            className: "",

            html:

                `<div class="creatureMarker">
                    ${creature.emoji}
                </div>`,

            iconSize: [
                60,
                60
            ],

            iconAnchor: [
                30,
                30
            ]

        });


    const marker =
        L.marker(

            [cLat,cLng],

            {
                icon: icon
            }

        )
        .addTo(map);


    marker.creatureData =
        creature;


    marker.on(
        "click",
        function() {

            selectCreature(
                marker,
                creature
            );

        }
    );


    spawnedCreatures.push(
        marker
    );

}


/* ==================================================
   CREATURE SELECTEREN
================================================== */

function selectCreature(
    marker,
    creature
) {

    selectedCreature =
        marker;

    selectedCreatureData =
        creature;


    const distance =
        calculateDistanceToMarker(
            marker
        );


    showMessage(

        "👾 " +
        creature.name +
        " gevonden! " +
        Math.round(distance) +
        " meter afstand."

    );


    document
        .getElementById(
            "lookButton"
        )
        .style.display =
        "block";

}


/* ==================================================
   CREATURE OPENEN
================================================== */

function openCreature() {

    if (
        !selectedCreatureData
    ) {

        return;

    }


    const creature =
        selectedCreatureData;


    document
        .getElementById(
            "creatureInfo"
        )
        .innerHTML =

        `

        <div
            style="
                text-align:center;
                font-size:70px;
                margin:10px;
            "
        >
            ${creature.emoji}
        </div>

        <h2
            style="
                text-align:center;
                margin:5px;
            "
        >
            ${creature.name}
        </h2>

        <p
            style="
                text-align:center;
                color:#75e9a3;
            "
        >
            ${creature.type}
        </p>

        <p>
            ⭐ Zeldzaamheid:
            <b>${creature.rarity}</b>
        </p>

        <p>
            ⚔️ Kracht:
            <b>${creature.power}</b>
        </p>

        <button
            onclick="catchCreature()"
            style="
                width:100%;
                padding:15px;
                border:0;
                border-radius:15px;
                background:#54db8a;
                font-weight:900;
                font-size:16px;
            "
        >
            🎯 VANG ${creature.name}
        </button>

        `;


    document
        .getElementById(
            "creatureModal"
        )
        .style.display =
        "flex";

}


/* ==================================================
   CREATURE VANGEN
================================================== */

function catchCreature() {

    if (
        !selectedCreature
    ) {

        return;

    }


    const distance =
        calculateDistanceToMarker(
            selectedCreature
        );


    if (
        distance > 60
    ) {

        showMessage(
            "❌ Je moet dichter bij de Creature komen!"
        );

        closeCreature();

        return;

    }


    const creature =
        selectedCreatureData;


    map.removeLayer(
        selectedCreature
    );


    spawnedCreatures =
        spawnedCreatures.filter(
            marker =>
                marker !==
                selectedCreature
        );


    collection.push(
        creature
    );


    creatureCount++;

    xp += 10;


    document
        .getElementById("xp")
        .innerText =
        xp;


    document
        .getElementById("count")
        .innerText =
        creatureCount;


    updateLevel();


    selectedCreature =
        null;

    selectedCreatureData =
        null;


    closeCreature();


    document
        .getElementById(
            "lookButton"
        )
        .style.display =
        "none";


    showMessage(
        "🎉 " +
        creature.name +
        " gevangen! +10 XP"
    );


    setTimeout(
        spawnNearPlayer,
        2500
    );

}


/* ==================================================
   NIEUWE CREATURE BIJ SPELER
================================================== */

function spawnNearPlayer() {

    if (
        !playerPosition
    ) {

        return;

    }


    spawnCreature(
        playerPosition[0],
        playerPosition[1]
    );


    showMessage(
        "👀 Een nieuwe Creature is verschenen!"
    );

}


/* ==================================================
   AFSTAND
================================================== */

function calculateDistanceToMarker(
    marker
) {

    if (
        !playerPosition
    ) {

        return 9999;

    }


    const position =
        marker.getLatLng();


    return distance(
        playerPosition[0],
        playerPosition[1],
        position.lat,
        position.lng
    );

}


function distance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;


    const dLat =
        radians(
            lat2-lat1
        );


    const dLon =
        radians(
            lon2-lon1
        );


    const a =

        Math.sin(dLat/2) *
        Math.sin(dLat/2)

        +

        Math.cos(
            radians(lat1)
        )

        *

        Math.cos(
            radians(lat2)
        )

        *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R*c;

}


function radians(
    degrees
) {

    return degrees *
        Math.PI /
        180;

}


/* ==================================================
   DISTANCE CONTROL
================================================== */

function checkDistance() {

    if (
        !selectedCreature
    ) {

        return;

    }


    const d =
        calculateDistanceToMarker(
            selectedCreature
        );


    showMessage(

        "👾 " +
        selectedCreatureData.name +
        " — " +
        Math.round(d) +
        " meter afstand."

    );

}


/* ==================================================
   LEVEL
================================================== */

function updateLevel() {

    const level =
        Math.floor(
            xp / 100
        ) + 1;


    const progress =
        xp % 100;


    document
        .getElementById(
            "level"
        )
        .innerText =
        level;


    document
        .getElementById(
            "xpFill"
        )
        .style.width =
        progress + "%";

}


/* ==================================================
   CENTER PLAYER
================================================== */

function centerPlayer() {

    if (
        !playerPosition
    ) {

        return;

    }


    map.setView(
        playerPosition,
        18
    );

}


/* ==================================================
   COLLECTION
================================================== */

function openCollection() {

    renderCollection();


    document
        .getElementById(
            "collectionModal"
        )
        .style.display =
        "flex";

}


function closeCollection() {

    document
        .getElementById(
            "collectionModal"
        )
        .style.display =
        "none";

}


function renderCollection() {

    const grid =
        document
            .getElementById(
                "collectionGrid"
            );


    grid.innerHTML = "";


    if (
        collection.length === 0
    ) {

        grid.innerHTML =

            `

            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:30px;
                    color:#91a39a;
                "
            >

                📖 Je Creaturenboek is nog leeg.

                <br><br>

                Ga op avontuur en vang Creaturen!

            </div>

            `;

        return;

    }


    collection.forEach(
        creature => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML =

                `

                <div class="cardEmoji">
                    ${creature.emoji}
                </div>

                <div class="cardName">
                    ${creature.name}
                </div>

                <div class="cardType">
                    ${creature.type}
                </div>

                `;


            grid.appendChild(
                card
            );

        }
    );

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
    text
) {

    document
        .getElementById(
            "message"
        )
        .innerText =
        text;

}


/* ==================================================
   MODAL SLUITEN
================================================== */

function closeCreature() {

    document
        .getElementById(
            "creatureModal"
        )
        .style.display =
        "none";

}

</script>
