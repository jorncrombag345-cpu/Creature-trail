<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Creaturen Trail</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#07120d;
    color:white;
}

button{
    font-family:inherit;
    cursor:pointer;
}

/* =========================
   START
========================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:10000;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(circle at 50% 20%,
        rgba(88,240,150,.25),
        transparent 35%),
        linear-gradient(160deg,#06110d,#153a26,#06110d);
}

.logoCreature{
    width:125px;
    height:125px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:38px;

    background:linear-gradient(
        145deg,
        #83f5ae,
        #29955a
    );

    box-shadow:
        0 20px 60px rgba(0,0,0,.5);

    position:relative;
}

.logoCreature::before{
    content:"";
    width:65px;
    height:55px;

    background:#17251c;

    border-radius:45% 55% 45% 55%;

    box-shadow:
        inset 10px 5px 0 rgba(255,255,255,.08);
}

.logoCreature::after{
    content:"";
    position:absolute;

    width:12px;
    height:12px;

    background:white;
    border-radius:50%;

    box-shadow:
        25px 0 white;
}

#startScreen h1{
    margin:24px 0 7px;
    font-size:clamp(38px,10vw,60px);
    font-weight:900;
}

.subtitle{
    color:#b7cbbf;
}

.startButton{
    margin-top:35px;

    padding:17px 42px;

    border:0;
    border-radius:18px;

    background:linear-gradient(
        135deg,
        #7af2a7,
        #31b66b
    );

    color:#07120d;

    font-size:17px;
    font-weight:900;
}

/* =========================
   GAME
========================= */

#game{
    display:none;
    position:fixed;
    inset:0;
}

#map{
    position:absolute;
    inset:0;
}

.leaflet-control-attribution{
    font-size:8px;
}

/* =========================
   HUD
========================= */

.hud{
    position:fixed;
    z-index:2000;

    top:14px;
    left:14px;
    right:14px;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.hudBox{
    padding:11px 14px;

    border-radius:18px;

    background:rgba(5,18,12,.93);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(14px);
}

.title{
    font-weight:900;
    font-size:14px;
}

.level{
    margin-top:5px;
    color:#73efa3;
    font-size:11px;
    font-weight:bold;
}

.xpBar{
    width:145px;
    height:7px;

    margin-top:7px;

    border-radius:20px;

    overflow:hidden;

    background:rgba(255,255,255,.12);
}

.xpFill{
    width:0%;
    height:100%;

    background:linear-gradient(
        90deg,
        #55df91,
        #d0ff8d
    );

    transition:width .3s;
}

.stats{
    text-align:right;
    font-size:12px;
    line-height:1.7;
}

/* =========================
   MENU
========================= */

.menu{
    position:fixed;
    z-index:2500;

    top:105px;
    right:14px;

    display:flex;
    flex-direction:column;
    gap:9px;
}

.menu button{
    width:52px;
    height:52px;

    border:0;
    border-radius:17px;

    background:rgba(5,18,12,.94);

    color:white;
    font-size:21px;

    box-shadow:0 6px 18px rgba(0,0,0,.3);
}

/* =========================
   MESSAGE
========================= */

.messageBox{
    position:fixed;
    z-index:3000;

    left:50%;
    bottom:145px;

    transform:translateX(-50%);

    width:calc(100% - 30px);
    max-width:430px;

    padding:13px 16px;

    border-radius:19px;

    background:rgba(5,18,12,.94);

    text-align:center;

    backdrop-filter:blur(12px);
}

/* =========================
   PLAYER
========================= */

.playerMarker{
    width:30px;
    height:30px;

    border-radius:50%;

    background:#428cff;

    border:4px solid white;

    box-shadow:
        0 0 0 9px rgba(66,140,255,.2),
        0 4px 15px rgba(0,0,0,.45);
}

/* =========================
   CREATURE ART
========================= */

.creatureMarker{
    width:72px;
    height:72px;

    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:rgba(255,255,255,.96);

    border:3px solid #17261c;

    box-shadow:
        0 8px 25px rgba(0,0,0,.5);

    transition:.2s;
}

.creatureMarker:hover{
    transform:scale(1.15);
}

.creatureBody{
    width:42px;
    height:38px;

    position:relative;

    border-radius:
        48% 52% 45% 55%;

    box-shadow:
        inset -6px -6px 0 rgba(0,0,0,.12),
        inset 5px 4px 0 rgba(255,255,255,.2);
}

.eye{
    position:absolute;

    width:7px;
    height:9px;

    border-radius:50%;

    background:#101612;

    top:11px;
}

.eye.left{
    left:10px;
}

.eye.right{
    right:10px;
}

.mouth{
    position:absolute;

    width:11px;
    height:6px;

    left:50%;
    bottom:7px;

    transform:translateX(-50%);

    border-bottom:2px solid #182019;

    border-radius:50%;
}

/* types */

.fire .creatureBody{
    background:linear-gradient(
        145deg,
        #ffbd42,
        #e94824
    );
}

.fire .horn{
    position:absolute;

    width:17px;
    height:22px;

    top:-15px;

    background:#ff742c;

    clip-path:polygon(
        50% 0,
        100% 100%,
        0 100%
    );
}

.fire .horn.left{
    left:4px;
    transform:rotate(-25deg);
}

.fire .horn.right{
    right:4px;
    transform:rotate(25deg);
}

.water .creatureBody{
    background:linear-gradient(
        145deg,
        #73eaff,
        #2376d9
    );
}

.water .fin{
    position:absolute;

    width:19px;
    height:25px;

    background:#54cfee;

    border-radius:80% 20% 80% 20%;
}

.water .fin.left{
    left:-14px;
    transform:rotate(-25deg);
}

.water .fin.right{
    right:-14px;
    transform:rotate(25deg);
}

.nature .creatureBody{
    background:linear-gradient(
        145deg,
        #8de86d,
        #38954d
    );
}

.nature .leaf{
    position:absolute;

    width:22px;
    height:28px;

    background:#4ecb67;

    border-radius:
        0 100% 0 100%;

    top:-17px;
}

.nature .leaf.left{
    left:2px;
    transform:rotate(-25deg);
}

.nature .leaf.right{
    right:2px;
    transform:rotate(25deg);
}

.electric .creatureBody{
    background:linear-gradient(
        145deg,
        #fff26b,
        #f1a91d
    );
}

.electric .bolt{
    position:absolute;

    width:15px;
    height:24px;

    background:#ffdf28;

    clip-path:polygon(
        60% 0,
        100% 0,
        60% 45%,
        95% 45%,
        25% 100%,
        40% 55%,
        0 55%
    );
}

.electric .bolt.left{
    left:-12px;
}

.electric .bolt.right{
    right:-12px;
}

.earth .creatureBody{
    background:linear-gradient(
        145deg,
        #b99165,
        #67452d
    );
}

.ice .creatureBody{
    background:linear-gradient(
        145deg,
        #d9ffff,
        #67bde4
    );
}

.shadow .creatureBody{
    background:linear-gradient(
        145deg,
        #7d68aa,
        #261b3f
    );
}

.mystic .creatureBody{
    background:linear-gradient(
        145deg,
        #f69cff,
        #7952d6
    );
}

.air .creatureBody{
    background:linear-gradient(
        145deg,
        #e5ffff,
        #83bce7
    );
}

.poison .creatureBody{
    background:linear-gradient(
        145deg,
        #c86be9,
        #632a87
    );
}

.legendary .creatureBody{
    background:
        linear-gradient(
            145deg,
            #fff7a3,
            #c68dff
        );

    box-shadow:
        0 0 20px #f6d66b,
        inset -6px -6px 0 rgba(0,0,0,.1);
}

/* =========================
   JOYSTICK
========================= */

#joystick{
    position:fixed;
    z-index:4000;

    left:25px;
    bottom:25px;

    width:135px;
    height:135px;

    border-radius:50%;

    background:rgba(5,20,13,.5);

    border:2px solid rgba(255,255,255,.15);

    touch-action:none;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:58px;
    height:58px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:linear-gradient(
        145deg,
        #78f2a9,
        #2eaf68
    );

    border:3px solid rgba(255,255,255,.7);
}

/* =========================
   ENCOUNTER
========================= */

#encounter{
    position:fixed;
    inset:0;
    z-index:6000;

    display:none;

    flex-direction:column;
    justify-content:space-between;
    align-items:center;

    padding:45px 20px 30px;

    text-align:center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(75,230,139,.25),
            transparent 38%
        ),
        linear-gradient(
            160deg,
            #06140e,
            #123021,
            #06100b
        );
}

.encounterCreature{
    width:210px;
    height:210px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            white,
            rgba(105,235,155,.08)
        );

    box-shadow:
        0 0 80px rgba(100,240,160,.3);

    animation:float 2.5s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

.encounterCreature .creatureBody{
    width:120px;
    height:105px;

    transform:scale(1.5);
}

.encounterName{
    margin-top:22px;

    font-size:34px;
    font-weight:900;
}

.encounterType{
    margin-top:5px;

    color:#75eca4;
    font-weight:bold;
}

.encounterStats{
    width:100%;
    max-width:400px;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:10px;
}

.statCard{
    padding:12px 7px;

    border-radius:16px;

    background:rgba(255,255,255,.08);
}

.statNumber{
    font-size:18px;
    font-weight:900;
}

.statLabel{
    margin-top:4px;

    color:#99ada2;
    font-size:9px;
}

#ball{
    width:95px;
    height:95px;

    border-radius:50%;

    border:7px solid white;

    background:
        linear-gradient(
            #ed4d4d 0 47%,
            #181818 47% 54%,
            #f4f4f4 54%
        );

    box-shadow:
        0 12px 35px rgba(0,0,0,.45);

    transition:.25s;
}

/* =========================
   RESULT
========================= */

#result{
    position:fixed;
    inset:0;
    z-index:9000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.75);

    backdrop-filter:blur(10px);
}

.resultCard{
    width:100%;
    max-width:380px;

    padding:30px;

    border-radius:28px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #163325,
            #07130d
        );
}

.resultArt{
    width:120px;
    height:120px;

    margin:auto;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:rgba(255,255,255,.08);
}

.resultArt .creatureBody{
    transform:scale(1.5);
}

.resultTitle{
    margin-top:20px;

    font-size:27px;
    font-weight:900;
}

.resultText{
    margin-top:10px;

    color:#b9cec3;
}

.resultButton{
    width:100%;

    margin-top:22px;

    padding:15px;

    border:0;
    border-radius:15px;

    background:#70efa2;

    color:#07120e;

    font-size:16px;
    font-weight:900;
}

/* =========================
   DEX
========================= */

.modal{
    position:fixed;
    inset:0;

    z-index:7000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.7);

    backdrop-filter:blur(8px);
}

.modalCard{
    width:100%;
    max-width:470px;

    max-height:82vh;

    overflow-y:auto;

    padding:22px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #142b20,
            #08140e
        );
}

.modalTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;

    font-size:22px;
    font-weight:900;
}

.close{
    border:0;
    background:transparent;
    color:white;

    font-size:28px;
}

.dexGrid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:11px;

    margin-top:20px;
}

.dexCard{
    min-height:155px;

    padding:14px;

    border-radius:18px;

    text-align:center;

    background:rgba(255,255,255,.07);
}

.dexNumber{
    color:#758d81;
    font-size:10px;
}

.dexArt{
    height:75px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.dexArt .creatureBody{
    transform:scale(.9);
}

.dexName{
    font-weight:900;
}

.dexType{
    margin-top:4px;

    color:#73eaa0;

    font-size:10px;
}

.dexRarity{
    margin-top:4px;

    color:#aabbb2;

    font-size:9px;
}

.locked{
    opacity:.35;
    filter:grayscale(1);
}

/* =========================
   MOBILE
========================= */

@media(max-height:650px){

    .encounterCreature{
        width:150px;
        height:150px;
    }

    .encounterCreature .creatureBody{
        transform:scale(1.05);
    }

    #ball{
        width:75px;
        height:75px;
    }
}
</style>
</head>

<body>

<!-- START -->

<section id="startScreen">

    <div class="logoCreature"></div>

    <h1>Creaturen Trail</h1>

    <div class="subtitle">
        Ontdek • Vind • Vang
    </div>

    <button
        class="startButton"
        onclick="startGame()"
    >
        START AVONTUUR
    </button>

</section>


<!-- GAME -->

<section id="game">

    <div id="map"></div>

    <div class="hud">

        <div class="hudBox">

            <div class="title">
                🐾 Creaturen Trail
            </div>

            <div class="level">
                LEVEL <span id="level">1</span>
            </div>

            <div class="xpBar">
                <div
                    id="xpFill"
                    class="xpFill"
                ></div>
            </div>

        </div>

        <div class="hudBox stats">

            ⭐ <span id="xp">0</span> XP

            <br>

            🎒 <span id="count">0</span> Creaturen

        </div>

    </div>


    <div class="menu">

        <button onclick="openDex()">
            📖
        </button>

        <button onclick="centerPlayer()">
            📍
        </button>

        <button onclick="spawnNearPlayer()">
            👾
        </button>

    </div>


    <div class="messageBox">
        <span id="message">
            Zoek naar Creaturen!
        </span>
    </div>


    <div id="joystick">

        <div id="stick"></div>

    </div>

</section>


<!-- ENCOUNTER -->

<section id="encounter">

    <div style="width:100%;display:flex;justify-content:space-between">

        <button
            onclick="closeEncounter()"
            style="
                width:48px;
                height:48px;
                border:0;
                border-radius:15px;
                background:rgba(255,255,255,.1);
                color:white;
                font-size:22px;
            "
        >
            ←
        </button>

        <div
            id="rarity"
            style="
                padding:10px 14px;
                border-radius:20px;
                background:rgba(255,255,255,.1);
                color:#9ff8bd;
                font-size:11px;
                font-weight:900;
            "
        >
            GEWOON
        </div>

    </div>


    <div>

        <div
            id="encounterArt"
            class="encounterCreature"
        ></div>

        <div
            id="encounterName"
            class="encounterName"
        >
            Blazik
        </div>

        <div
            id="encounterType"
            class="encounterType"
        >
            Vuur
        </div>

    </div>


    <div class="encounterStats">

        <div class="statCard">
            <div
                id="power"
                class="statNumber"
            >
                65
            </div>
            <div class="statLabel">
                KRACHT
            </div>
        </div>

        <div class="statCard">
            <div
                id="chance"
                class="statNumber"
            >
                75%
            </div>
            <div class="statLabel">
                VANGKANS
            </div>
        </div>

        <div class="statCard">
            <div
                id="creatureXP"
                class="statNumber"
            >
                +10
            </div>
            <div class="statLabel">
                XP
            </div>
        </div>

    </div>


    <div>

        <button
            id="ball"
            onclick="throwBall()"
        ></button>

        <div
            style="
                margin-top:10px;
                color:#b7c9bf;
                font-size:12px;
            "
        >
            Tik op de vangbal!
        </div>

    </div>

</section>


<!-- RESULT -->

<section id="result">

    <div class="resultCard">

        <div
            id="resultArt"
            class="resultArt"
        ></div>

        <div
            id="resultTitle"
            class="resultTitle"
        >
            Gevangen!
        </div>

        <div
            id="resultText"
            class="resultText"
        ></div>

        <button
            class="resultButton"
            onclick="closeResult()"
        >
            DOORGAAN
        </button>

    </div>

</section>


<!-- DEX -->

<div
    id="dexModal"
    class="modal"
>

    <div class="modalCard">

        <div class="modalTitle">

            <span>📖 Creaturen-Dex</span>

            <button
                class="close"
                onclick="closeDex()"
            >
                ×
            </button>

        </div>

        <div
            id="dexGrid"
            class="dexGrid"
        ></div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   VARIABLES
========================================================= */

let map;
let playerMarker;
let playerPosition;

let spawnedCreatures=[];

let selectedMarker=null;
let selectedCreature=null;

let caughtCreatures=[];

let xp=0;
let totalCaught=0;

let joystickActive=false;
let moveX=0;
let moveY=0;

let joystickCenter={
    x:0,
    y:0
};


/* =========================================================
   ARTWORK HTML
========================================================= */

function creatureArt(creature,large=false){

    let extra="";

    if(creature.class==="fire"){

        extra=`
            <div class="horn left"></div>
            <div class="horn right"></div>
        `;

    }

    if(creature.class==="water"){

        extra=`
            <div class="fin left"></div>
            <div class="fin right"></div>
        `;

    }

    if(creature.class==="nature"){

        extra=`
            <div class="leaf left"></div>
            <div class="leaf right"></div>
        `;

    }

    if(creature.class==="electric"){

        extra=`
            <div class="bolt left"></div>
            <div class="bolt right"></div>
        `;

    }

    return `
        <div class="creatureBody ${creature.class}">

            ${extra}

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="mouth"></div>

        </div>
    `;
}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    document
        .getElementById("startScreen")
        .style.display="none";

    document
        .getElementById("game")
        .style.display="block";

    createMap();

    setupJoystick();

    locatePlayer();
}


/* =========================================================
   MAP
========================================================= */

function createMap(){

    map=L.map("map").setView(
        [52.3676,4.9041],
        17
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);
}


/* =========================================================
   GPS
========================================================= */

function locatePlayer(){

    if(!navigator.geolocation){

        setPlayerPosition(
            52.3676,
            4.9041
        );

        spawnInitial();

        return;
    }

    navigator.geolocation.getCurrentPosition(

        pos=>{

            setPlayerPosition(
                pos.coords.latitude,
                pos.coords.longitude
            );

            spawnInitial();

        },

        ()=>{

            setPlayerPosition(
                52.3676,
                4.9041
            );

            spawnInitial();

        },

        {
            enableHighAccuracy:true,
            timeout:10000
        }
    );
}


/* =========================================================
   PLAYER
========================================================= */

function setPlayerPosition(lat,lng){

    playerPosition=[lat,lng];

    const icon=L.divIcon({
        className:"",
        html:`<div class="playerMarker"></div>`,
        iconSize:[30,30],
        iconAnchor:[15,15]
    });

    if(!playerMarker){

        playerMarker=L.marker(
            [lat,lng],
            {icon}
        ).addTo(map);

        map.setView(
            [lat,lng],
            18
        );

    }else{

        playerMarker.setLatLng(
            [lat,lng]
        );

    }
}


/* =========================================================
   SPAWNS
========================================================= */

function spawnInitial(){

    for(let i=0;i<12;i++){

        spawnCreature();

    }

    message(
        "👀 Zoek Creaturen op de kaart!"
    );
}


function chooseCreature(){

    const random=Math.random();

    let pool;

    if(random<.55){

        pool=creatures.filter(
            c=>c.rarity==="Gewoon"
        );

    }else if(random<.88){

        pool=creatures.filter(
            c=>c.rarity==="Zeldzaam"
        );

    }else if(random<.985){

        pool=creatures.filter(
            c=>c.rarity==="Episch"
        );

    }else{

        pool=creatures.filter(
            c=>
                c.rarity==="Legendarisch" ||
                c.rarity==="Mythisch"
        );

    }

    return pool[
        Math.floor(
            Math.random()*pool.length
        )
    ];
}


function spawnCreature(){

    if(!playerPosition)
        return;

    const creature=chooseCreature();

    const angle=
        Math.random()*
        Math.PI*2;

    const distance=
        .0006+
        Math.random()*.0025;

    const lat=
        playerPosition[0]+
        Math.cos(angle)*distance;

    const lng=
        playerPosition[1]+
        Math.sin(angle)*distance;

    const icon=L.divIcon({

        className:"",

        html:`
            <div
                class="creatureMarker"
                data-id="${creature.id}"
            >
                ${creatureArt(creature)}
            </div>
        `,

        iconSize:[72,72],

        iconAnchor:[36,36]

    });

    const marker=L.marker(
        [lat,lng],
        {icon}
    ).addTo(map);

    marker.creatureData=creature;

    marker.on(
        "click",
        ()=>{

            const p=marker.getLatLng();

            const distance=getDistance(
                playerPosition[0],
                playerPosition[1],
                p.lat,
                p.lng
            );

            if(distance<=60){

                openEncounter(
                    marker,
                    creature
                );

            }else{

                message(
                    "🚶 Nog "+
                    Math.round(distance)+
                    " meter!"
                );

            }

        }
    );

    spawnedCreatures.push(marker);
}


function spawnNearPlayer(){

    if(!playerPosition)
        return;

    const creature=chooseCreature();

    const angle=
        Math.random()*Math.PI*2;

    const distance=
        .00015+
        Math.random()*.00035;

    const lat=
        playerPosition[0]+
        Math.cos(angle)*distance;

    const lng=
        playerPosition[1]+
        Math.sin(angle)*distance;

    const icon=L.divIcon({

        className:"",

        html:`
            <div class="creatureMarker">
                ${creatureArt(creature)}
            </div>
        `,

        iconSize:[72,72],

        iconAnchor:[36,36]

    });

    const marker=L.marker(
        [lat,lng],
        {icon}
    ).addTo(map);

    marker.creatureData=creature;

    marker.on(
        "click",
        ()=>{
            openEncounter(
                marker,
                creature
            );
        }
    );

    spawnedCreatures.push(marker);

    message(
        "👾 Een Creature is vlakbij!"
    );
}


/* =========================================================
   ENCOUNTER
========================================================= */

function openEncounter(marker,creature){

    selectedMarker=marker;
    selectedCreature=creature;

    document
        .getElementById("encounterArt")
        .innerHTML=
        creatureArt(creature,true);

    document
        .getElementById("encounterName")
        .innerText=
        creature.name;

    document
        .getElementById("encounterType")
        .innerText=
        creature.type;

    document
        .getElementById("rarity")
        .innerText=
        creature.rarity.toUpperCase();

    document
        .getElementById("power")
        .innerText=
        creature.power;

    document
        .getElementById("chance")
        .innerText=
        creature.catchChance+"%";

    document
        .getElementById("creatureXP")
        .innerText=
        "+"+creature.xp;

    document
        .getElementById("encounter")
        .style.display=
        "flex";
}


function closeEncounter(){

    document
        .getElementById("encounter")
        .style.display=
        "none";

    selectedMarker=null;
    selectedCreature=null;

    document
        .getElementById("ball")
        .style.transform="";
}


/* =========================================================
   CATCH
========================================================= */

function throwBall(){

    if(!selectedCreature)
        return;

    const ball=
        document.getElementById("ball");

    ball.style.transform=
        "translateY(-150px) scale(.6) rotate(360deg)";

    setTimeout(
        resolveCatch,
        850
    );
}


function resolveCatch(){

    if(!selectedCreature)
        return;

    const success=
        Math.random()*100 <=
        selectedCreature.catchChance;

    if(success){

        catchSuccess();

    }else{

        catchFail();

    }
}


function catchSuccess(){

    const creature=selectedCreature;

    if(selectedMarker){

        map.removeLayer(
            selectedMarker
        );

        spawnedCreatures=
            spawnedCreatures.filter(
                m=>m!==selectedMarker
            );
    }

    caughtCreatures.push(
        creature.id
    );

    totalCaught++;

    xp+=creature.xp;

    updateStats();

    document
        .getElementById("resultArt")
        .innerHTML=
        creatureArt(creature);

    document
        .getElementById("resultTitle")
        .innerText=
        "🎉 "+creature.name+" gevangen!";

    document
        .getElementById("resultText")
        .innerText=
        "Toegevoegd aan je Creaturen-Dex. +"+
        creature.xp+
        " XP";

    document
        .getElementById("result")
        .style.display=
        "flex";

    document
        .getElementById("ball")
        .style.transform="";

}


function catchFail(){

    document
        .getElementById("resultArt")
        .innerHTML=
        `<div style="font-size:70px">💨</div>`;

    document
        .getElementById("resultTitle")
        .innerText=
        "Ontsnapt!";

    document
        .getElementById("resultText")
        .innerText=
        selectedCreature.name+
        " wist uit de vangbal te komen.";

    document
        .getElementById("result")
        .style.display=
        "flex";

    document
        .getElementById("ball")
        .style.transform="";
}


function closeResult(){

    document
        .getElementById("result")
        .style.display=
        "none";

    closeEncounter();

    setTimeout(
        spawnCreature,
        1000
    );
}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    const level=
        Math.floor(xp/100)+1;

    const progress=
        xp%100;

    document
        .getElementById("xp")
        .innerText=
        xp;

    document
        .getElementById("count")
        .innerText=
        totalCaught;

    document
        .getElementById("level")
        .innerText=
        level;

    document
        .getElementById("xpFill")
        .style.width=
        progress+"%";
}


/* =========================================================
   DEX
========================================================= */

function openDex(){

    renderDex();

    document
        .getElementById("dexModal")
        .style.display=
        "flex";
}


function closeDex(){

    document
        .getElementById("dexModal")
        .style.display=
        "none";
}


function renderDex(){

    const grid=
        document.getElementById(
            "dexGrid"
        );

    grid.innerHTML="";

    creatures.forEach(
        creature=>{

            const caught=
                caughtCreatures.includes(
                    creature.id
                );

            const card=
                document.createElement(
                    "div"
                );

            card.className=
                "dexCard"+
                (
                    caught
                    ? ""
                    : " locked"
                );

            card.innerHTML=`

                <div class="dexNumber">
                    #${String(
                        creature.id
                    ).padStart(3,"0")}
                </div>

                <div class="dexArt">

                    ${
                        caught
                        ? creatureArt(creature)
                        : "❔"
                    }

                </div>

                <div class="dexName">

                    ${
                        caught
                        ? creature.name
                        : "Onbekend"
                    }

                </div>

                <div class="dexType">

                    ${
                        caught
                        ? creature.type
                        : "???"
                    }

                </div>

                <div class="dexRarity">

                    ${
                        caught
                        ? creature.rarity
                        : "Nog niet ontdekt"
                    }

                </div>
            `;

            grid.appendChild(card);

        }
    );
}


/* =========================================================
   JOYSTICK
========================================================= */

function setupJoystick(){

    const joystick=
        document.getElementById(
            "joystick"
        );

    const stick=
        document.getElementById(
            "stick"
        );

    function start(e){

        joystickActive=true;

        const r=
            joystick.getBoundingClientRect();

        joystickCenter.x=
            r.left+r.width/2;

        joystickCenter.y=
            r.top+r.height/2;

        moveJoystick(e);
    }

    function move(e){

        if(!joystickActive)
            return;

        moveJoystick(e);
    }

    function end(){

        joystickActive=false;

        moveX=0;
        moveY=0;

        stick.style.left="50%";
        stick.style.top="50%";
    }

    joystick.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    joystick.addEventListener(
        "touchmove",
        move,
        {passive:false}
    );

    joystick.addEventListener(
        "touchend",
        end
    );

    joystick.addEventListener(
        "mousedown",
        start
    );

    document.addEventListener(
        "mousemove",
        move
    );

    document.addEventListener(
        "mouseup",
        end
    );
}


function moveJoystick(e){

    e.preventDefault();

    let x;
    let y;

    if(
        e.touches &&
        e.touches.length
    ){

        x=e.touches[0].clientX;
        y=e.touches[0].clientY;

    }else{

        x=e.clientX;
        y=e.clientY;

    }

    let dx=
        x-joystickCenter.x;

    let dy=
        y-joystickCenter.y;

    const max=42;

    const distance=
        Math.sqrt(
            dx*dx+
            dy*dy
        );

    if(distance>max){

        dx=
            dx/distance*max;

        dy=
            dy/distance*max;

    }

    moveX=dx/max;
    moveY=dy/max;

    const stick=
        document.getElementById(
            "stick"
        );

    stick.style.left=
        `calc(50% + ${dx}px)`;

    stick.style.top=
        `calc(50% + ${dy}px)`;
}


/* =========================================================
   MOVEMENT
========================================================= */

setInterval(
    movePlayer,
    50
);


function movePlayer(){

    if(
        !playerPosition ||
        (!moveX && !moveY)
    )
        return;

    const speed=.000045;

    const lat=
        playerPosition[0]-
        moveY*speed;

    const lng=
        playerPosition[1]+
        moveX*speed;

    setPlayerPosition(
        lat,
        lng
    );

    map.panTo(
        playerPosition,
        {
            animate:false
        }
    );
}


/* =========================================================
   CENTER
========================================================= */

function centerPlayer(){

    if(!playerPosition)
        return;

    map.setView(
        playerPosition,
        18
    );
}


/* =========================================================
   DISTANCE
========================================================= */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R=6371000;

    const dLat=
        (lat2-lat1)*
        Math.PI/180;

    const dLon=
        (lon2-lon1)*
        Math.PI/180;

    const a=
        Math.sin(dLat/2)*
        Math.sin(dLat/2)+

        Math.cos(
            lat1*Math.PI/180
        )*

        Math.cos(
            lat2*Math.PI/180
        )*

        Math.sin(dLon/2)*
        Math.sin(dLon/2);

    const c=
        2*
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R*c;
}


/* =========================================================
   MESSAGE
========================================================= */

function message(text){

    document
        .getElementById("message")
        .innerText=
        text;
}
