<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creaturen Trail</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #07120f;
            color: white;
        }


        /* =================================
           STARTSCHERM
        ================================= */

        #startScreen {

            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 25px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 25%,
                    rgba(55, 160, 100, 0.25),
                    transparent 35%
                ),
                linear-gradient(
                    160deg,
                    #07120f,
                    #0d241b 50%,
                    #07120f
                );

            z-index: 9999;
        }


        /* bewegende lichtbollen */

        .glow {

            position: absolute;

            width: 220px;
            height: 220px;

            border-radius: 50%;

            filter: blur(60px);

            opacity: 0.25;

            animation:
                floatGlow 7s ease-in-out infinite;

            pointer-events: none;
        }


        .glow.one {

            background: #39c979;

            top: -70px;
            left: -70px;
        }


        .glow.two {

            background: #5c8cff;

            right: -80px;
            bottom: -80px;

            animation-delay: -3s;
        }


        @keyframes floatGlow {

            0%,
            100% {
                transform: translate(
                    0,
                    0
                );
            }

            50% {
                transform: translate(
                    25px,
                    -20px
                );
            }

        }


        /* LOGO */

        .logo-icon {

            width: 105px;
            height: 105px;

            border-radius: 30px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 58px;

            margin-bottom: 22px;

            background:
                linear-gradient(
                    145deg,
                    #53d88a,
                    #267e52
                );

            box-shadow:
                0 20px 50px rgba(0,0,0,0.45),
                inset 0 2px 0 rgba(255,255,255,0.25);

            animation:
                logoFloat 3s ease-in-out infinite;
        }


        @keyframes logoFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            50% {
                transform:
                    translateY(-8px)
                    rotate(2deg);
            }

        }


        #startScreen h1 {

            margin: 0;

            font-size: clamp(
                38px,
                10vw,
                58px
            );

            letter-spacing: -2px;

            font-weight: 900;

            text-shadow:
                0 5px 25px rgba(0,0,0,0.5);
        }


        .tagline {

            margin-top: 12px;

            color: #b8c9c0;

            font-size: 17px;

            letter-spacing: 1px;
        }


        /* START BUTTON */

        .start-button {

            position: relative;

            margin-top: 45px;

            min-width: 245px;

            padding: 18px 30px;

            border: 0;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #6df0a2,
                    #35b86f
                );

            color: #07120f;

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 1px;

            cursor: pointer;

            box-shadow:
                0 12px 30px
                rgba(40, 190, 110, 0.28);

            transition:
                transform 0.15s,
                box-shadow 0.15s;
        }


        .start-button:active {

            transform:
                scale(0.96);

            box-shadow:
                0 5px 15px
                rgba(40, 190, 110, 0.2);
        }


        .start-small {

            margin-top: 15px;

            color: #70877d;

            font-size: 12px;
        }


        /* =================================
           GAME
        ================================= */

        #game {

            display: none;

            position: fixed;

            inset: 0;

            background: #101827;
        }


        #map {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;
        }


        /* =================================
           TOP HUD
        ================================= */

        .top-hud {

            position: fixed;

            top: 15px;

            left: 15px;
            right: 15px;

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            z-index: 2000;

            pointer-events: none;
        }


        .hud-card {

            padding: 10px 14px;

            border-radius: 17px;

            background:
                rgba(
                    8,
                    18,
                    15,
                    0.88
                );

            backdrop-filter:
                blur(12px);

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.25);
        }


        .game-title {

            font-size: 15px;

            font-weight: 900;
        }


        .level {

            color: #75e9a3;

            font-size: 12px;

            margin-top: 3px;
        }


        .stats {

            text-align: right;

            font-size: 12px;

            color: #d4dfda;

            line-height: 1.5;
        }


        /* =================================
           BOTTOM HUD
        ================================= */

        #messageBox {

            position: fixed;

            left: 50%;

            bottom: 18px;

            transform:
                translateX(-50%);

            width:
                calc(100% - 30px);

            max-width: 460px;

            padding: 15px;

            border-radius: 20px;

            background:
                rgba(
                    8,
                    18,
                    15,
                    0.92
                );

            backdrop-filter:
                blur(15px);

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.35);

            text-align: center;

            z-index: 3000;
        }


        #message {

            font-size: 14px;

            color: #dce8e1;
        }


        #catchButton {

            display: none;

            width: 100%;

            margin-top: 12px;

            padding: 15px;

            border: 0;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #6df0a2,
                    #35b86f
                );

            color: #07120f;

            font-size: 16px;

            font-weight: 900;

            cursor: pointer;
        }


        #catchButton:disabled {

            background: #59625e;

            color: #c5cbc8;

            cursor: not-allowed;

        }


        /* =================================
           GPS BUTTON
        ================================= */

        #locationButton {

            position: fixed;

            right: 16px;

            bottom: 145px;

            width: 52px;
            height: 52px;

            border: 0;

            border-radius: 17px;

            background:
                rgba(
                    8,
                    18,
                    15,
                    0.92
                );

            color: white;

            font-size: 22px;

            z-index: 2500;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.3);
        }


        /* =================================
           MAP MARKERS
        ================================= */

        .player-marker {

            width: 30px;
            height: 30px;

            border-radius: 50%;

            background:
                #4d91ff;

            border:
                4px solid white;

            box-shadow:
                0 0 0 9px
                rgba(
                    77,
                    145,
                    255,
                    0.22
                ),
                0 3px 12px
                rgba(0,0,0,0.5);
        }


        .creature-marker {

            width: 58px;
            height: 58px;

            display: flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #e8f1ed
                );

            border:
                3px solid
                rgba(
                    10,
                    30,
                    20,
                    0.8
                );

            font-size: 31px;

            box-shadow:
                0 8px 20px
                rgba(0,0,0,0.4);

            animation:
                creatureFloat
                2.4s
                ease-in-out
                infinite;
        }


        @keyframes creatureFloat {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-7px);
            }

        }


        .leaflet-control-zoom {

            border: 0 !important;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.3) !important;
        }


        .leaflet-control-zoom a {

            background:
                rgba(
                    8,
                    18,
                    15,
                    0.9
                ) !important;

            color: white !important;

            border: 0 !important;
        }


        .leaflet-control-attribution {

            font-size: 8px;
        }

    </style>
</head>


<body>


<!-- =================================
     STARTSCHERM
================================= -->

<section id="startScreen">

    <div class="glow one"></div>
    <div class="glow two"></div>


    <div class="logo-icon">
        🐾
    </div>


    <h1>
        Creaturen Trail
    </h1>


    <div class="tagline">
        Ontdek. Vind. Vang.
    </div>


    <button
        class="start-button"
        onclick="startGame()"
    >
        START AVONTUUR
    </button>


    <div class="start-small">
        Jouw avontuur begint hier
    </div>

</section>


<!-- =================================
     GAME
================================= -->

<section id="game">


    <div id="map"></div>


    <div class="top-hud">


        <div class="hud-card">

            <div class="game-title">
                🐾 Creaturen Trail
            </div>

            <div class="level">
                LEVEL <span id="level">1</span>
            </div>

        </div>


        <div class="hud-card stats">

            ⭐ XP:
            <span id="xp">0</span>

            <br>

            🎒
            <span id="count">0</span>
            Creaturen

        </div>


    </div>


    <button
        id="locationButton"
        onclick="goToPlayer()"
    >
        📍
    </button>


    <div id="messageBox">

        <div id="message">
            📍 Je locatie wordt gezocht...
        </div>


        <button
            id="catchButton"
            onclick="catchCreature()"
            disabled
        >
            🎯 VANG CREATURE
        </button>

    </div>


</section>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

    /* =================================
       GAME VARIABLES
    ================================= */

    let xp = 0;

    let creatureCount = 0;

    let selectedCreature = null;

    let map = null;

    let playerMarker = null;

    let playerPosition = null;

    let watchId = null;


    const CATCH_DISTANCE = 50;


    const creatureTypes = [

        {
            name: "Blazik",
            emoji: "🔥"
        },

        {
            name: "Aquari",
            emoji: "💧"
        },

        {
            name: "Leafy",
            emoji: "🌿"
        },

        {
            name: "Sparko",
            emoji: "⚡"
        },

        {
            name: "Rocko",
            emoji: "🪨"
        },

        {
            name: "Mysti",
            emoji: "✨"
        }

    ];


    /* =================================
       START GAME
    ================================= */

    function startGame() {

        document
            .getElementById(
                "startScreen"
            )
            .style.display = "none";


        document
            .getElementById(
                "game"
            )
            .style.display = "block";


        createMap();

        findPlayer();

    }


    /* =================================
       MAP
    ================================= */

    function createMap() {

        map =
            L.map("map")
            .setView(
                [52.3676, 4.9041],
                16
            );


        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {

                maxZoom: 19,

                attribution:
                    "&copy; OpenStreetMap contributors"

            }
        ).addTo(map);

    }


    /* =================================
       GPS
    ================================= */

    function findPlayer() {

        showMessage(
            "📍 Je locatie wordt gezocht..."
        );


        if (
            !navigator.geolocation
        ) {

            showMessage(
                "⚠️ GPS wordt niet ondersteund."
            );

            useDefaultLocation();

            return;

        }


        navigator.geolocation.getCurrentPosition(

            function(position) {

                updatePlayerPosition(
                    position
                );


                watchId =
                    navigator.geolocation.watchPosition(

                        function(position) {

                            updatePlayerPosition(
                                position
                            );

                        },

                        function(error) {

                            console.log(error);

                        },

                        {

                            enableHighAccuracy: true,

                            maximumAge: 5000,

                            timeout: 10000

                        }

                    );

            },


            function(error) {

                console.log(error);

                showMessage(
                    "⚠️ GPS kon niet worden gebruikt."
                );

                useDefaultLocation();

            },

            {

                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 0

            }

        );

    }


    /* =================================
       PLAYER UPDATE
    ================================= */

    function updatePlayerPosition(
        position
    ) {

        const latitude =
            position.coords.latitude;


        const longitude =
            position.coords.longitude;


        playerPosition = [
            latitude,
            longitude
        ];


        showPlayer(
            latitude,
            longitude
        );


        checkSelectedCreatureDistance();

    }


    /* =================================
       PLAYER
    ================================= */

    function showPlayer(
        latitude,
        longitude
    ) {

        const playerIcon =
            L.divIcon({

                className: "",

                html:
                    '<div class="player-marker"></div>',

                iconSize: [
                    30,
                    30
                ],

                iconAnchor: [
                    15,
                    15
                ]

            });


        if (
            playerMarker
        ) {

            playerMarker.setLatLng(
                [
                    latitude,
                    longitude
                ]
            );

        } else {

            playerMarker =
                L.marker(
                    [
                        latitude,
                        longitude
                    ],
                    {
                        icon:
                            playerIcon
                    }
                )
                .addTo(map);


            map.setView(
                [
                    latitude,
                    longitude
                ],
                17
            );


            spawnCreatures(
                latitude,
                longitude
            );

        }

    }


    /* =================================
       DEFAULT LOCATION
    ================================= */

    function useDefaultLocation() {

        const latitude =
            52.3676;


        const longitude =
            4.9041;


        playerPosition = [
            latitude,
            longitude
        ];


        showPlayer(
            latitude,
            longitude
        );

    }


    /* =================================
       CREATURES
    ================================= */

    function spawnCreatures(
        latitude,
        longitude
    ) {

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            spawnCreature(
                latitude,
                longitude
            );

        }

    }


    function spawnCreature(
        latitude,
        longitude
    ) {

        const creature =
            creatureTypes[
                Math.floor(
                    Math.random() *
                    creatureTypes.length
                )
            ];


        const distance =
            0.0005 +
            Math.random() *
            0.0025;


        const angle =
            Math.random() *
            Math.PI *
            2;


        const creatureLat =
            latitude +
            Math.cos(angle) *
            distance;


        const creatureLng =
            longitude +
            Math.sin(angle) *
            distance;


        const icon =
            L.divIcon({

                className: "",

                html:
                    '<div class="creature-marker">' +
                    creature.emoji +
                    "</div>",

                iconSize: [
                    58,
                    58
                ],

                iconAnchor: [
                    29,
                    29
                ]

            });


        const marker =
            L.marker(
                [
                    creatureLat,
                    creatureLng
                ],
                {
                    icon: icon
                }
            )
            .addTo(map);


        marker.creatureData =
            creature;


        marker.on(
            "click",
            function() {

                selectCreature(
                    marker,
                    creature
                );

            }
        );

    }


    /* =================================
       SELECT CREATURE
    ================================= */

    function selectCreature(
        marker,
        creature
    ) {

        selectedCreature =
            marker;


        checkSelectedCreatureDistance();


        if (
            playerPosition
        ) {

            const location =
                marker.getLatLng();


            const distance =
                getDistance(
                    playerPosition[0],
                    playerPosition[1],
                    location.lat,
                    location.lng
                );


            if (
                distance <=
                CATCH_DISTANCE
            ) {

                showMessage(
                    "👾 " +
                    creature.name +
                    " is dichtbij! Vang hem!"
                );

            } else {

                showMessage(
                    "👾 " +
                    creature.name +
                    " is " +
                    Math.round(distance) +
                    " meter weg."
                );

            }

        }

    }


    /* =================================
       CHECK DISTANCE
    ================================= */

    function checkSelectedCreatureDistance() {

        const button =
            document.getElementById(
                "catchButton"
            );


        if (
            !selectedCreature ||
            !playerPosition
        ) {

            button.style.display =
                "none";

            return;

        }


        const location =
            selectedCreature.getLatLng();


        const distance =
            getDistance(
                playerPosition[0],
                playerPosition[1],
                location.lat,
                location.lng
            );


        button.style.display =
            "block";


        if (
            distance <=
            CATCH_DISTANCE
        ) {

            button.disabled =
                false;

            button.innerText =
                "🎯 VANG CREATURE";

        } else {

            button.disabled =
                true;

            button.innerText =
                "📍 " +
                Math.round(distance) +
                " meter afstand";

        }

    }


    /* =================================
       CATCH
    ================================= */

    function catchCreature() {

        if (
            !selectedCreature ||
            !playerPosition
        ) {

            return;

        }


        const location =
            selectedCreature.getLatLng();


        const distance =
            getDistance(
                playerPosition[0],
                playerPosition[1],
                location.lat,
                location.lng
            );


        if (
            distance >
            CATCH_DISTANCE
        ) {

            showMessage(
                "❌ Je bent nog te ver weg!"
            );

            return;

        }


        const creature =
            selectedCreature.creatureData;


        map.removeLayer(
            selectedCreature
        );


        selectedCreature =
            null;


        creatureCount++;

        xp += 10;


        document
            .getElementById("xp")
            .innerText =
            xp;


        document
            .getElementById("count")
            .innerText =
            creatureCount;


        updateLevel();


        document
            .getElementById(
                "catchButton"
            )
            .style.display =
            "none";


        showMessage(
            "🎉 " +
            creature.name +
            " gevangen! +10 XP"
        );


        setTimeout(
            function() {

                if (
                    playerPosition
                ) {

                    spawnCreature(
                        playerPosition[0],
                        playerPosition[1]
                    );

                }

            },
            3000
        );

    }


    /* =================================
       LEVEL
    ================================= */

    function updateLevel() {

        const level =
            Math.floor(
                xp / 100
            ) + 1;


        document
            .getElementById(
                "level"
            )
            .innerText =
            level;

    }


    /* =================================
       DISTANCE
    ================================= */

    function getDistance(
        lat1,
        lon1,
        lat2,
        lon2
    ) {

        const earthRadius =
            6371000;


        const dLat =
            toRadians(
                lat2 - lat1
            );


        const dLon =
            toRadians(
                lon2 - lon1
            );


        const a =
            Math.sin(dLat / 2) *
            Math.sin(dLat / 2) +

            Math.cos(
                toRadians(lat1)
            ) *

            Math.cos(
                toRadians(lat2)
            ) *

            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);


        const c =
            2 *
            Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );


        return earthRadius * c;

    }


    function toRadians(
        degrees
    ) {

        return degrees *
            Math.PI /
            180;

    }


    /* =================================
       LOCATION BUTTON
    ================================= */

    function goToPlayer() {

        if (
            !playerPosition
        ) {

            showMessage(
                "📍 Locatie nog niet gevonden."
            );

            return;

        }


        map.setView(
            playerPosition,
            18
        );

    }


    /* =================================
       MESSAGE
    ================================= */

    function showMessage(
        text
    ) {

        document
            .getElementById(
                "message"
            )
            .innerText =
            text;

    }

</script>

</body>
</html>
