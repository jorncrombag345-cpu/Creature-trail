<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creaturen Trail</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #08111f;
    color: white;
}

button {
    font-family: inherit;
}

.screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    text-align: center;
}

.start-logo {
    font-size: 70px;
    margin-bottom: 10px;
}

h1 {
    font-size: 48px;
    margin: 0;
}

.subtitle {
    color: #9daabd;
    font-size: 18px;
    margin-bottom: 35px;
}

.main-button {
    border: none;
    border-radius: 16px;
    padding: 16px 30px;
    background: white;
    color: #08111f;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin: 6px;
}

.main-button:hover {
    transform: translateY(-2px);
}

#game {
    display: none;
    min-height: 100vh;
    padding: 15px;
}

.topbar {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.top-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.small-button {
    border: 1px solid #33445d;
    background: #121f32;
    color: white;
    padding: 9px 13px;
    border-radius: 11px;
    cursor: pointer;
}

.small-button:hover {
    background: #1c2c43;
}

.stats {
    color: #cbd5e1;
    font-size: 13px;
    text-align: right;
}

.map {
    position: relative;
    width: 100%;
    max-width: 1100px;
    height: 65vh;
    min-height: 430px;
    margin: auto;
    overflow: hidden;
    border-radius: 25px;
    border: 2px solid #324a43;
    background:
        radial-gradient(circle at 20% 20%, #315640 0 7%, transparent 8%),
        radial-gradient(circle at 80% 70%, #315640 0 8%, transparent 9%),
        #183326;
}

.road {
    position: absolute;
    width: 130%;
    height: 60px;
    background: #66716c;
    top: 48%;
    left: -15%;
    transform: rotate(18deg);
}

.road2 {
    position: absolute;
    width: 120%;
    height: 45px;
    background: #66716c;
    top: 20%;
    left: -10%;
    transform: rotate(-55deg);
}

.player {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: white;
    border: 5px solid #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    z-index: 5;
}

.creature {
    position: absolute;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 3px solid white;
    background: linear-gradient(145deg, #657dff, #4054c8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.45);
    transition: .2s;
    z-index: 4;
}

.creature:hover {
    transform: scale(1.12);
}

.message {
    text-align: center;
    color: #cbd5e1;
    margin: 14px;
}

.catch-button {
    display: none;
    margin: auto;
    border: none;
    padding: 14px 25px;
    border-radius: 13px;
    font-weight: bold;
    cursor: pointer;
    background: #fff;
    color: #101827;
}

/* MODALS */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 100;
    padding: 20px;
    align-items: center;
    justify-content: center;
}

.modal-box {
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    background: #101c2d;
    border: 1px solid #33445d;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
}

.close {
    border: none;
    background: #24334a;
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 20px;
}

.card {
    background: #17253a;
    border: 1px solid #2d405b;
    border-radius: 16px;
    padding: 16px;
    margin-top: 12px;
}

.card h3 {
    margin: 0 0 7px;
}

.card p {
    color: #aebbd0;
}

input,
textarea,
select {
    width: 100%;
    margin: 7px 0 12px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #3b4d66;
    background: #0d1828;
    color: white;
    outline: none;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.form-label {
    color: #b9c5d7;
    font-size: 14px;
}

.event-active {
    border: 1px solid #53d38a;
}

.event-completed {
    opacity: .7;
}

.reward {
    font-size: 18px;
    font-weight: bold;
}

.admin-danger {
    background: #5b2530;
}

.admin-success {
    background: #1f5b3e;
}

.friend-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #17253a;
    padding: 13px;
    border-radius: 13px;
    margin-top: 8px;
}

.empty {
    color: #8f9db2;
    text-align: center;
    padding: 25px;
}
</style>
</head>

<body>

<!-- START -->

<section id="startScreen" class="screen">

    <div class="start-logo">🐾</div>

    <h1>Creaturen Trail</h1>

    <p class="subtitle">
        Ontdek. Vind. Vang.
    </p>

    <button class="main-button" onclick="startGame()">
        START AVONTUUR
    </button>

</section>


<!-- GAME -->

<section id="game">

    <div class="topbar">

        <div class="logo">
            🐾 Creaturen Trail
        </div>

        <div class="top-actions">

            <button class="small-button" onclick="openFriends()">
                👥 Friends
            </button>

            <button class="small-button" onclick="openEvents()">
                🎉 Events
            </button>

            <button class="small-button" onclick="openAdmin()">
                ⚙️ Admin
            </button>

        </div>

        <div class="stats">
            ⭐ XP: <span id="xp">0</span><br>
            🎒 Creaturen: <span id="count">0</span>
        </div>

    </div>


    <div class="map" id="map">

        <div class="road"></div>
        <div class="road2"></div>

        <div class="player">
            🧑
        </div>

    </div>


    <p class="message" id="message">
        Zoek naar Creaturen in de omgeving...
    </p>

    <button
        class="catch-button"
        id="catchButton"
        onclick="catchCreature()">
        🎯 VANG CREATURE
    </button>

</section>


<!-- EVENT MODAL -->

<div class="modal" id="eventModal">

    <div class="modal-box">

        <div class="modal-header">
            <h2>🎉 Events</h2>

            <button class="close" onclick="closeModal('eventModal')">
                ×
            </button>
        </div>

        <div id="eventList"></div>

    </div>

</div>


<!-- FRIEND MODAL -->

<div class="modal" id="friendModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>👥 Friends</h2>

            <button class="close" onclick="closeModal('friendModal')">
                ×
            </button>

        </div>

        <div class="card">

            <h3>➕ Friend toevoegen</h3>

            <input
                id="friendName"
                placeholder="Naam van je vriend">

            <button
                class="main-button"
                onclick="addFriend()">
                Vriend toevoegen
            </button>

        </div>

        <div id="friendList"></div>

    </div>

</div>


<!-- ADMIN LOGIN -->

<div class="modal" id="adminLoginModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>🔐 Admin Login</h2>

            <button
                class="close"
                onclick="closeModal('adminLoginModal')">
                ×
            </button>

        </div>

        <p>
            Voer de admin-code in.
        </p>

        <input
            id="adminCode"
            type="password"
            placeholder="Admin code">

        <button
            class="main-button"
            onclick="checkAdminCode()">
            INLOGGEN
        </button>

        <p id="adminLoginMessage"></p>

    </div>

</div>


<!-- ADMIN PANEL -->

<div class="modal" id="adminModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>⚙️ Admin Panel</h2>

            <button
                class="close"
                onclick="closeModal('adminModal')">
                ×
            </button>

        </div>


        <div class="card">

            <h3>🎉 Nieuw Event maken</h3>

            <label class="form-label">
                Naam van event
            </label>

            <input
                id="eventName"
                placeholder="Bijvoorbeeld: Zomer Festival">


            <label class="form-label">
                Beschrijving
            </label>

            <textarea
                id="eventDescription"
                placeholder="Wat moeten spelers doen?"></textarea>


            <label class="form-label">
                Beloning XP
            </label>

            <input
                id="eventReward"
                type="number"
                value="100"
                min="1">


            <label class="form-label">
                Duur
            </label>

            <select id="eventDuration">

                <option value="1">
                    1 dag
                </option>

                <option value="3">
                    3 dagen
                </option>

                <option value="7" selected>
                    7 dagen
                </option>

                <option value="30">
                    30 dagen
                </option>

            </select>


            <button
                class="main-button admin-success"
                onclick="createEvent()">
                ➕ MAAK EVENT
            </button>

        </div>


        <div class="card">

            <h3>📋 Bestaande Events</h3>

            <div id="adminEventList"></div>

        </div>

    </div>

</div>


<script>

const ADMIN_CODE = "5676";

let xp = Number(localStorage.getItem("xp")) || 0;
let creatureCount =
    Number(localStorage.getItem("creatureCount")) || 0;

let selectedCreature = null;

let events =
    JSON.parse(localStorage.getItem("creaturenEvents")) || [];

let friends =
    JSON.parse(localStorage.getItem("creaturenFriends")) || [];


/* =========================
   GAME
========================= */

function startGame() {

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("game").style.display = "block";

    updateStats();

    spawnCreatures();
}


function updateStats() {

    document.getElementById("xp").innerText = xp;

    document.getElementById("count").innerText =
        creatureCount;
}


const creatures = [

    {name:"Flamy", emoji:"🔥"},
    {name:"Bubblu", emoji:"💧"},
    {name:"Leafy", emoji:"🌿"},
    {name:"Sparko", emoji:"⚡"},
    {name:"Rocko", emoji:"🪨"},
    {name:"Frosto", emoji:"❄️"},
    {name:"Mysta", emoji:"🔮"},
    {name:"Shadow", emoji:"🌑"},
    {name:"Sunni", emoji:"☀️"},
    {name:"Berry", emoji:"🍓"},
    {name:"Magma", emoji:"🌋"},
    {name:"Stormy", emoji:"🌪️"}

];


function spawnCreatures() {

    const map = document.getElementById("map");

    for(let i = 0; i < 5; i++) {

        spawnOneCreature();

    }

}


function spawnOneCreature() {

    const map = document.getElementById("map");

    const creature =
        creatures[
            Math.floor(Math.random() * creatures.length)
        ];

    const element =
        document.createElement("div");

    element.className = "creature";

    element.innerHTML = creature.emoji;

    element.title = creature.name;

    element.style.left =
        (8 + Math.random() * 82) + "%";

    element.style.top =
        (8 + Math.random() * 78) + "%";

    element.onclick = function() {

        selectCreature(creature, element);

    };

    map.appendChild(element);

}


function selectCreature(creature, element) {

    selectedCreature = element;

    document.getElementById("message").innerText =
        "✨ Je hebt " +
        creature.name +
        " gevonden!";

    document.getElementById("catchButton").style.display =
        "block";

}


function catchCreature() {

    if(!selectedCreature) return;

    selectedCreature.remove();

    selectedCreature = null;

    creatureCount++;

    xp += 10;

    localStorage.setItem(
        "xp",
        xp
    );

    localStorage.setItem(
        "creatureCount",
        creatureCount
    );

    updateStats();

    document.getElementById("message").innerText =
        "🎉 Creature gevangen! +10 XP";

    document.getElementById("catchButton").style.display =
        "none";

    setTimeout(
        spawnOneCreature,
        1200
    );

}


/* =========================
   MODALS
========================= */

function openModal(id) {

    document.getElementById(id).style.display =
        "flex";

}


function closeModal(id) {

    document.getElementById(id).style.display =
        "none";

}


/* =========================
   EVENTS
========================= */

function openEvents() {

    renderEvents();

    openModal("eventModal");

}


function renderEvents() {

    const list =
        document.getElementById("eventList");

    list.innerHTML = "";

    const now = Date.now();

    const activeEvents =
        events.filter(event =>
            event.active &&
            event.endTime > now
        );

    if(activeEvents.length === 0) {

        list.innerHTML =
            `<div class="empty">
                Er zijn momenteel geen actieve events.
            </div>`;

        return;

    }


    activeEvents.forEach(event => {

        const card =
            document.createElement("div");

        card.className =
            "card event-active";


        const claimed =
            localStorage.getItem(
                "claimedEvent_" + event.id
            );


        card.innerHTML = `

            <h3>🎉 ${escapeHtml(event.name)}</h3>

            <p>
                ${escapeHtml(event.description)}
            </p>

            <div class="reward">
                ⭐ Beloning: ${event.reward} XP
            </div>

            <p>
                ⏳ ${getRemainingTime(event.endTime)}
            </p>

            ${
                claimed
                ?
                `<button class="main-button" disabled>
                    ✅ Beloning geclaimd
                </button>`
                :
                `<button
                    class="main-button"
                    onclick="claimEvent(${event.id})">
                    🎁 CLAIM BELONING
                </button>`
            }

        `;

        list.appendChild(card);

    });

}


function claimEvent(id) {

    const event =
        events.find(e => e.id === id);

    if(!event) return;

    if(!event.active) return;

    if(event.endTime <= Date.now()) {

        alert("Dit event is afgelopen.");

        renderEvents();

        return;

    }


    const key =
        "claimedEvent_" + event.id;


    if(localStorage.getItem(key)) {

        alert("Je hebt deze beloning al geclaimd.");

        return;

    }


    xp += Number(event.reward);

    localStorage.setItem(
        "xp",
        xp
    );

    localStorage.setItem(
        key,
        "true"
    );

    updateStats();

    alert(
        "🎉 Beloning ontvangen! +" +
        event.reward +
        " XP"
    );

    renderEvents();

}


/* =========================
   ADMIN
========================= */

function openAdmin() {

    document.getElementById("adminCode").value = "";

    document.getElementById(
        "adminLoginMessage"
    ).innerText = "";

    openModal("adminLoginModal");

}


function checkAdminCode() {

    const code =
        document.getElementById("adminCode").value;


    if(code === ADMIN_CODE) {

        closeModal("adminLoginModal");

        renderAdminEvents();

        openModal("adminModal");

    } else {

        document.getElementById(
            "adminLoginMessage"
        ).innerText =
            "❌ Verkeerde admin-code.";

    }

}


function createEvent() {

    const name =
        document.getElementById("eventName").value.trim();

    const description =
        document.getElementById(
            "eventDescription"
        ).value.trim();

    const reward =
        Number(
            document.getElementById(
                "eventReward"
            ).value
        );

    const duration =
        Number(
            document.getElementById(
                "eventDuration"
            ).value
        );


    if(!name) {

        alert("Vul een eventnaam in.");

        return;

    }


    if(!description) {

        alert("Vul een beschrijving in.");

        return;

    }


    if(!reward || reward < 1) {

        alert("De XP-beloning moet minimaal 1 zijn.");

        return;

    }


    const startTime =
        Date.now();

    const endTime =
        startTime +
        duration *
        24 *
        60 *
        60 *
        1000;


    const newEvent = {

        id: Date.now(),

        name: name,

        description: description,

        reward: reward,

        duration: duration,

        startTime: startTime,

        endTime: endTime,

        active: true

    };


    events.push(newEvent);


    localStorage.setItem(
        "creaturenEvents",
        JSON.stringify(events)
    );


    document.getElementById("eventName").value = "";

    document.getElementById(
        "eventDescription"
    ).value = "";

    document.getElementById(
        "eventReward"
    ).value = "100";


    renderAdminEvents();


    alert(
        "🎉 Event succesvol gemaakt!"
    );

}


function renderAdminEvents() {

    const list =
        document.getElementById(
            "adminEventList"
        );

    list.innerHTML = "";


    if(events.length === 0) {

        list.innerHTML =
            `<div class="empty">
                Nog geen events gemaakt.
            </div>`;

        return;

    }


    [...events]
        .reverse()
        .forEach(event => {

            const card =
                document.createElement("div");

            card.className =
                "card";


            const expired =
                event.endTime <= Date.now();


            card.innerHTML = `

                <h3>
                    ${escapeHtml(event.name)}
                </h3>

                <p>
                    ${escapeHtml(event.description)}
                </p>

                <p>
                    ⭐ ${event.reward} XP
                </p>

                <p>
                    ${
                        expired
                        ? "⛔ Afgelopen"
                        : event.active
                            ? "🟢 Actief"
                            : "🔴 Uitgeschakeld"
                    }
                </p>

                <button
                    class="main-button"
                    onclick="toggleEvent(${event.id})">

                    ${
                        event.active
                        ? "⏸️ Uitschakelen"
                        : "▶️ Activeren"
                    }

                </button>

                <button
                    class="main-button admin-danger"
                    onclick="deleteEvent(${event.id})">

                    🗑️ Verwijderen

                </button>

            `;

            list.appendChild(card);

        });

}


function toggleEvent(id) {

    const event =
        events.find(e => e.id === id);

    if(!event) return;

    event.active =
        !event.active;


    localStorage.setItem(
        "creaturenEvents",
        JSON.stringify(events)
    );


    renderAdminEvents();

}


function deleteEvent(id) {

    if(
        !confirm(
            "Weet je zeker dat je dit event wilt verwijderen?"
        )
    ) return;


    events =
        events.filter(
            event => event.id !== id
        );


    localStorage.setItem(
        "creaturenEvents",
        JSON.stringify(events)
    );


    renderAdminEvents();

}


/* =========================
   FRIENDS
========================= */

function openFriends() {

    renderFriends();

    openModal("friendModal");

}


function addFriend() {

    const input =
        document.getElementById(
            "friendName"
        );

    const name =
        input.value.trim();


    if(!name) {

        alert("Vul een naam in.");

        return;

    }


    friends.push({

        id: Date.now(),

        name: name

    });


    localStorage.setItem(
        "creaturenFriends",
        JSON.stringify(friends)
    );


    input.value = "";

    renderFriends();

}


function renderFriends() {

    const list =
        document.getElementById(
            "friendList"
        );

    list.innerHTML = "";


    if(friends.length === 0) {

        list.innerHTML =
            `<div class="empty">
                Je hebt nog geen vrienden toegevoegd.
            </div>`;

        return;

    }


    friends.forEach(friend => {

        const row =
            document.createElement("div");

        row.className =
            "friend-row";


        row.innerHTML = `

            <span>
                👤 ${escapeHtml(friend.name)}
            </span>

            <button
                class="small-button"
                onclick="removeFriend(${friend.id})">
                Verwijder
            </button>

        `;


        list.appendChild(row);

    });

}


function removeFriend(id) {

    friends =
        friends.filter(
            friend => friend.id !== id
        );


    localStorage.setItem(
        "creaturenFriends",
        JSON.stringify(friends)
    );


    renderFriends();

}


/* =========================
   HELPERS
========================= */

function getRemainingTime(endTime) {

    const difference =
        endTime - Date.now();


    if(difference <= 0) {

        return "Afgelopen";

    }


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (difference %
            (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
        );


    return (
        days +
        "d " +
        hours +
        "u over"
    );

}


function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   MODAL SLUITEN
========================= */

window.onclick = function(event) {

    const modals =
        document.querySelectorAll(".modal");

    modals.forEach(modal => {

        if(event.target === modal) {

            modal.style.display = "none";

        }

    });

};


/* =========================
   EVENT TIMER UPDATE
========================= */

setInterval(() => {

    const eventModal =
        document.getElementById("eventModal");

    if(
        eventModal.style.display === "flex"
    ) {

        renderEvents();

    }

}, 60000);

</script>

</body>
</html>
