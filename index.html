<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Creaturen Trail</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #07120f;
    color: white;
}

/* ================================
   STARTSCHERM
================================ */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(80,230,140,.25),
            transparent 35%
        ),
        linear-gradient(
            160deg,
            #06110d,
            #123122,
            #06110d
        );
}

.logo {
    width: 115px;
    height: 115px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 34px;

    font-size: 62px;

    background:
        linear-gradient(
            145deg,
            #75f2a8,
            #2b9459
        );

    box-shadow:
        0 20px 55px rgba(0,0,0,.45);
}

#startScreen h1 {
    margin: 22px 0 0;

    font-size:
        clamp(38px, 10vw, 58px);

    font-weight: 900;
}

.subtitle {
    margin-top: 10px;
    color: #b9cec3;
}

.startButton {
    margin-top: 40px;

    min-width: 245px;

    padding: 18px 35px;

    border: none;
    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #72f1a5,
            #31b96c
        );

    color: #07120f;

    font-size: 18px;
    font-weight: 900;
}

/* ================================
   GAME
================================ */

#game {
    display: none;

    position: fixed;
    inset: 0;
}

#map {
    position: absolute;
    inset: 0;
}

/* ================================
   HUD
================================ */

.hud {
    position: fixed;

    top: 14px;
    left: 14px;
    right: 14px;

    z-index: 2000;

    display: flex;
    justify-content: space-between;

    pointer-events: none;
}

.hudBox {
    padding: 11px 14px;

    border-radius: 18px;

    background:
        rgba(6,18,13,.93);

    backdrop-filter: blur(14px);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);
}

.title {
    font-size: 14px;
    font-weight: 900;
}

.level {
    margin-top: 5px;

    color: #73eda3;

    font-size: 11px;
    font-weight: bold;
}

.xpBar {
    width: 145px;
    height: 7px;

    margin-top: 7px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.12);
}

.xpFill {
    width: 0%;
    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #5ee594,
            #c8ff83
        );
}

.stats {
    text-align: right;

    color: #dce7e1;

    font-size: 12px;
    line-height: 1.5;
}

/* ================================
   RECHTS MENU
================================ */

.menu {
    position: fixed;

    right: 14px;
    top: 105px;

    z-index: 2500;

    display: flex;
    flex-direction: column;

    gap: 10px;
}

.menu button {
    width: 51px;
    height: 51px;

    border: none;
    border-radius: 17px;

    background:
        rgba(6,18,13,.93);

    color: white;

    font-size: 21px;
}

/* ================================
   MESSAGE
================================ */

.messageBox {
    position: fixed;

    left: 50%;
    bottom: 145px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 30px);

    max-width: 440px;

    padding: 13px 15px;

    z-index: 3000;

    text-align: center;

    border-radius: 20px;

    background:
        rgba(6,18,13,.94);

    backdrop-filter: blur(15px);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.45);
}

#message {
    font-size: 14px;
}

/* ================================
   CATCH BUTTON
================================ */

#catchButton {
    display: none;

    width: 100%;

    margin-top: 10px;

    padding: 13px;

    border: none;
    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #72efa4,
            #34b96e
        );

    color: #07120f;

    font-weight: 900;
}

/* ================================
   JOYSTICK
================================ */

#joystick {
    position: fixed;

    left: 25px;
    bottom: 25px;

    width: 135px;
    height: 135px;

    z-index: 4000;

    border-radius: 50%;

    background:
        rgba(5,20,13,.45);

    border:
        2px solid
        rgba(255,255,255,.15);

    backdrop-filter: blur(5px);

    touch-action: none;
}

#stick {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 58px;
    height: 58px;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #78f2a9,
            #2eaf68
        );

    border:
        3px solid
        rgba(255,255,255,.7);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.4);

    pointer-events: none;
}

/* ================================
   PLAYER
================================ */

.playerMarker {
    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: #428cff;

    border:
        4px solid white;

    box-shadow:
        0 0 0 9px
        rgba(66,140,255,.22),

        0 4px 14px
        rgba(0,0,0,.5);

    transition:
        transform .1s linear;
}

/* ================================
   CREATURE
================================ */

.creatureMarker {
    width: 60px;
    height: 60px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            white,
            #e5eee9
        );

    border:
        3px solid
        #10251b;

    font-size: 31px;

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.45);

    transition:
        transform .2s,
        filter .2s;
}

.creatureNearby {
    transform: scale(1.35);

    filter:
        drop-shadow(
            0 0 12px
            #71efa4
        );
}

/* ================================
   MODAL
================================ */

.modal {
    position: fixed;

    inset: 0;

    z-index: 7000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.68);
}

.modalCard {
    width: 100%;
    max-width: 430px;

    padding: 22px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #142a20,
            #08140e
        );
}

.modalTitle {
    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 22px;
    font-weight: 900;
}

.close {
    border: none;
    background: transparent;

    color: white;

    font-size: 28px;
}

.grid {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 12px;

    margin-top: 20px;
}

.card {
    padding: 16px;

    border-radius: 18px;

    text-align: center;

    background:
        rgba(255,255,255,.07);
}

.cardEmoji {
    font-size: 40px;
}

.cardName {
    margin-top: 7px;

    font-weight: bold;
}

.cardType {
    margin-top: 5px;

    color: #75e9a3;

    font-size: 10px;
}

/* ================================
   CAPTURE ANIMATION
================================ */

.captureFlash {
    position: fixed;

    inset: 0;

    z-index: 8000;

    pointer-events: none;

    background:
        rgba(255,255,255,.8);

    animation:
        flash .45s ease-out forwards;
}

@keyframes flash {

    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}

</style>
</head>


<body>


<!-- ==========================================
     START
========================================== -->

<section id="startScreen">

    <div class="logo">
        🐾
    </div>

    <h1>
        Creaturen Trail
    </h1>

    <div class="subtitle">
        Ontdek. Vind. Vang.
    </div>

    <button
        class="startButton"
        onclick="startGame()"
    >
        START AVONTUUR
    </button>

</section>


<!-- ==========================================
     GAME
========================================== -->

<section id="game">

    <div id="map"></div>


    <!-- HUD -->

    <div class="hud">

        <div class="hudBox">

            <div class="title">
                🐾 Creaturen Trail
            </div>

            <div class="level">

                LEVEL
                <span id="level">
                    1
                </span>

            </div>

            <div class="xpBar">

                <div
                    id="xpFill"
                    class="xpFill"
                ></div>

            </div>

        </div>


        <div class="hudBox stats">

            ⭐
            <span id="xp">
                0
            </span>

            XP

            <br>

            🎒
            <span id="count">
                0
            </span>

        </div>

    </div>


    <!-- MENU -->

    <div class="menu">

        <button onclick="openCollection()">
            📖
        </button>

        <button onclick="centerPlayer()">
            📍
        </button>

        <button onclick="spawnNearPlayer()">
            👾
        </button>

    </div>


    <!-- MESSAGE -->

    <div class="messageBox">

        <div id="message">
            Gebruik de joystick om te bewegen.
        </div>

        <button
            id="catchButton"
            onclick="catchCreature()"
        >
            🎯 VANG CREATURE
        </button>

    </div>


    <!-- JOYSTICK -->

    <div id="joystick">

        <div id="stick"></div>

    </div>

</section>


<!-- ==========================================
     CREATURE MODAL
========================================== -->

<div
    class="modal"
    id="creatureModal"
>

    <div class="modalCard">

        <div class="modalTitle">

            <span>
                👾 Creature
            </span>

            <button
                class="close"
                onclick="closeCreature()"
            >
                ×
            </button>

        </div>

        <div id="creatureInfo"></div>

    </div>

</div>


<!-- ==========================================
     COLLECTION
========================================== -->

<div
    class="modal"
    id="collectionModal"
>

    <div class="modalCard">

        <div class="modalTitle">

            <span>
                📖 Creaturenboek
            </span>

            <button
                class="close"
                onclick="closeCollection()"
            >
                ×
            </button>

        </div>

        <div
            class="grid"
            id="collectionGrid"
        ></div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* ==========================================
   GAME VARIABLES
========================================== */

let map;

let playerMarker;

let playerPosition = null;

let xp = 0;

let creatureCount = 0;

let collection = [];

let selectedCreature = null;

let selectedCreatureData = null;

let spawnedCreatures = [];


/* ==========================================
   MOVEMENT
========================================== */

let moveX = 0;

let moveY = 0;

let joystickActive = false;

let joystickCenter = {
    x: 0,
    y: 0
};


/* ==========================================
   CREATURES
========================================== */

const creatures = [

    {
        name: "Blazik",
        emoji: "🔥",
        type: "Vuur",
        rarity: "Gewoon",
        power: 65
    },

    {
        name: "Aquari",
        emoji: "💧",
        type: "Water",
        rarity: "Gewoon",
        power: 55
    },

    {
        name: "Leafy",
        emoji: "🌿",
        type: "Natuur",
        rarity: "Gewoon",
        power: 60
    },

    {
        name: "Sparko",
        emoji: "⚡",
        type: "Elektrisch",
        rarity: "Zeldzaam",
        power: 85
    },

    {
        name: "Rocko",
        emoji: "🪨",
        type: "Aarde",
        rarity: "Zeldzaam",
        power: 90
    },

    {
        name: "Mysti",
        emoji: "✨",
        type: "Mystiek",
        rarity: "Episch",
        power: 98
    },

    {
        name: "Frosto",
        emoji: "❄️",
        type: "IJs",
        rarity: "Zeldzaam",
        power: 88
    }

];


/* ==========================================
   START GAME
========================================== */

function startGame() {

    document
        .getElementById("startScreen")
        .style.display = "none";

    document
        .getElementById("game")
        .style.display = "block";

    createMap();

    setupJoystick();

    locatePlayer();

}


/* ==========================================
   MAP
========================================== */

function createMap() {

    map =
        L.map("map")
        .setView(
            [52.3676,4.9041],
            17
        );


    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap contributors"
        }

    ).addTo(map);

}


/* ==========================================
   GPS
========================================== */

function locatePlayer() {

    if (!navigator.geolocation) {

        useDefaultLocation();

        return;

    }


    navigator
        .geolocation
        .getCurrentPosition(

            position => {

                setPlayerPosition(
                    position.coords.latitude,
                    position.coords.longitude
                );

                createCreatures();

            },

            () => {

                useDefaultLocation();

            },

            {

                enableHighAccuracy: true,

                timeout: 10000,

                maximumAge: 5000

            }

        );

}


/* ==========================================
   PLAYER POSITION
========================================== */

function setPlayerPosition(
    lat,
    lng
) {

    playerPosition = [
        lat,
        lng
    ];


    if (!playerMarker) {

        const icon =
            L.divIcon({

                className: "",

                html:
                    '<div class="playerMarker"></div>',

                iconSize: [
                    30,
                    30
                ],

                iconAnchor: [
                    15,
                    15
                ]

            });


        playerMarker =
            L.marker(
                [lat,lng],
                {
                    icon: icon
                }
            )
            .addTo(map);


        map.setView(
            [lat,lng],
            18
        );

    }

    else {

        playerMarker.setLatLng(
            [lat,lng]
        );

    }

}


/* ==========================================
   DEFAULT LOCATIE
========================================== */

function useDefaultLocation() {

    setPlayerPosition(
        52.3676,
        4.9041
    );

    createCreatures();

}


/* ==========================================
   CREATURES MAKEN
========================================== */

function createCreatures() {

    if (!playerPosition)
        return;


    for (
        let i = 0;
        i < 9;
        i++
    ) {

        spawnCreature();

    }


    showMessage(
        "🎮 Gebruik de joystick om rond te lopen!"
    );

}


/* ==========================================
   CREATURE SPAWN
========================================== */

function spawnCreature() {

    if (!playerPosition)
        return;


    const creature =
        creatures[
            Math.floor(
                Math.random() *
                creatures.length
            )
        ];


    const angle =
        Math.random() *
        Math.PI *
        2;


    const distance =
        0.0005 +
        Math.random() *
        0.0025;


    const lat =
        playerPosition[0] +
        Math.cos(angle) *
        distance;


    const lng =
        playerPosition[1] +
        Math.sin(angle) *
        distance;


    const icon =
        L.divIcon({

            className: "",

            html:
                `<div
                    class="creatureMarker"
                    id="creature-${Date.now()}-${Math.random()}"
                >
                    ${creature.emoji}
                </div>`,

            iconSize: [
                60,
                60
            ],

            iconAnchor: [
                30,
                30
            ]

        });


    const marker =
        L.marker(
            [lat,lng],
            {
                icon: icon
            }
        )
        .addTo(map);


    marker.creatureData =
        creature;


    marker.on(
        "click",
        () => {

            selectCreature(
                marker,
                creature
            );

        }
    );


    spawnedCreatures.push(
        marker
    );

}


/* ==========================================
   CREATURE SELECTEREN
========================================== */

function selectCreature(
    marker,
    creature
) {

    selectedCreature =
        marker;

    selectedCreatureData =
        creature;


    const d =
        getDistance(
            playerPosition[0],
            playerPosition[1],

            marker.getLatLng().lat,
            marker.getLatLng().lng
        );


    showMessage(

        "👾 " +
        creature.name +
        " — " +
        Math.round(d) +
        " meter afstand"

    );


    if (d <= 50) {

        document
            .getElementById(
                "catchButton"
            )
            .style.display =
            "block";

    }

}


/* ==========================================
   DISTANCE CHECK
========================================== */

function updateCreatureDistances() {

    if (!playerPosition)
        return;


    spawnedCreatures.forEach(
        marker => {

            const pos =
                marker.getLatLng();


            const d =
                getDistance(

                    playerPosition[0],
                    playerPosition[1],

                    pos.lat,
                    pos.lng

                );


            const element =
                marker
                    .getElement();


            if (element) {

                const creature =
                    element
                        .querySelector(
                            ".creatureMarker"
                        );


                if (creature) {

                    if (d <= 60) {

                        creature.classList
                            .add(
                                "creatureNearby"
                            );

                    }

                    else {

                        creature.classList
                            .remove(
                                "creatureNearby"
                            );

                    }

                }

            }


            if (
                selectedCreature ===
                marker
            ) {

                if (d <= 50) {

                    document
                        .getElementById(
                            "catchButton"
                        )
                        .style.display =
                        "block";

                    showMessage(

                        "🎯 " +
                        marker.creatureData.name +
                        " is dichtbij!"

                    );

                }

                else {

                    document
                        .getElementById(
                            "catchButton"
                        )
                        .style.display =
                        "none";

                }

            }

        }
    );

}


/* ==========================================
   VANGEN
========================================== */

function catchCreature() {

    if (
        !selectedCreature
    )
        return;


    const pos =
        selectedCreature.getLatLng();


    const d =
        getDistance(

            playerPosition[0],
            playerPosition[1],

            pos.lat,
            pos.lng

        );


    if (d > 50) {

        showMessage(
            "🚶 Loop dichter naar de Creature!"
        );

        return;

    }


    const creature =
        selectedCreatureData;


    createCaptureAnimation();


    map.removeLayer(
        selectedCreature
    );


    spawnedCreatures =
        spawnedCreatures.filter(
            marker =>
                marker !==
                selectedCreature
        );


    collection.push(
        creature
    );


    creatureCount++;

    xp += 10;


    document
        .getElementById("xp")
        .innerText =
        xp;


    document
        .getElementById("count")
        .innerText =
        creatureCount;


    updateLevel();


    selectedCreature =
        null;

    selectedCreatureData =
        null;


    document
        .getElementById(
            "catchButton"
        )
        .style.display =
        "none";


    showMessage(
        "🎉 " +
        creature.name +
        " gevangen! +10 XP"
    );


    setTimeout(
        spawnCreature,
        2500
    );

}


/* ==========================================
   CAPTURE EFFECT
========================================== */

function createCaptureAnimation() {

    const flash =
        document.createElement(
            "div"
        );


    flash.className =
        "captureFlash";


    document.body.appendChild(
        flash
    );


    setTimeout(
        () => {

            flash.remove();

        },
        500
    );

}


/* ==========================================
   XP
========================================== */

function updateLevel() {

    const level =
        Math.floor(
            xp / 100
        ) + 1;


    const progress =
        xp % 100;


    document
        .getElementById("level")
        .innerText =
        level;


    document
        .getElementById("xpFill")
        .style.width =
        progress + "%";

}


/* ==========================================
   JOYSTICK
========================================== */

function setupJoystick() {

    const joystick =
        document
            .getElementById(
                "joystick"
            );


    const stick =
        document
            .getElementById(
                "stick"
            );


    function start(
        event
    ) {

        joystickActive =
            true;


        const rect =
            joystick.getBoundingClientRect();


        joystickCenter.x =
            rect.left +
            rect.width / 2;


        joystickCenter.y =
            rect.top +
            rect.height / 2;


        moveJoystick(
            event
        );

    }


    function move(
        event
    ) {

        if (!joystickActive)
            return;


        moveJoystick(
            event
        );

    }


    function end() {

        joystickActive =
            false;


        moveX = 0;
        moveY = 0;


        stick.style.left =
            "50%";


        stick.style.top =
            "50%";

    }


    joystick.addEventListener(
        "touchstart",
        start,
        {
            passive: false
        }
    );


    joystick.addEventListener(
        "touchmove",
        move,
        {
            passive: false
        }
    );


    joystick.addEventListener(
        "touchend",
        end
    );


    joystick.addEventListener(
        "mousedown",
        start
    );


    document.addEventListener(
        "mousemove",
        move
    );


    document.addEventListener(
        "mouseup",
        end
    );

}


/* ==========================================
   JOYSTICK BEWEGEN
========================================== */

function moveJoystick(
    event
) {

    event.preventDefault();


    let clientX;
    let clientY;


    if (
        event.touches &&
        event.touches.length
    ) {

        clientX =
            event.touches[0].clientX;

        clientY =
            event.touches[0].clientY;

    }

    else {

        clientX =
            event.clientX;

        clientY =
            event.clientY;

    }


    let dx =
        clientX -
        joystickCenter.x;


    let dy =
        clientY -
        joystickCenter.y;


    const max =
        42;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (length > max) {

        dx =
            dx /
            length *
            max;

        dy =
            dy /
            length *
            max;

    }


    moveX =
        dx / max;

    moveY =
        dy / max;


    const stick =
        document
            .getElementById(
                "stick"
            );


    stick.style.left =
        `calc(50% + ${dx}px)`;


    stick.style.top =
        `calc(50% + ${dy}px)`;

}


/* ==========================================
   GAME LOOP
========================================== */

setInterval(
    movePlayer,
    50
);


/* ==========================================
   SPELER BEWEGEN
========================================== */

function movePlayer() {

    if (
        !playerPosition ||
        (!moveX && !moveY)
    )
        return;


    /*
       Kleine beweging per tick.
       Hierdoor voelt de joystick
       soepel aan.
    */

    const speed =
        0.000045;


    const newLat =
        playerPosition[0] -
        moveY * speed;


    const newLng =
        playerPosition[1] +
        moveX * speed;


    setPlayerPosition(
        newLat,
        newLng
    );


    updateCreatureDistances();


    /*
       Kaart volgt speler.
    */

    map.panTo(
        playerPosition,
        {
            animate: false
        }
    );

}


/* ==========================================
   GPS KNOP
========================================== */

function centerPlayer() {

    if (
        !playerPosition
    )
        return;


    map.setView(
        playerPosition,
        18
    );

}


/* ==========================================
   NIEUWE CREATURE
========================================== */

function spawnNearPlayer() {

    spawnCreature();


    showMessage(
        "👀 Er is een nieuwe Creature verschenen!"
    );

}


/* ==========================================
   AFSTAND
========================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;


    const dLat =
        (lat2-lat1) *
        Math.PI / 180;


    const dLon =
        (lon2-lon1) *
        Math.PI / 180;


    const a =

        Math.sin(dLat/2) *
        Math.sin(dLat/2)

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R * c;

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text
) {

    document
        .getElementById(
            "message"
        )
        .innerText =
        text;

}


/* ==========================================
   COLLECTION
========================================== */

function openCollection() {

    renderCollection();


    document
        .getElementById(
            "collectionModal"
        )
        .style.display =
        "flex";

}


function closeCollection() {

    document
        .getElementById(
            "collectionModal"
        )
        .style.display =
        "none";

}


function renderCollection() {

    const grid =
        document
            .getElementById(
                "collectionGrid"
            );


    grid.innerHTML = "";


    if (
        collection.length === 0
    ) {

        grid.innerHTML =

            `

            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:30px;
                    color:#91a39a;
                "
            >

                📖 Je boek is nog leeg.

                <br><br>

                Ga Creaturen zoeken!

            </div>

            `;

        return;

    }


    collection.forEach(
        creature => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML =

                `

                <div class="cardEmoji">
                    ${creature.emoji}
                </div>

                <div class="cardName">
                    ${creature.name}
                </div>

                <div class="cardType">
                    ${creature.type}
                </div>

                `;


            grid.appendChild(
                card
            );

        }
    );

}


/* ==========================================
   MODAL
========================================== */

function closeCreature() {

    document
        .getElementById(
            "creatureModal"
        )
        .style.display =
        "none";

}

</script>
