<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Creaturen Trail</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
        }

        .screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
        }

        h1 {
            font-size: 45px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #b8c2d1;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .start-button {
            padding: 18px 45px;
            border: none;
            border-radius: 15px;
            background: #ffffff;
            color: #101827;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-button:active {
            transform: scale(0.96);
        }

        #game {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .stats {
            font-size: 14px;
            color: #d5dbea;
        }

        .map {
            position: relative;
            width: 100%;
            height: 65vh;
            min-height: 400px;
            border-radius: 25px;
            overflow: hidden;
            background: #263b2f;
            border: 2px solid #405b49;
        }

        .road {
            position: absolute;
            background: #68736d;
            transform: rotate(25deg);
            width: 130%;
            height: 55px;
            top: 45%;
            left: -15%;
        }

        .road2 {
            position: absolute;
            background: #68736d;
            transform: rotate(-55deg);
            width: 120%;
            height: 45px;
            top: 15%;
            left: -10%;
        }

        .player {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: white;
            border: 5px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            z-index: 5;
        }

        .creature {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid white;
            background: #6c8cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .creature:hover {
            transform: scale(1.1);
        }

        .message {
            text-align: center;
            margin-top: 15px;
            color: #d5dbea;
        }

        .catch-button {
            display: none;
            margin: 15px auto 0;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- STARTSCHERM -->

    <section id="startScreen" class="screen">

        <h1>Creaturen Trail</h1>

        <p class="subtitle">
            Ontdek. Vind. Vang.
        </p>

        <button class="start-button" onclick="startGame()">
            START AVONTUUR
        </button>

    </section>


    <!-- GAME -->

    <section id="game">

        <div class="topbar">

            <div class="logo">
                🐾 Creaturen Trail
            </div>

            <div class="stats">
                ⭐ XP: <span id="xp">0</span>
                <br>
                🎒 Creaturen: <span id="count">0</span>
            </div>

        </div>


        <!-- GAME MAP -->

        <div class="map" id="map">

            <div class="road"></div>
            <div class="road2"></div>

            <!-- SPELER -->

            <div class="player">
                🧑
            </div>

        </div>


        <p class="message" id="message">
            Zoek naar Creaturen in de omgeving...
        </p>

        <button
            class="catch-button"
            id="catchButton"
            onclick="catchCreature()"
        >
            🎯 VANG CREATURE
        </button>

    </section>


    <script>

        let xp = 0;
        let creatureCount = 0;
        let selectedCreature = null;


        // GAME STARTEN

        function startGame() {

            document.getElementById("startScreen").style.display = "none";

            document.getElementById("game").style.display = "block";

            spawnCreatures();

        }


        // CREATUREN MAKEN

        function spawnCreatures() {

            const map = document.getElementById("map");

            const creatures = [
                {
                    name: "Blazik",
                    emoji: "🔥"
                },
                {
                    name: "Aquari",
                    emoji: "💧"
                },
                {
                    name: "Leafy",
                    emoji: "🌿"
                }
            ];


            creatures.forEach((creature, index) => {

                const element = document.createElement("div");

                element.className = "creature";

                element.innerHTML = creature.emoji;

                element.title = creature.name;


                // Willekeurige positie

                const x = 15 + Math.random() * 70;
                const y = 15 + Math.random() * 65;

                element.style.left = x + "%";
                element.style.top = y + "%";


                element.onclick = function() {

                    selectCreature(
                        creature,
                        element
                    );

                };


                map.appendChild(element);

            });

        }


        // CREATURE SELECTEREN

        function selectCreature(creature, element) {

            selectedCreature = element;

            document.getElementById("message").innerText =
                "Je hebt " +
                creature.name +
                " gevonden!";

            document.getElementById("catchButton").style.display =
                "block";

        }


        // CREATURE VANGEN

        function catchCreature() {

            if (!selectedCreature) {
                return;
            }


            selectedCreature.remove();

            selectedCreature = null;

            creatureCount++;

            xp += 10;


            document.getElementById("xp").innerText =
                xp;

            document.getElementById("count").innerText =
                creatureCount;


            document.getElementById("message").innerText =
                "🎉 Creature gevangen!";


            document.getElementById("catchButton").style.display =
                "none";


            // Na een paar seconden een nieuwe Creature

            setTimeout(spawnNewCreature, 1500);

        }


        // NIEUWE CREATURE

        function spawnNewCreature() {

            const map = document.getElementById("map");

            const creatures = [
                {
                    name: "Flamy",
                    emoji: "🔥"
                },
                {
                    name: "Bubblu",
                    emoji: "💧"
                },
                {
                    name: "Mossy",
                    emoji: "🌿"
                },
                {
                    name: "Sparko",
                    emoji: "⚡"
                }
            ];


            const creature =
                creatures[
                    Math.floor(
                        Math.random() * creatures.length
                    )
                ];


            const element =
                document.createElement("div");


            element.className =
                "creature";


            element.innerHTML =
                creature.emoji;


            const x =
                10 + Math.random() * 75;

            const y =
                10 + Math.random() * 70;


            element.style.left =
                x + "%";

            element.style.top =
                y + "%";


            element.onclick =
                function() {

                    selectCreature(
                        creature,
                        element
                    );

                };


            map.appendChild(element);


            document.getElementById("message").innerText =
                "👀 Een nieuwe Creature is verschenen!";

        }

    </script>

</body>
</html>
