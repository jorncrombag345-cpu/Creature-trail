<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creaturen Trail</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #07120f;
    color: white;
}


/* =========================================
   STARTSCHERM
========================================= */

#startScreen {
    position: fixed;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(65, 210, 125, 0.25),
            transparent 35%
        ),
        linear-gradient(
            160deg,
            #07120f,
            #102a1e,
            #07120f
        );

    z-index: 9999;
}


.logo-icon {
    width: 110px;
    height: 110px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 32px;

    font-size: 60px;

    background:
        linear-gradient(
            145deg,
            #69efa0,
            #278152
        );

    box-shadow:
        0 20px 50px rgba(0,0,0,.45);

    animation:
        floatLogo 3s ease-in-out infinite;
}


@keyframes floatLogo {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-9px);
    }
}


#startScreen h1 {
    margin: 22px 0 0;

    font-size:
        clamp(38px, 10vw, 58px);

    font-weight: 900;

    letter-spacing: -2px;
}


.tagline {
    margin-top: 10px;

    color: #b7c9c0;

    font-size: 17px;
}


.start-button {
    margin-top: 42px;

    padding: 18px 35px;

    min-width: 245px;

    border: 0;
    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #70f0a4,
            #35b96f
        );

    color: #07120f;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 12px 35px
        rgba(50,190,110,.3);
}


.start-small {
    margin-top: 14px;

    color: #70877d;

    font-size: 12px;
}


/* =========================================
   GAME
========================================= */

#game {
    display: none;

    position: fixed;
    inset: 0;
}


#map {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;
}


/* =========================================
   HUD
========================================= */

.top-hud {
    position: fixed;

    top: 14px;
    left: 14px;
    right: 14px;

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

    z-index: 2000;

    pointer-events: none;
}


.hud-card {
    padding: 11px 14px;

    border-radius: 18px;

    background:
        rgba(8,18,15,.91);

    backdrop-filter:
        blur(14px);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.3);
}


.game-title {
    font-size: 14px;
    font-weight: 900;
}


.level {
    margin-top: 4px;

    color: #70eda0;

    font-size: 11px;
    font-weight: bold;
}


.xp-bar {
    width: 140px;
    height: 7px;

    margin-top: 7px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.12);
}


.xp-fill {
    width: 0%;
    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #61e897,
            #c4ff80
        );

    transition:
        width .4s ease;
}


.stats {
    text-align: right;

    font-size: 12px;

    color: #d9e5df;

    line-height: 1.5;
}


/* =========================================
   MENU
========================================= */

.hud-buttons {
    position: fixed;

    right: 14px;
    top: 108px;

    display: flex;
    flex-direction: column;

    gap: 10px;

    z-index: 2000;
}


.hud-button {
    width: 51px;
    height: 51px;

    border: 0;
    border-radius: 17px;

    background:
        rgba(8,18,15,.92);

    color: white;

    font-size: 22px;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.3);
}


.hud-button:active {
    transform: scale(.94);
}


/* =========================================
   BOTTOM MESSAGE
========================================= */

#messageBox {
    position: fixed;

    left: 50%;
    bottom: 17px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 30px);

    max-width: 460px;

    padding: 15px;

    border-radius: 21px;

    background:
        rgba(8,18,15,.94);

    backdrop-filter:
        blur(15px);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.4);

    text-align: center;

    z-index: 3000;
}


#message {
    font-size: 14px;
    color: #dce8e1;
}


#catchButton {
    display: none;

    width: 100%;

    margin-top: 12px;

    padding: 15px;

    border: 0;
    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #70f0a4,
            #35b96f
        );

    color: #07120f;

    font-size: 16px;
    font-weight: 900;

    cursor: pointer;
}


#catchButton:disabled {
    background: #59625e;
    color: #c7cfcb;
}


/* =========================================
   CREATURE MARKER
========================================= */

.creature-marker {
    width: 62px;
    height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 32px;

    background:
        radial-gradient(
            circle at 30% 25%,
            white,
            #e4eee9
        );

    border:
        3px solid
        rgba(10,30,20,.85);

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.45);

    animation:
        creatureFloat 2.4s ease-in-out infinite;
}


@keyframes creatureFloat {

    0%,
    100% {
        transform:
            translateY(0)
            scale(1);
    }

    50% {
        transform:
            translateY(-7px)
            scale(1.05);
    }
}


/* =========================================
   PLAYER
========================================= */

.player-marker {
    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: #4c91ff;

    border: 4px solid white;

    box-shadow:
        0 0 0 9px
        rgba(76,145,255,.22),
        0 4px 14px
        rgba(0,0,0,.5);
}


/* =========================================
   CREATURE POPUP
========================================= */

#creaturePopup {
    position: fixed;

    inset: 0;

    display: none;

    align-items: flex-end;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(7px);

    z-index: 6000;
}


.creature-card {
    width: 100%;
    max-width: 450px;

    padding: 22px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            #142a20,
            #091510
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.55);

    animation:
        cardUp .3s ease;
}


@keyframes cardUp {

    from {
        transform:
            translateY(60px);

        opacity: 0;
    }

    to {
        transform:
            translateY(0);

        opacity: 1;
    }
}


.creature-header {
    display: flex;
    align-items: center;

    gap: 16px;
}


.big-creature {
    width: 82px;
    height: 82px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 24px;

    background:
        rgba(255,255,255,.08);

    font-size: 50px;

    box-shadow:
        inset 0 0 20px
        rgba(255,255,255,.05);
}


.creature-name {
    font-size: 25px;
    font-weight: 900;
}


.creature-type {
    margin-top: 5px;

    font-size: 13px;

    color: #75e9a3;
}


.rarity {
    display: inline-block;

    margin-top: 8px;

    padding: 5px 9px;

    border-radius: 9px;

    background:
        rgba(255,255,255,.08);

    font-size: 11px;
}


.stat-row {
    margin-top: 20px;
}


.stat-label {
    display: flex;

    justify-content:
        space-between;

    margin-bottom: 5px;

    font-size: 12px;

    color: #b9c9c2;
}


.stat-bar {
    width: 100%;
    height: 8px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.1);
}


.stat-fill {
    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #69eda0,
            #b8f778
        );
}


.popup-buttons {
    display: flex;

    gap: 10px;

    margin-top: 20px;
}


.popup-button {
    flex: 1;

    padding: 14px;

    border: 0;

    border-radius: 14px;

    font-size: 15px;

    font-weight: 900;

    cursor: pointer;
}


.popup-catch {
    background:
        linear-gradient(
            135deg,
            #70f0a4,
            #35b96f
        );

    color: #07120f;
}


.popup-close {
    background:
        rgba(255,255,255,.09);

    color: white;
}


/* =========================================
   MODALS
========================================= */

.modal {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.68);

    backdrop-filter:
        blur(8px);

    z-index: 7000;
}


.modal-card {
    width: 100%;
    max-width: 430px;

    max-height: 80vh;

    overflow-y: auto;

    padding: 22px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #14291f,
            #091510
        );

    border:
        1px solid
        rgba(255,255,255,.12);
}


.modal-title {
    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 20px;

    font-size: 22px;

    font-weight: 900;
}


.close-button {
    border: 0;

    background: transparent;

    color: white;

    font-size: 27px;

    cursor: pointer;
}


.collection-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;
}


.collection-card {
    padding: 17px;

    border-radius: 18px;

    text-align: center;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.08);
}


.collection-emoji {
    font-size: 42px;
}


.collection-name {
    margin-top: 7px;

    font-size: 14px;
    font-weight: bold;
}


.collection-rarity {
    margin-top: 5px;

    color: #75e9a3;

    font-size: 10px;
}


.empty-collection {
    grid-column: 1 / -1;

    padding: 30px 10px;

    text-align: center;

    color: #91a39a;
}


/* LEAFLET */

.leaflet-control-zoom {
    border: 0 !important;
}

.leaflet-control-zoom a {
    background:
        rgba(8,18,15,.9) !important;

    color: white !important;

    border: 0 !important;
}

.leaflet-control-attribution {
    font-size: 8px;
}

</style>
</head>


<body>


<!-- =========================================
     START
========================================= -->

<section id="startScreen">

    <div class="logo-icon">
        🐾
    </div>

    <h1>
        Creaturen Trail
    </h1>

    <div class="tagline">
        Ontdek. Vind. Vang.
    </div>

    <button
        class="start-button"
        onclick="startGame()"
    >
        START AVONTUUR
    </button>

    <div class="start-small">
        Jouw avontuur begint hier
    </div>

</section>


<!-- =========================================
     GAME
========================================= -->

<section id="game">

    <div id="map"></div>


    <!-- HUD -->

    <div class="top-hud">

        <div class="hud-card">

            <div class="game-title">
                🐾 Creaturen Trail
            </div>

            <div class="level">
                LEVEL
                <span id="level">1</span>
            </div>

            <div class="xp-bar">
                <div
                    class="xp-fill"
                    id="xpFill"
                ></div>
            </div>

        </div>


        <div class="hud-card stats">

            ⭐
            <span id="xp">0</span>
            XP

            <br>

            🎒
            <span id="count">0</span>

        </div>

    </div>


    <!-- KNOPPEN -->

    <div class="hud-buttons">

        <button
            class="hud-button"
            onclick="openCreatures()"
        >
            📖
        </button>

        <button
            class="hud-button"
            onclick="openInventory()"
        >
            🎒
        </button>

        <button
            class="hud-button"
            onclick="goToPlayer()"
        >
            📍
        </button>

    </div>


    <!-- MELDING -->

    <div id="messageBox">

        <div id="message">
            📍 Je locatie wordt gezocht...
        </div>

        <button
            id="catchButton"
            onclick="openSelectedCreature()"
            disabled
        >
            👾 BEKIJK CREATURE
        </button>

    </div>

</section>


<!-- =========================================
     CREATURE POPUP
========================================= -->

<div id="creaturePopup">

    <div class="creature-card">

        <div class="creature-header">

            <div
                class="big-creature"
                id="popupEmoji"
            >
                🔥
            </div>

            <div>

                <div
                    class="creature-name"
                    id="popupName"
                >
                    Blazik
                </div>

                <div
                    class="creature-type"
                    id="popupType"
                >
                    Vuur
                </div>

                <div
                    class="rarity"
                    id="popupRarity"
                >
                    ★★★ Gewoon
                </div>

            </div>

        </div>


        <div class="stat-row">

            <div class="stat-label">

                <span>
                    ⚔️ Kracht
                </span>

                <span id="powerValue">
                    50
                </span>

            </div>

            <div class="stat-bar">

                <div
                    class="stat-fill"
                    id="powerFill"
                    style="width:50%"
                ></div>

            </div>

        </div>


        <div class="stat-row">

            <div class="stat-label">

                <span>
                    ❤️ Energie
                </span>

                <span id="energyValue">
                    70
                </span>

            </div>

            <div class="stat-bar">

                <div
                    class="stat-fill"
                    id="energyFill"
                    style="width:70%"
                ></div>

            </div>

        </div>


        <div class="popup-buttons">

            <button
                class="popup-button popup-close"
                onclick="closeCreaturePopup()"
            >
                SLUITEN
            </button>

            <button
                class="popup-button popup-catch"
                onclick="catchSelectedCreature()"
            >
                🎯 VANG
            </button>

        </div>

    </div>

</div>


<!-- =========================================
     CREATURENBOEK
========================================= -->

<div
    class="modal"
    id="creatureModal"
>

    <div class="modal-card">

        <div class="modal-title">

            📖 Creaturenboek

            <button
                class="close-button"
                onclick="closeCreatures()"
            >
                ×
            </button>

        </div>


        <div
            class="collection-grid"
            id="collectionGrid"
        ></div>

    </div>

</div>


<!-- =========================================
     INVENTORY
========================================= -->

<div
    class="modal"
    id="inventoryModal"
>

    <div class="modal-card">

        <div class="modal-title">

            🎒 Inventory

            <button
                class="close-button"
                onclick="closeInventory()"
            >
                ×
            </button>

        </div>


        <div class="collection-grid">

            <div class="collection-card">

                <div class="collection-emoji">
                    🎯
                </div>

                <div class="collection-name">
                    Trail Balls
                </div>

                <div>
                    ∞
                </div>

            </div>


            <div class="collection-card">

                <div class="collection-emoji">
                    🍎
                </div>

                <div class="collection-name">
                    Bessen
                </div>

                <div>
                    0
                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================================
   GAME VARIABLES
========================================= */

let xp = 0;

let creatureCount = 0;

let selectedCreature = null;

let selectedCreatureData = null;

let map = null;

let playerMarker = null;

let playerPosition = null;

let watchId = null;

let collection = [];


const CATCH_DISTANCE = 50;


/* =========================================
   CREATURE DATABASE
========================================= */

const creatureTypes = [

    {
        name: "Blazik",
        emoji: "🔥",
        type: "Vuur",
        rarity: "★★★ Gewoon",
        power: 65,
        energy: 75
    },

    {
        name: "Aquari",
        emoji: "💧",
        type: "Water",
        rarity: "★★★ Gewoon",
        power: 55,
        energy: 90
    },

    {
        name: "Leafy",
        emoji: "🌿",
        type: "Natuur",
        rarity: "★★★ Gewoon",
        power: 60,
        energy: 80
    },

    {
        name: "Sparko",
        emoji: "⚡",
        type: "Elektrisch",
        rarity: "★★★★ Zeldzaam",
        power: 85,
        energy: 65
    },

    {
        name: "Rocko",
        emoji: "🪨",
        type: "Aarde",
        rarity: "★★★★ Zeldzaam",
        power: 90,
        energy: 55
    },

    {
        name: "Mysti",
        emoji: "✨",
        type: "Mystiek",
        rarity: "★★★★★ Episch",
        power: 98,
        energy: 95
    }

];


/* =========================================
   START
========================================= */

function startGame() {

    document
        .getElementById("startScreen")
        .style.display = "none";

    document
        .getElementById("game")
        .style.display = "block";

    createMap();

    findPlayer();

}


/* =========================================
   MAP
========================================= */

function createMap() {

    map =
        L.map("map")
        .setView(
            [52.3676, 4.9041],
            16
        );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);

}


/* =========================================
   GPS
========================================= */

function findPlayer() {

    showMessage(
        "📍 Je locatie wordt gezocht..."
    );


    if (
        !navigator.geolocation
    ) {

        useDefaultLocation();

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            updatePlayerPosition(
                position
            );


            watchId =
                navigator.geolocation.watchPosition(

                    function(position) {

                        updatePlayerPosition(
                            position
                        );

                    },

                    function(error) {

                        console.log(error);

                    },

                    {
                        enableHighAccuracy: true,

                        maximumAge: 5000,

                        timeout: 10000
                    }
                );

        },

        function() {

            showMessage(
                "⚠️ GPS niet beschikbaar. Testlocatie gebruikt."
            );

            useDefaultLocation();

        },

        {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0
        }

    );

}


/* =========================================
   PLAYER
========================================= */

function updatePlayerPosition(
    position
) {

    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;


    playerPosition = [
        lat,
        lng
    ];


    showPlayer(
        lat,
        lng
    );


    checkSelectedCreatureDistance();

}


function showPlayer(
    lat,
    lng
) {

    const icon =
        L.divIcon({

            className: "",

            html:
                '<div class="player-marker"></div>',

            iconSize: [
                30,
                30
            ],

            iconAnchor: [
                15,
                15
            ]

        });


    if (
        playerMarker
    ) {

        playerMarker.setLatLng(
            [lat, lng]
        );

    }

    else {

        playerMarker =
            L.marker(
                [lat, lng],
                {
                    icon: icon
                }
            )
            .addTo(map);


        map.setView(
            [lat, lng],
            17
        );


        spawnCreatures(
            lat,
            lng
        );

    }

}


/* =========================================
   TESTLOCATIE
========================================= */

function useDefaultLocation() {

    const lat =
        52.3676;

    const lng =
        4.9041;


    playerPosition = [
        lat,
        lng
    ];


    showPlayer(
        lat,
        lng
    );

}


/* =========================================
   CREATURES SPAWNEN
========================================= */

function spawnCreatures(
    lat,
    lng
) {

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        spawnCreature(
            lat,
            lng
        );

    }

}


function spawnCreature(
    lat,
    lng
) {

    const creature =
        creatureTypes[
            Math.floor(
                Math.random() *
                creatureTypes.length
            )
        ];


    const distance =
        0.0005 +
        Math.random() *
        0.0025;


    const angle =
        Math.random() *
        Math.PI *
        2;


    const creatureLat =
        lat +
        Math.cos(angle) *
        distance;


    const creatureLng =
        lng +
        Math.sin(angle) *
        distance;


    const icon =
        L.divIcon({

            className: "",

            html:
                `<div class="creature-marker">
                    ${creature.emoji}
                </div>`,

            iconSize: [
                62,
                62
            ],

            iconAnchor: [
                31,
                31
            ]

        });


    const marker =
        L.marker(
            [
                creatureLat,
                creatureLng
            ],
            {
                icon: icon
            }
        )
        .addTo(map);


    marker.creatureData =
        creature;


    marker.on(
        "click",
        function() {

            selectCreature(
                marker,
                creature
            );

        }
    );

}


/* =========================================
   SELECT CREATURE
========================================= */

function selectCreature(
    marker,
    creature
) {

    selectedCreature =
        marker;

    selectedCreatureData =
        creature;


    checkSelectedCreatureDistance();


    if (
        playerPosition
    ) {

        const location =
            marker.getLatLng();


        const distance =
            getDistance(
                playerPosition[0],
                playerPosition[1],
                location.lat,
                location.lng
            );


        showMessage(
            "👾 " +
            creature.name +
            " gevonden — " +
            Math.round(distance) +
            " meter afstand."
        );

    }

}


/* =========================================
   OPEN CREATURE
========================================= */

function openSelectedCreature() {

    if (
        !selectedCreature ||
        !selectedCreatureData
    ) {

        return;

    }


    const creature =
        selectedCreatureData;


    document
        .getElementById("popupEmoji")
        .innerText =
        creature.emoji;


    document
        .getElementById("popupName")
        .innerText =
        creature.name;


    document
        .getElementById("popupType")
        .innerText =
        creature.type;


    document
        .getElementById("popupRarity")
        .innerText =
        creature.rarity;


    document
        .getElementById("powerValue")
        .innerText =
        creature.power;


    document
        .getElementById("energyValue")
        .innerText =
        creature.energy;


    document
        .getElementById("powerFill")
        .style.width =
        creature.power + "%";


    document
        .getElementById("energyFill")
        .style.width =
        creature.energy + "%";


    document
        .getElementById(
            "creaturePopup"
        )
        .style.display =
        "flex";

}


/* =========================================
   POPUP SLUITEN
========================================= */

function closeCreaturePopup() {

    document
        .getElementById(
            "creaturePopup"
        )
        .style.display =
        "none";

}


/* =========================================
   AFSTAND
========================================= */

function checkSelectedCreatureDistance() {

    const button =
        document.getElementById(
            "catchButton"
        );


    if (
        !selectedCreature ||
        !playerPosition
    ) {

        button.style.display =
            "none";

        return;

    }


    const location =
        selectedCreature.getLatLng();


    const distance =
        getDistance(
            playerPosition[0],
            playerPosition[1],
            location.lat,
            location.lng
        );


    button.style.display =
        "block";


    if (
        distance <=
        CATCH_DISTANCE
    ) {

        button.disabled =
            false;

        button.innerText =
            "👾 BEKIJK CREATURE";

    }

    else {

        button.disabled =
            false;

        button.innerText =
            "👾 BEKIJK CREATURE";

    }

}


/* =========================================
   VANGEN
========================================= */

function catchSelectedCreature() {

    if (
        !selectedCreature ||
        !selectedCreatureData ||
        !playerPosition
    ) {

        return;

    }


    const location =
        selectedCreature.getLatLng();


    const distance =
        getDistance(
            playerPosition[0],
            playerPosition[1],
            location.lat,
            location.lng
        );


    if (
        distance >
        CATCH_DISTANCE
    ) {

        closeCreaturePopup();


        showMessage(
            "❌ Je bent nog " +
            Math.round(distance) +
            " meter te ver weg!"
        );

        return;

    }


    const creature =
        selectedCreatureData;


    map.removeLayer(
        selectedCreature
    );


    selectedCreature =
        null;

    selectedCreatureData =
        null;


    closeCreaturePopup();


    collection.push(
        creature
    );


    creatureCount++;

    xp += 10;


    document
        .getElementById("xp")
        .innerText =
        xp;


    document
        .getElementById("count")
        .innerText =
        creatureCount;


    updateLevel();


    document
        .getElementById(
            "catchButton"
        )
        .style.display =
        "none";


    showMessage(
        "🎉 " +
        creature.name +
        " gevangen! +10 XP"
    );


    setTimeout(
        function() {

            if (
                playerPosition
            ) {

                spawnCreature(
                    playerPosition[0],
                    playerPosition[1]
                );

            }

        },
        3000
    );

}


/* =========================================
   LEVEL
========================================= */

function updateLevel() {

    const level =
        Math.floor(
            xp / 100
        ) + 1;


    const progress =
        xp % 100;


    document
        .getElementById("level")
        .innerText =
        level;


    document
        .getElementById("xpFill")
        .style.width =
        progress + "%";

}


/* =========================================
   CREATURENBOEK
========================================= */

function openCreatures() {

    renderCollection();


    document
        .getElementById(
            "creatureModal"
        )
        .style.display =
        "flex";

}


function closeCreatures() {

    document
        .getElementById(
            "creatureModal"
        )
        .style.display =
        "none";

}


function renderCollection() {

    const grid =
        document.getElementById(
            "collectionGrid"
        );


    grid.innerHTML = "";


    if (
        collection.length === 0
    ) {

        grid.innerHTML =
            `
            <div class="empty-collection">
                📖 Je Creaturenboek is nog leeg.
                <br><br>
                Ga op avontuur en vang je eerste Creature!
            </div>
            `;

        return;

    }


    collection.forEach(
        function(creature) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "collection-card";


            card.innerHTML =
                `
                <div class="collection-emoji">
                    ${creature.emoji}
                </div>

                <div class="collection-name">
                    ${creature.name}
                </div>

                <div class="collection-rarity">
                    ${creature.rarity}
                </div>
                `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =========================================
   INVENTORY
========================================= */

function openInventory() {

    document
        .getElementById(
            "inventoryModal"
        )
        .style.display =
        "flex";

}


function closeInventory() {

    document
        .getElementById(
            "inventoryModal"
        )
        .style.display =
        "none";

}


/* =========================================
   NAAR SPELER
========================================= */

function goToPlayer() {

    if (
        !playerPosition
    ) {

        showMessage(
            "📍 Locatie wordt nog gezocht..."
        );

        return;

    }


    map.setView(
        playerPosition,
        18
    );

}


/* =========================================
   AFSTAND BEREKENEN
========================================= */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const earthRadius =
        6371000;


    const dLat =
        toRadians(
            lat2 - lat1
        );


    const dLon =
        toRadians(
            lon2 - lon1
        );


    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
            toRadians(lat1)
        ) *

        Math.cos(
            toRadians(lat2)
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return earthRadius * c;

}


function toRadians(
    degrees
) {

    return degrees *
        Math.PI /
        180;

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    text
) {

    document
        .getElementById(
            "message"
        )
        .innerText =
        text;

}

</script>
