<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>Creaturen Trail</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* ==================================================
   BASIS
================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #07120f;

    color: white;
}


/* ==================================================
   STARTSCHERM
================================================== */

#startScreen {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:

        radial-gradient(
            circle at 50% 20%,
            rgba(80,230,140,.25),
            transparent 35%
        ),

        linear-gradient(
            160deg,
            #06110d,
            #123122,
            #06110d
        );
}


.logo {

    width: 115px;
    height: 115px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 34px;

    font-size: 62px;

    background:
        linear-gradient(
            145deg,
            #75f2a8,
            #2b9459
        );

    box-shadow:
        0 20px 55px
        rgba(0,0,0,.45);
}


#startScreen h1 {

    margin: 22px 0 0;

    font-size:
        clamp(38px, 10vw, 58px);

    font-weight: 900;
}


.subtitle {

    margin-top: 10px;

    color: #b9cec3;
}


.startButton {

    margin-top: 40px;

    min-width: 245px;

    padding: 18px 35px;

    border: none;

    border-radius: 18px;

    background:

        linear-gradient(
            135deg,
            #72f1a5,
            #31b96c
        );

    color: #07120f;

    font-size: 18px;

    font-weight: 900;

    cursor: pointer;
}


/* ==================================================
   GAME
================================================== */

#game {

    display: none;

    position: fixed;

    inset: 0;
}


#map {

    position: absolute;

    inset: 0;
}


/* ==================================================
   HUD
================================================== */

.hud {

    position: fixed;

    top: 14px;

    left: 14px;

    right: 14px;

    z-index: 2000;

    display: flex;

    justify-content:
        space-between;

    pointer-events: none;
}


.hudBox {

    padding: 11px 14px;

    border-radius: 18px;

    background:
        rgba(6,18,13,.93);

    backdrop-filter:
        blur(14px);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);
}


.title {

    font-size: 14px;

    font-weight: 900;
}


.level {

    margin-top: 5px;

    color: #73eda3;

    font-size: 11px;

    font-weight: bold;
}


.xpBar {

    width: 145px;

    height: 7px;

    margin-top: 7px;

    overflow: hidden;

    border-radius: 20px;

    background:
        rgba(255,255,255,.12);
}


.xpFill {

    width: 0%;

    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #5ee594,
            #c8ff83
        );

    transition:
        width .4s ease;
}


.stats {

    text-align: right;

    color: #dce7e1;

    font-size: 12px;

    line-height: 1.5;
}


/* ==================================================
   MENU
================================================== */

.menu {

    position: fixed;

    right: 14px;

    top: 105px;

    z-index: 2500;

    display: flex;

    flex-direction: column;

    gap: 10px;
}


.menu button {

    width: 51px;

    height: 51px;

    border: none;

    border-radius: 17px;

    background:
        rgba(6,18,13,.93);

    color: white;

    font-size: 21px;

    cursor: pointer;
}


/* ==================================================
   MESSAGE
================================================== */

.messageBox {

    position: fixed;

    left: 50%;

    bottom: 145px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 30px);

    max-width: 440px;

    padding: 13px 15px;

    z-index: 3000;

    text-align: center;

    border-radius: 20px;

    background:
        rgba(6,18,13,.94);

    backdrop-filter:
        blur(15px);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.45);
}


#message {

    font-size: 14px;
}


/* ==================================================
   CATCH BUTTON
================================================== */

#catchButton {

    display: none;

    width: 100%;

    margin-top: 10px;

    padding: 13px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #72efa4,
            #34b96e
        );

    color: #07120f;

    font-weight: 900;
}


/* ==================================================
   JOYSTICK
================================================== */

#joystick {

    position: fixed;

    left: 25px;

    bottom: 25px;

    width: 135px;

    height: 135px;

    z-index: 4000;

    border-radius: 50%;

    background:
        rgba(5,20,13,.45);

    border:
        2px solid
        rgba(255,255,255,.15);

    backdrop-filter:
        blur(5px);

    touch-action: none;
}


#stick {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 58px;
    height: 58px;

    transform:
        translate(-50%,-50%);

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #78f2a9,
            #2eaf68
        );

    border:
        3px solid
        rgba(255,255,255,.7);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.4);
}


/* ==================================================
   PLAYER
================================================== */

.playerMarker {

    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: #428cff;

    border:
        4px solid white;

    box-shadow:
        0 0 0 9px
        rgba(66,140,255,.22),

        0 4px 14px
        rgba(0,0,0,.5);
}


/* ==================================================
   CREATURE
================================================== */

.creatureMarker {

    width: 60px;
    height: 60px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            white,
            #e5eee9
        );

    border:
        3px solid
        #10251b;

    font-size: 31px;

    box-shadow:
        0 8px 22px
        rgba(0,0,0,.45);

    transition:
        transform .2s,
        filter .2s;
}


.creatureNearby {

    transform:
        scale(1.35);

    filter:
        drop-shadow(
            0 0 12px
            #71efa4
        );
}


/* ==================================================
   ENCOUNTER
================================================== */

#encounter {

    position: fixed;

    inset: 0;

    z-index: 6000;

    display: none;

    flex-direction: column;

    align-items: center;

    justify-content: space-between;

    padding:
        55px 20px 35px;

    text-align: center;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(70,220,130,.25),
            transparent 35%
        ),

        linear-gradient(
            160deg,
            #071812,
            #102b1f,
            #06100c
        );
}


/* creature boven */

.encounterTop {

    width: 100%;

    display: flex;

    justify-content:
        space-between;

    align-items: center;
}


.backButton {

    width: 48px;
    height: 48px;

    border: none;

    border-radius: 15px;

    background:
        rgba(255,255,255,.1);

    color: white;

    font-size: 22px;
}


.rarity {

    padding:
        8px 13px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.1);

    color:
        #a9ffc7;

    font-size: 12px;

    font-weight: 900;
}


/* creature */

.encounterCreature {

    width: 190px;
    height: 190px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 110px;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95),
            rgba(115,240,170,.15)
        );

    box-shadow:

        0 0 70px
        rgba(110,240,160,.35),

        0 20px 50px
        rgba(0,0,0,.35);

    animation:
        encounterFloat 2.5s
        ease-in-out
        infinite;
}


@keyframes encounterFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-15px);
    }
}


.encounterName {

    margin-top: 20px;

    font-size: 34px;

    font-weight: 900;
}


.encounterType {

    margin-top: 5px;

    color: #76eda4;

    font-weight: bold;
}


/* stats */

.encounterStats {

    width: 100%;

    max-width: 390px;

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 10px;
}


.statCard {

    padding: 12px 7px;

    border-radius: 16px;

    background:
        rgba(255,255,255,.08);
}


.statNumber {

    font-size: 18px;

    font-weight: 900;
}


.statLabel {

    margin-top: 4px;

    color: #9fb1a7;

    font-size: 9px;
}


/* vangbal */

#ball {

    width: 95px;
    height: 95px;

    border-radius: 50%;

    border: 7px solid white;

    background:
        linear-gradient(
            #f04e4e 0 48%,
            #171717 48% 54%,
            #f1f1f1 54%
        );

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.45);

    cursor: pointer;

    transition:
        transform .15s;
}


#ball:active {

    transform:
        scale(.85)
        rotate(-15deg);
}


#throwText {

    margin-top: 10px;

    color: #b9cec3;

    font-size: 12px;
}


/* ==================================================
   RESULT
================================================== */

#result {

    position: fixed;

    inset: 0;

    z-index: 9000;

    display: none;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(10px);
}


.resultCard {

    width:
        calc(100% - 40px);

    max-width: 380px;

    padding: 30px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            #153124,
            #07130d
        );
}


.resultEmoji {

    font-size: 85px;
}


.resultTitle {

    margin-top: 10px;

    font-size: 27px;

    font-weight: 900;
}


.resultText {

    margin-top: 10px;

    color: #b9cec3;
}


.resultButton {

    width: 100%;

    margin-top: 22px;

    padding: 15px;

    border: none;

    border-radius: 15px;

    background:
        #70efa2;

    color: #07120f;

    font-weight: 900;

    font-size: 16px;
}


/* ==================================================
   COLLECTION
================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 7000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.68);

    backdrop-filter:
        blur(8px);
}


.modalCard {

    width: 100%;

    max-width: 430px;

    max-height: 80vh;

    overflow-y: auto;

    padding: 22px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #142a20,
            #08140e
        );
}


.modalTitle {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    font-size: 22px;

    font-weight: 900;
}


.close {

    border: none;

    background: transparent;

    color: white;

    font-size: 28px;
}


.grid {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 12px;

    margin-top: 20px;
}


.card {

    padding: 16px;

    border-radius: 18px;

    text-align: center;

    background:
        rgba(255,255,255,.07);
}


.cardEmoji {

    font-size: 40px;
}


.cardName {

    margin-top: 7px;

    font-weight: bold;
}


.cardType {

    margin-top: 5px;

    color: #75e9a3;

    font-size: 10px;
}

</style>

</head>


<body>


<!-- ==================================================
     START
================================================== -->

<section id="startScreen">

    <div class="logo">
        🐾
    </div>

    <h1>
        Creaturen Trail
    </h1>

    <div class="subtitle">
        Ontdek. Vind. Vang.
    </div>

    <button
        class="startButton"
        onclick="startGame()"
    >
        START AVONTUUR
    </button>

</section>


<!-- ==================================================
     GAME
================================================== -->

<section id="game">

    <div id="map"></div>


    <!-- HUD -->

    <div class="hud">

        <div class="hudBox">

            <div class="title">
                🐾 Creaturen Trail
            </div>

            <div class="level">

                LEVEL
                <span id="level">
                    1
                </span>

            </div>

            <div class="xpBar">

                <div
                    id="xpFill"
                    class="xpFill"
                ></div>

            </div>

        </div>


        <div class="hudBox stats">

            ⭐
            <span id="xp">
                0
            </span>

            XP

            <br>

            🎒
            <span id="count">
                0
            </span>

        </div>

    </div>


    <!-- MENU -->

    <div class="menu">

        <button
            onclick="openCollection()"
        >
            📖
        </button>

        <button
            onclick="centerPlayer()"
        >
            📍
        </button>

        <button
            onclick="spawnNearPlayer()"
        >
            👾
        </button>

    </div>


    <!-- MESSAGE -->

    <div class="messageBox">

        <div id="message">
            Gebruik de joystick om te bewegen.
        </div>

    </div>


    <!-- JOYSTICK -->

    <div id="joystick">

        <div id="stick"></div>

    </div>

</section>


<!-- ==================================================
     ENCOUNTER
================================================== -->

<section id="encounter">

    <div class="encounterTop">

        <button
            class="backButton"
            onclick="closeEncounter()"
        >
            ←
        </button>

        <div
            class="rarity"
            id="encounterRarity"
        >
            GEWOON
        </div>

    </div>


    <div>

        <div
            class="encounterCreature"
            id="encounterEmoji"
        >
            🔥
        </div>


        <div
            class="encounterName"
            id="encounterName"
        >
            Blazik
        </div>


        <div
            class="encounterType"
            id="encounterType"
        >
            Vuur
        </div>

    </div>


    <div
        class="encounterStats"
    >

        <div class="statCard">

            <div
                class="statNumber"
                id="statPower"
            >
                65
            </div>

            <div class="statLabel">
                KRACHT
            </div>

        </div>


        <div class="statCard">

            <div
                class="statNumber"
                id="statChance"
            >
                70%
            </div>

            <div class="statLabel">
                VANGKANS
            </div>

        </div>


        <div class="statCard">

            <div
                class="statNumber"
                id="statXP"
            >
                +10
            </div>

            <div class="statLabel">
                XP
            </div>

        </div>

    </div>


    <div>

        <button
            id="ball"
            onclick="throwBall()"
        >
        </button>

        <div id="throwText">
            Tik op de vangbal!
        </div>

    </div>

</section>


<!-- ==================================================
     RESULT
================================================== -->

<section id="result">

    <div class="resultCard">

        <div
            class="resultEmoji"
            id="resultEmoji"
        >
            🎉
        </div>

        <div
            class="resultTitle"
            id="resultTitle"
        >
            Gevangen!
        </div>

        <div
            class="resultText"
            id="resultText"
        >
            Je hebt een Creature gevangen.
        </div>

        <button
            class="resultButton"
            onclick="closeResult()"
        >
            DOORGAAN
        </button>

    </div>

</section>


<!-- ==================================================
     COLLECTION
================================================== -->

<div
    class="modal"
    id="collectionModal"
>

    <div class="modalCard">

        <div class="modalTitle">

            <span>
                📖 Creaturenboek
            </span>

            <button
                class="close"
                onclick="closeCollection()"
            >
                ×
            </button>

        </div>

        <div
            class="grid"
            id="collectionGrid"
        ></div>

    </div>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* ==================================================
   VARIABLES
================================================== */

let map;

let playerMarker;

let playerPosition = null;

let spawnedCreatures = [];

let selectedCreature = null;

let selectedCreatureData = null;

let collection = [];

let xp = 0;

let creatureCount = 0;

let moveX = 0;

let moveY = 0;

let joystickActive = false;

let joystickCenter = {
    x: 0,
    y: 0
};


/* ==================================================
   CREATURE DATABASE
================================================== */

const creatures = [

    {
        name: "Blazik",
        emoji: "🔥",
        type: "Vuur",
        rarity: "Gewoon",
        power: 65,
        catchChance: 75
    },

    {
        name: "Aquari",
        emoji: "💧",
        type: "Water",
        rarity: "Gewoon",
        power: 55,
        catchChance: 80
    },

    {
        name: "Leafy",
        emoji: "🌿",
        type: "Natuur",
        rarity: "Gewoon",
        power: 60,
        catchChance: 78
    },

    {
        name: "Sparko",
        emoji: "⚡",
        type: "Elektrisch",
        rarity: "Zeldzaam",
        power: 85,
        catchChance: 55
    },

    {
        name: "Rocko",
        emoji: "🪨",
        type: "Aarde",
        rarity: "Zeldzaam",
        power: 90,
        catchChance: 48
    },

    {
        name: "Mysti",
        emoji: "✨",
        type: "Mystiek",
        rarity: "Episch",
        power: 98,
        catchChance: 30
    },

    {
        name: "Frosto",
        emoji: "❄️",
        type: "IJs",
        rarity: "Zeldzaam",
        power: 88,
        catchChance: 50
    }

];


/* ==================================================
   START
================================================== */

function startGame() {

    document
        .getElementById("startScreen")
        .style.display =
        "none";


    document
        .getElementById("game")
        .style.display =
        "block";


    createMap();

    setupJoystick();

    locatePlayer();

}


/* ==================================================
   MAP
================================================== */

function createMap() {

    map =
        L.map("map")
        .setView(
            [52.3676,4.9041],
            17
        );


    L.tileLayer(

        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

        {
            maxZoom: 19,

            attribution:
                "&copy; OpenStreetMap contributors"
        }

    ).addTo(map);

}


/* ==================================================
   GPS
================================================== */

function locatePlayer() {

    if (
        !navigator.geolocation
    ) {

        useDefaultLocation();

        return;

    }


    navigator.geolocation
        .getCurrentPosition(

            position => {

                setPlayerPosition(

                    position.coords.latitude,

                    position.coords.longitude

                );

                createCreatures();

            },

            () => {

                useDefaultLocation();

            },

            {

                enableHighAccuracy:
                    true,

                timeout:
                    10000,

                maximumAge:
                    5000

            }

        );

}


/* ==================================================
   PLAYER
================================================== */

function setPlayerPosition(
    lat,
    lng
) {

    playerPosition = [
        lat,
        lng
    ];


    if (!playerMarker) {

        const icon =
            L.divIcon({

                className: "",

                html:
                    '<div class="playerMarker"></div>',

                iconSize: [
                    30,
                    30
                ],

                iconAnchor: [
                    15,
                    15
                ]

            });


        playerMarker =
            L.marker(

                [lat,lng],

                {
                    icon: icon
                }

            )
            .addTo(map);


        map.setView(
            [lat,lng],
            18
        );

    }

    else {

        playerMarker
            .setLatLng(
                [lat,lng]
            );

    }

}


/* ==================================================
   DEFAULT
================================================== */

function useDefaultLocation() {

    setPlayerPosition(
        52.3676,
        4.9041
    );

    createCreatures();

}


/* ==================================================
   CREATURES
================================================== */

function createCreatures() {

    for (
        let i = 0;
        i < 9;
        i++
    ) {

        spawnCreature();

    }


    showMessage(
        "🎮 Loop rond en zoek Creaturen!"
    );

}


/* ==================================================
   SPAWN
================================================== */

function spawnCreature() {

    if (!playerPosition)
        return;


    const creature =
        creatures[
            Math.floor(
                Math.random() *
                creatures.length
            )
        ];


    const angle =
        Math.random() *
        Math.PI *
        2;


    const distance =
        0.0005 +
        Math.random() *
        0.0025;


    const lat =
        playerPosition[0] +
        Math.cos(angle) *
        distance;


    const lng =
        playerPosition[1] +
        Math.sin(angle) *
        distance;


    const icon =
        L.divIcon({

            className: "",

            html:

                `<div class="creatureMarker">
                    ${creature.emoji}
                </div>`,

            iconSize: [
                60,
                60
            ],

            iconAnchor: [
                30,
                30
            ]

        });


    const marker =
        L.marker(

            [lat,lng],

            {
                icon: icon
            }

        )
        .addTo(map);


    marker.creatureData =
        creature;


    marker.on(
        "click",
        () => {

            const d =
                getDistance(

                    playerPosition[0],
                    playerPosition[1],

                    marker.getLatLng().lat,
                    marker.getLatLng().lng

                );


            if (d <= 60) {

                openEncounter(
                    marker,
                    creature
                );

            }

            else {

                showMessage(

                    "🚶 Loop nog " +
                    Math.round(d) +
                    " meter dichterbij!"

                );

            }

        }
    );


    spawnedCreatures.push(
        marker
    );

}


/* ==================================================
   AFSTANDEN
================================================== */

function updateCreatureDistances() {

    if (!playerPosition)
        return;


    spawnedCreatures.forEach(
        marker => {

            const pos =
                marker.getLatLng();


            const d =
                getDistance(

                    playerPosition[0],
                    playerPosition[1],

                    pos.lat,
                    pos.lng

                );


            const element =
                marker.getElement();


            if (
                element
            ) {

                const visual =
                    element.querySelector(
                        ".creatureMarker"
                    );


                if (
                    visual
                ) {

                    if (
                        d <= 60
                    ) {

                        visual.classList
                            .add(
                                "creatureNearby"
                            );

                    }

                    else {

                        visual.classList
                            .remove(
                                "creatureNearby"
                            );

                    }

                }

            }

        }
    );

}


/* ==================================================
   ENCOUNTER OPENEN
================================================== */

function openEncounter(
    marker,
    creature
) {

    selectedCreature =
        marker;

    selectedCreatureData =
        creature;


    document
        .getElementById(
            "encounterEmoji"
        )
        .innerText =
        creature.emoji;


    document
        .getElementById(
            "encounterName"
        )
        .innerText =
        creature.name;


    document
        .getElementById(
            "encounterType"
        )
        .innerText =
        creature.type;


    document
        .getElementById(
            "encounterRarity"
        )
        .innerText =
        creature.rarity.toUpperCase();


    document
        .getElementById(
            "statPower"
        )
        .innerText =
        creature.power;


    document
        .getElementById(
            "statChance"
        )
        .innerText =
        creature.catchChance + "%";


    document
        .getElementById(
            "statXP"
        )
        .innerText =
        "+10";


    document
        .getElementById(
            "throwText"
        )
        .innerText =
        "Tik op de vangbal!";


    document
        .getElementById(
            "encounter"
        )
        .style.display =
        "flex";


    document
        .getElementById(
            "messageBox"
        );

}


/* ==================================================
   BAL GOOIEN
================================================== */

function throwBall() {

    if (
        !selectedCreatureData
    )
        return;


    const ball =
        document
            .getElementById(
                "ball"
            );


    ball.style.transform =
        "translateY(-150px) scale(.65) rotate(360deg)";


    document
        .getElementById(
            "throwText"
        )
        .innerText =
        "🎯 Vangbal gegooid!";


    setTimeout(
        resolveCatch,
        900
    );

}


/* ==================================================
   VANGST BEREKENEN
================================================== */

function resolveCatch() {

    const creature =
        selectedCreatureData;


    const roll =
        Math.random() * 100;


    const success =
        roll <=
        creature.catchChance;


    if (success) {

        catchSuccess();

    }

    else {

        catchFail();

    }

}


/* ==================================================
   SUCCES
================================================== */

function catchSuccess() {

    const creature =
        selectedCreatureData;


    if (selectedCreature) {

        map.removeLayer(
            selectedCreature
        );


        spawnedCreatures =
            spawnedCreatures.filter(
                marker =>
                    marker !==
                    selectedCreature
            );

    }


    collection.push(
        creature
    );


    creatureCount++;

    xp += 10;


    updateStats();


    document
        .getElementById(
            "resultEmoji"
        )
        .innerText =
        creature.emoji;


    document
        .getElementById(
            "resultTitle"
        )
        .innerText =
        "🎉 Gevangen!";


    document
        .getElementById(
            "resultText"
        )
        .innerText =

        creature.name +
        " zit nu in je Creaturenboek! +10 XP";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "flex";


    resetBall();

}


/* ==================================================
   MISLUKT
================================================== */

function catchFail() {

    const creature =
        selectedCreatureData;


    document
        .getElementById(
            "resultEmoji"
        )
        .innerText =
        "💨";


    document
        .getElementById(
            "resultTitle"
        )
        .innerText =
        "Ontsnapt!";


    document
        .getElementById(
            "resultText"
        )
        .innerText =

        creature.name +
        " wist uit de vangbal te ontsnappen!";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "flex";


    resetBall();

}


/* ==================================================
   BALL RESET
================================================== */

function resetBall() {

    const ball =
        document
            .getElementById(
                "ball"
            );


    setTimeout(
        () => {

            ball.style.transform =
                "";

        },
        300
    );

}


/* ==================================================
   ENCOUNTER SLUITEN
================================================== */

function closeEncounter() {

    document
        .getElementById(
            "encounter"
        )
        .style.display =
        "none";


    selectedCreature =
        null;

    selectedCreatureData =
        null;


    resetBall();

}


/* ==================================================

================================================== */

function closeResult() {

    document
        .getElementById(
            "result"
        )
        .style.display =
        "none";

    setTimeout(

/* ==================================================
   XP
================================================== */

function updateStats() {

    document
        .getElementById(
            "xp"
        )
        .innerText =
        xp;


    document
        .getElementById(
            "count"
        )
        .innerText =
        creatureCount;

/* ==================================================
   JOYSTICK
================================================== */

function setupJoystick() {

    const joystick =
        document
            .getElementById(
                "joystick"
            );


    const stick =
        document
            .getElementById(
                "stick"
            );


    function start(
        event
    ) {

        joystickActive =
            true;


        const rect =
            joystick.getBoundingClientRect();


        joystickCenter.x =
            rect.left +
            rect.width / 2;


        joystickCenter.y =
            rect.top +
            rect.height / 2;


        moveJoystick(
            event
        );

    }


    function move(
        event
    ) {

        if (
            !joystickActive
        )
            return;


        moveJoystick(
            event
        );

    }


    function end() {

        joystickActive =
            false;


        moveX = 0;

        moveY = 0;


        stick.style.left =
            "50%";


        stick.style.top =
            "50%";

    }


    joystick.addEventListener(
        "touchstart",
        start,
        {
            passive:false
        }
    );


    joystick.addEventListener(
        "touchmove",
        move,
        {
            passive:false
        }
    );


    joystick.addEventListener(
        "touchend",
        end
    );


    joystick.addEventListener(
        "mousedown",
        start
    );


    document.addEventListener(
        "mousemove",
        move
    );


    document.addEventListener(
        "mouseup",
        end
    );

}


/* ==================================================
   JOYSTICK BEWEGEN
================================================== */

function moveJoystick(
    event
) {

    event.preventDefault();


    let x;

    let y;


    if (
        event.touches &&
        event.touches.length
    ) {

        x =
            event.touches[0].clientX;

        y =
            event.touches[0].clientY;

    }

    else {

        x =
            event.clientX;

        y =
            event.clientY;

    }


    let dx =
        x -
        joystickCenter.x;


    let dy =
        y -
        joystickCenter.y;


    const max =
        42;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        length > max
    ) {

        dx =
            dx /
            length *
            max;

        dy =
            dy /
            length *
            max;

    }


    moveX =
        dx / max;


    moveY =
        dy / max;


    const stick =
        document
            .getElementById(
                "stick"
            );


    stick.style.left =
        `calc(50% + ${dx}px)`;


    stick.style.top =
        `calc(50% + ${dy}px)`;

}


/* ==================================================
   GAME LOOP
================================================== */

setInterval(
    movePlayer,
    50
);


/* ==================================================
   PLAYER BEWEGEN
================================================== */

function movePlayer() {

    if (
        !playerPosition ||
        (!moveX && !moveY)
    )
        return;


    const speed =
        0.000045;


    const newLat =
        playerPosition[0] -
        moveY * speed;


    const newLng =
        playerPosition[1] +
        moveX * speed;


    setPlayerPosition(
        newLat,
        newLng
    );


    updateCreatureDistances();


    map.panTo(
        playerPosition,
        {
            animate:false
        }
    );

}


/* ==================================================
   CENTER
================================================== */

function centerPlayer() {

    if (
        !playerPosition
    )
        return;


    map.setView(
        playerPosition,
        18
    );

}

   CREATURE SPAWN BUTTON
================================================== */

function spawnNearPlayer() {

    spawnCreature();


    showMessage(
        "👀 Een nieuwe Creature is verschenen!"
    );

}


/* ==================================================
   DISTANCE
================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;


    const dLat =
        (lat2-lat1)
        *
        Math.PI / 180;


    const dLon =
        (lon2-lon1)
        *
        Math.PI / 180;


    const a =

        Math.sin(dLat/2) *
        Math.sin(dLat/2)

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );


    return R * c;

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
    text
) {

    document
        .getElementById(
            "message"
        )
        .innerText =
        text;

}


/* ==================================================
   COLLECTION
================================================== */

function openCollection() {

    renderCollection();


    document
        .getElementById(
            "collectionModal"
        )
        .style.display =
        "flex";

}


function closeCollection() {

    document
        .getElementById(
            "collectionModal"
        )
        .style.display =
        "none";

}


function renderCollection() {

    const grid =
        document
            .getElementById(
                "collectionGrid"
            );


    grid.innerHTML = "";


    if (
        collection.length === 0
    ) {

        grid.innerHTML =

            `

            <div
                style="
                    grid-column:1/-1;
                    text-align:center;
                    padding:30px;
                    color:#91a39a;
                "
            >

                📖 Je Creaturenboek is nog leeg.

                <br><br>

                Ga op avontuur!

            </div>

            `;

        return;

    }


    collection.forEach(
        creature => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML =

                `

                <div class="cardEmoji">
                    ${creature.emoji}
                </div>

                <div class="cardName">
                    ${creature.name}
                </div>

                <div class="cardType">
                    ${creature.type}
                </div>

                `;


            grid.appendChild(
                card
            );

        }
    );

}
