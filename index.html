<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Creaturen Trail</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #07120e;
    color: white;
}

button {
    font-family: inherit;
}

/* =========================
   START
========================= */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(83,239,151,.25),
            transparent 35%
        ),
        linear-gradient(
            160deg,
            #06110d,
            #143624,
            #06110d
        );
}

.startLogo {
    width: 120px;
    height: 120px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 35px;

    font-size: 65px;

    background:
        linear-gradient(
            145deg,
            #7af2a9,
            #299858
        );

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

#startScreen h1 {
    margin: 22px 0 8px;
    font-size: clamp(38px,10vw,60px);
    font-weight: 900;
}

.startSub {
    color: #b8ccc1;
    font-size: 17px;
}

.startButton {
    margin-top: 38px;

    padding: 17px 42px;

    border: 0;
    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #76f0a5,
            #35b96d
        );

    color: #07120e;

    font-size: 17px;
    font-weight: 900;

    box-shadow:
        0 10px 30px rgba(47,185,108,.25);

    cursor: pointer;
}

.startButton:active {
    transform: scale(.96);
}

/* =========================
   GAME
========================= */

#game {
    display: none;
    position: fixed;
    inset: 0;
}

#map {
    position: absolute;
    inset: 0;
}

.leaflet-control-attribution {
    font-size: 8px;
}

/* =========================
   HUD
========================= */

.hud {
    position: fixed;
    z-index: 2000;

    top: 14px;
    left: 14px;
    right: 14px;

    display: flex;
    justify-content: space-between;

    pointer-events: none;
}

.hudBox {
    padding: 11px 14px;

    border-radius: 18px;

    background: rgba(5,18,12,.93);

    border:
        1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(14px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);
}

.gameTitle {
    font-size: 14px;
    font-weight: 900;
}

.levelText {
    margin-top: 5px;
    color: #72eda2;
    font-size: 11px;
    font-weight: bold;
}

.xpBar {
    width: 145px;
    height: 7px;
    margin-top: 7px;

    border-radius: 20px;
    overflow: hidden;

    background: rgba(255,255,255,.12);
}

.xpFill {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #57df91,
            #d1ff8b
        );

    transition: width .35s ease;
}

.stats {
    text-align: right;
    font-size: 12px;
    line-height: 1.6;
}

/* =========================
   MENU
========================= */

.menu {
    position: fixed;
    z-index: 2500;

    top: 110px;
    right: 14px;

    display: flex;
    flex-direction: column;
    gap: 9px;
}

.menu button {
    width: 52px;
    height: 52px;

    border: 0;
    border-radius: 17px;

    background: rgba(5,18,12,.94);

    color: white;
    font-size: 21px;

    box-shadow:
        0 6px 18px rgba(0,0,0,.3);

    cursor: pointer;
}

/* =========================
   MESSAGE
========================= */

.messageBox {
    position: fixed;
    z-index: 3000;

    left: 50%;
    bottom: 145px;

    transform: translateX(-50%);

    width: calc(100% - 30px);
    max-width: 430px;

    padding: 13px 16px;

    border-radius: 19px;

    background: rgba(5,18,12,.94);

    border:
        1px solid rgba(255,255,255,.12);

    text-align: center;

    backdrop-filter: blur(12px);
}

#message {
    font-size: 14px;
}

/* =========================
   PLAYER
========================= */

.playerMarker {
    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: #428cff;

    border: 4px solid white;

    box-shadow:
        0 0 0 9px rgba(66,140,255,.2),
        0 4px 15px rgba(0,0,0,.45);
}

/* =========================
   CREATURE MARKERS
========================= */

.creatureMarker {
    width: 62px;
    height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffffff,
            #d9e8df
        );

    border: 3px solid #12281c;

    font-size: 32px;

    box-shadow:
        0 7px 22px rgba(0,0,0,.5);

    transition:
        transform .2s,
        filter .2s;
}

.creatureMarker.nearby {
    transform: scale(1.35);

    filter:
        drop-shadow(
            0 0 12px #6ff0a3
        );
}

/* =========================
   JOYSTICK
========================= */

#joystick {
    position: fixed;

    z-index: 4000;

    left: 25px;
    bottom: 25px;

    width: 135px;
    height: 135px;

    border-radius: 50%;

    background: rgba(5,20,13,.5);

    border:
        2px solid rgba(255,255,255,.15);

    backdrop-filter: blur(5px);

    touch-action: none;
}

#stick {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 58px;
    height: 58px;

    transform: translate(-50%,-50%);

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #78f2a9,
            #2eaf68
        );

    border:
        3px solid rgba(255,255,255,.7);
}

/* =========================
   ENCOUNTER
========================= */

#encounter {
    position: fixed;
    inset: 0;

    z-index: 6000;

    display: none;

    flex-direction: column;
    justify-content: space-between;
    align-items: center;

    padding: 50px 20px 30px;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(75,230,139,.28),
            transparent 38%
        ),
        linear-gradient(
            160deg,
            #06140e,
            #123021,
            #06100b
        );
}

.encounterTop {
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.backButton {
    width: 48px;
    height: 48px;

    border: 0;
    border-radius: 15px;

    background: rgba(255,255,255,.1);

    color: white;
    font-size: 22px;
}

.rarity {
    padding: 8px 13px;

    border-radius: 20px;

    background: rgba(255,255,255,.1);

    color: #9ff8bd;

    font-size: 11px;
    font-weight: 900;
}

.encounterCreature {
    width: 190px;
    height: 190px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto;

    border-radius: 50%;

    font-size: 110px;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.96),
            rgba(95,235,145,.12)
        );

    box-shadow:
        0 0 75px rgba(100,240,160,.3),
        0 20px 55px rgba(0,0,0,.35);

    animation:
        floating 2.5s ease-in-out infinite;
}

@keyframes floating {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-13px);
    }
}

.encounterName {
    margin-top: 20px;
    font-size: 34px;
    font-weight: 900;
}

.encounterType {
    margin-top: 5px;
    color: #75eca4;
    font-weight: bold;
}

.encounterStats {
    width: 100%;
    max-width: 400px;

    display: grid;
    grid-template-columns: repeat(3,1fr);

    gap: 10px;
}

.statCard {
    padding: 12px 7px;

    border-radius: 16px;

    background: rgba(255,255,255,.08);
}

.statNumber {
    font-size: 18px;
    font-weight: 900;
}

.statLabel {
    margin-top: 4px;
    color: #99ada2;
    font-size: 9px;
}

#ball {
    width: 95px;
    height: 95px;

    border-radius: 50%;

    border: 7px solid white;

    background:
        linear-gradient(
            #f04c4c 0 47%,
            #181818 47% 54%,
            #f4f4f4 54%
        );

    box-shadow:
        0 12px 35px rgba(0,0,0,.45);

    cursor: pointer;

    transition:
        transform .25s;
}

#ball:active {
    transform: scale(.86) rotate(-15deg);
}

#throwText {
    margin-top: 10px;
    color: #b7c9bf;
    font-size: 12px;
}

/* =========================
   RESULT
========================= */

#result {
    position: fixed;
    inset: 0;

    z-index: 9000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.75);

    backdrop-filter: blur(10px);
}

.resultCard {
    width: 100%;
    max-width: 380px;

    padding: 30px;

    border-radius: 28px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            #163325,
            #07130d
        );
}

.resultEmoji {
    font-size: 85px;
}

.resultTitle {
    margin-top: 10px;
    font-size: 27px;
    font-weight: 900;
}

.resultText {
    margin-top: 10px;
    color: #b9cec3;
}

.resultButton {
    width: 100%;

    margin-top: 22px;

    padding: 15px;

    border: 0;
    border-radius: 15px;

    background: #70efa2;

    color: #07120e;

    font-size: 16px;
    font-weight: 900;
}

/* =========================
   COLLECTION
========================= */

.modal {
    position: fixed;
    inset: 0;

    z-index: 7000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.7);

    backdrop-filter: blur(8px);
}

.modalCard {
    width: 100%;
    max-width: 450px;

    max-height: 82vh;

    overflow-y: auto;

    padding: 22px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #142b20,
            #08140e
        );
}

.modalTitle {
    display: flex;
    align-items: center;
    justify-content: space-between;

    font-size: 22px;
    font-weight: 900;
}

.close {
    border: 0;
    background: transparent;
    color: white;
    font-size: 28px;
}

.dexGrid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 11px;

    margin-top: 20px;
}

.dexCard {
    min-height: 145px;

    padding: 14px;

    border-radius: 18px;

    text-align: center;

    background: rgba(255,255,255,.07);

    border:
        1px solid rgba(255,255,255,.05);
}

.dexNumber {
    color: #758d81;
    font-size: 10px;
}

.dexEmoji {
    margin-top: 4px;
    font-size: 43px;
}

.dexName {
    margin-top: 5px;
    font-weight: 900;
}

.dexType {
    margin-top: 4px;
    color: #73eaa0;
    font-size: 10px;
}

.dexRarity {
    margin-top: 4px;
    color: #aabbb2;
    font-size: 9px;
}

.locked {
    opacity: .38;
    filter: grayscale(1);
}

/* =========================
   MOBILE
========================= */

@media (max-height: 650px) {

    .encounterCreature {
        width: 145px;
        height: 145px;
        font-size: 80px;
    }

    .encounterName {
        font-size: 28px;
    }

    #ball {
        width: 75px;
        height: 75px;
    }

}
</style>
</head>

<!-- =========================

<section id="startScreen">

    <div class="startSub">
        Ontdek • Vind • Vang
    </div>

    <button
        class="startButton"
        onclick="startGame()"
    >
        START AVONTUUR

</section>


<!-- =========================
     GAME
========================= -->

<section id="game">

    <div id="map"></div>

    <div class="hud">

        <div class="hudBox">

            <div class="gameTitle">

                LEVEL <span id="level">1</span>
            </div>

            <div class="xpBar">
                <div
                    id="xpFill"
                    class="xpFill"
                ></div>
            </div>

        </div>

        <div class="hudBox stats">

            ⭐ <span id="xp">0</span> XP

            <br>

            🎒 <span id="count">0</span> Creaturen

        </div>

    </div>


    <div class="menu">

        <button onclick="openDex()">
            📖
        </button>

        <button onclick="centerPlayer()">
            📍
        </button>

        <button onclick="spawnNearPlayer()">
            👾
        </button>

    </div>


    <div class="messageBox">
        <div id="message">
            Zoek naar Creaturen!
        </div>
    </div>


    <div id="joystick">

        <div id="stick"></div>

    </div>

</section>


<!-- =========================
     ENCOUNTER
========================= -->

<section id="encounter">

    <div class="encounterTop">

        <button
            class="backButton"
            onclick="closeEncounter()"
        >
            ←
        </button>

        <div
            class="rarity"
            id="encounterRarity"
        >
            GEWOON
        </div>

    </div>


    <div>

        <div
            id="encounterEmoji"
            class="encounterCreature"
        >
            🔥
        </div>

        <div
            id="encounterName"
            class="encounterName"
        >
            Blazik
        </div>

        <div
            id="encounterType"
            class="encounterType"
        >
            Vuur
        </div>

    </div>


    <div class="encounterStats">

        <div class="statCard">

            <div
                id="statPower"
                class="statNumber"
            >
                65
            </div>

            <div class="statLabel">
                KRACHT
            </div>

        </div>


        <div class="statCard">

            <div
                id="statChance"
                class="statNumber"
            >
                75%
            </div>

            <div class="statLabel">
                VANGKANS
            </div>

        </div>


        <div class="statCard">

            <div
                id="statXP"
                class="statNumber"
            >
                +10
            </div>

            <div class="statLabel">
                XP
            </div>

        </div>

    </div>


    <div>

        <button
            id="ball"
            onclick="throwBall()"
        ></button>

        <div id="throwText">
            Tik op de vangbal!
        </div>

    </div>

</section>


<!-- =========================
     RESULT
========================= -->

<section id="result">

    <div class="resultCard">

        <div
            id="resultEmoji"
            class="resultEmoji"
        >
            🎉
        </div>

        <div
            id="resultTitle"
            class="resultTitle"
        >
            Gevangen!
        </div>

        <div
            id="resultText"
            class="resultText"
        >
            Creature gevangen!
        </div>

        <button
            class="resultButton"
            onclick="closeResult()"
        >
            DOORGAAN
        </button>

    </div>

</section>


<!-- =========================
     DEX
========================= -->

<div
    id="dexModal"
    class="modal"
>

    <div class="modalCard">

        <div class="modalTitle">

            <span>
                📖 Creaturen-Dex
            </span>

            <button
                class="close"
                onclick="closeDex()"
            >
                ×
            </button>

        </div>

        <div
            id="dexGrid"
            class="dexGrid"
        ></div>

    </div>

</div>

        emoji:"🌩️",
        type:"Storm",
        rarity:"Legendarisch",
        power:130,
        catchChance:5,
        xp:150
    },

    {
        id:30,
        name:"Eonara",
        emoji:"🌌",
        type:"Kosmisch",
        rarity:"Mythisch",
        power:150,
        catchChance:2,
        xp:250
    }

];


/* =====================================================
   GAME VARIABLES
===================================================== */

let map;

let playerMarker;

let playerPosition;

let spawnedCreatures = [];

let selectedCreature = null;

let selectedCreatureData = null;

let caughtCreatures = [];

let xp = 0;

let totalCaught = 0;

let moveX = 0;

let moveY = 0;

let joystickActive = false;

let joystickCenter = {
    x:0,
    y:0
};


/* =====================================================
   START
===================================================== */

function startGame() {

    document
        .getElementById("startScreen")
        .style.display = "none";

    document
        .getElementById("game")
        .style.display = "block";

    createMap();

    setupJoystick();

    locatePlayer();

}


/* =====================================================
   MAP
===================================================== */

function createMap() {

    map = L.map("map").setView(
        [52.3676,4.9041],
        17
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:
                "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);

}


/* =====================================================
   GPS
===================================================== */

function locatePlayer() {

    if (!navigator.geolocation) {

        useDefaultLocation();

        return;
    }

    navigator.geolocation.getCurrentPosition(

        position => {

            setPlayerPosition(
                position.coords.latitude,
                position.coords.longitude
            );

            createInitialCreatures();

        },

        () => {

            useDefaultLocation();

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:5000
        }

    );

}


/* =====================================================
   DEFAULT LOCATION
===================================================== */

function useDefaultLocation() {

    setPlayerPosition(
        52.3676,
        4.9041
    );

    createInitialCreatures();

}


/* =====================================================
   PLAYER
===================================================== */

function setPlayerPosition(
    lat,
    lng
) {

    playerPosition = [
        lat,
        lng
    ];

    if (!playerMarker) {

        const icon =
            L.divIcon({

                className:"",

                html:
                    '<div class="playerMarker"></div>',

                iconSize:[30,30],

                iconAnchor:[15,15]

            });

        playerMarker =
            L.marker(
                [lat,lng],
                {
                    icon:icon
                }
            ).addTo(map);

        map.setView(
            [lat,lng],
            18
        );

    } else {

        playerMarker.setLatLng(
            [lat,lng]
        );

    }

}


/* =====================================================
   CREATURE SPAWN
===================================================== */

function createInitialCreatures() {

    for (
        let i=0;
        i<12;
        i++
    ) {

        spawnCreature();

    }

    showMessage(
        "👀 Zoek een Creature op de kaart!"
    );

}


function chooseCreature() {

    const random =
        Math.random();

    let pool;

    if (random < .55) {

        pool =
            creatures.filter(
                c => c.rarity === "Gewoon"
            );

    } else if (random < .88) {

        pool =
            creatures.filter(
                c => c.rarity === "Zeldzaam"
            );

    } else if (random < .985) {

        pool =
            creatures.filter(
                c => c.rarity === "Episch"
            );

    } else {

        pool =
            creatures.filter(
                c =>
                    c.rarity === "Legendarisch" ||
                    c.rarity === "Mythisch"
            );

    }

    return pool[
        Math.floor(
            Math.random() * pool.length
        )
    ];

}


function spawnCreature() {

    if (!playerPosition)
        return;

    const creature =
        chooseCreature();

    const angle =
        Math.random() *
        Math.PI *
        2;

    const distance =
        .0006 +
        Math.random() *
        .0028;

    const lat =
        playerPosition[0] +
        Math.cos(angle) *
        distance;

    const lng =
        playerPosition[1] +
        Math.sin(angle) *
        distance;

    const icon =
        L.divIcon({

            className:"",

            html:
                `<div class="creatureMarker">
                    ${creature.emoji}
                </div>`,

            iconSize:[62,62],

            iconAnchor:[31,31]

        });

    const marker =
        L.marker(
            [lat,lng],
            {
                icon:icon
            }
        ).addTo(map);

    marker.creatureData =
        creature;

    marker.on(
        "click",
        () => {

            const position =
                marker.getLatLng();

            const distance =
                getDistance(
                    playerPosition[0],
                    playerPosition[1],
                    position.lat,
                    position.lng
                );

            if (distance <= 60) {

                openEncounter(
                    marker,
                    creature
                );

            } else {

                showMessage(
                    "🚶 Nog " +
                    Math.round(distance) +
                    " meter!"
                );

            }

        }
    );

    spawnedCreatures.push(
        marker
    );

}


/* =====================================================
   SPAWN BUTTON
===================================================== */

function spawnNearPlayer() {

    if (!playerPosition)
        return;

    const creature =
        chooseCreature();

    const angle =
        Math.random() *
        Math.PI *
        2;

    const distance =
        .00025 +
        Math.random() *
        .0005;

    const lat =
        playerPosition[0] +
        Math.cos(angle) *
        distance;

    const lng =
        playerPosition[1] +
        Math.sin(angle) *
        distance;

    const icon =
        L.divIcon({

            className:"",

            html:
                `<div class="creatureMarker">
                    ${creature.emoji}
                </div>`,

            iconSize:[62,62],

            iconAnchor:[31,31]

        });

    const marker =
        L.marker(
            [lat,lng],
            {
                icon:icon
            }
        ).addTo(map);

    marker.creatureData =
        creature;

    marker.on(
        "click",
        () => {

            openEncounter(
                marker,
                creature
            );

        }
    );

    spawnedCreatures.push(
        marker
    );

    showMessage(
        "👾 Een Creature is vlakbij verschenen!"
    );

}


/* =====================================================
   DISTANCE CHECK
===================================================== */

setInterval(
    updateCreatureDistances,
    500
);


function updateCreatureDistances() {

    if (!playerPosition)
        return;

    spawnedCreatures.forEach(
        marker => {

            const pos =
                marker.getLatLng();

            const distance =
                getDistance(
                    playerPosition[0],
                    playerPosition[1],
                    pos.lat,
                    pos.lng
                );

            const element =
                marker.getElement();

            if (!element)
                return;

            const visual =
                element.querySelector(
                    ".creatureMarker"
                );

            if (!visual)
                return;

            if (distance <= 60) {

                visual.classList.add(
                    "nearby"
                );

            } else {

                visual.classList.remove(
                    "nearby"
                );

            }

        }
    );

}


/* =====================================================
   ENCOUNTER
===================================================== */

function openEncounter(
    marker,
    creature
) {

    selectedCreature =
        marker;

    selectedCreatureData =
        creature;

    document
        .getElementById("encounterEmoji")
        .innerText =
        creature.emoji;

    document
        .getElementById("encounterName")
        .innerText =
        creature.name;

    document
        .getElementById("encounterType")
        .innerText =
        creature.type;

    document
        .getElementById("encounterRarity")
        .innerText =
        creature.rarity.toUpperCase();

    document
        .getElementById("statPower")
        .innerText =
        creature.power;

    document
        .getElementById("statChance")
        .innerText =
        creature.catchChance + "%";

    document
        .getElementById("statXP")
        .innerText =
        "+" + creature.xp;

    document
        .getElementById("throwText")
        .innerText =
        "Tik op de vangbal!";

    document
        .getElementById("encounter")
        .style.display =
        "flex";

}


/* =====================================================
   THROW
===================================================== */

function throwBall() {

    if (!selectedCreatureData)
        return;

    const ball =
        document.getElementById("ball");

    ball.style.transform =
        "translateY(-150px) scale(.65) rotate(360deg)";

    document
        .getElementById("throwText")
        .innerText =
        "🎯 Vangbal gegooid!";

    setTimeout(
        resolveCatch,
        900
    );

}


function resolveCatch() {

    const creature =
        selectedCreatureData;

    const roll =
        Math.random() * 100;

    if (
        roll <= creature.catchChance
    ) {

        catchSuccess();

    } else {

        catchFail();

    }

}


/* =====================================================
   CATCH SUCCESS
===================================================== */

function catchSuccess() {

    const creature =
        selectedCreatureData;

    if (selectedCreature) {

        map.removeLayer(
            selectedCreature
        );

        spawnedCreatures =
            spawnedCreatures.filter(
                marker =>
                    marker !==
                    selectedCreature
            );

    }

    caughtCreatures.push(
        creature.id
    );

    totalCaught++;

    xp += creature.xp;

    updateStats();

    document
        .getElementById("resultEmoji")
        .innerText =
        creature.emoji;

    document
        .getElementById("resultTitle")
        .innerText =
        "🎉 Gevangen!";

    document
        .getElementById("resultText")
        .innerText =
        creature.name +
        " is toegevoegd aan je Creaturen-Dex! +" +
        creature.xp +
        " XP";

    document
        .getElementById("result")
        .style.display =
        "flex";

    resetBall();

}


/* =====================================================
   CATCH FAIL
===================================================== */

function catchFail() {

    const creature =
        selectedCreatureData;

    document
        .getElementById("resultEmoji")
        .innerText =
        "💨";

    document
        .getElementById("resultTitle")
        .innerText =
        "Ontsnapt!";

    document
        .getElementById("resultText")
        .innerText =
        creature.name +
        " is uit de vangbal ontsnapt!";

    document
        .getElementById("result")
        .style.display =
        "flex";

    resetBall();

}


/* =====================================================
   CLOSE ENCOUNTER
===================================================== */

function closeEncounter() {

    document
        .getElementById("encounter")
        .style.display =
        "none";

    selectedCreature =
        null;

    selectedCreatureData =
        null;

    resetBall();

}


function closeResult() {

    document
        .getElementById("result")
        .style.display =
        "none";

    closeEncounter();

    setTimeout(
        spawnCreature,
        1200
    );

}


/* =====================================================
   BALL RESET
===================================================== */

function resetBall() {

    const ball =
        document.getElementById("ball");

    setTimeout(
        () => {

            ball.style.transform =
                "";

        },
        250
    );

}


/* =====================================================
   XP
===================================================== */

function updateStats() {

    const level =
        Math.floor(
            xp / 100
        ) + 1;

    const progress =
        xp % 100;

    document
        .getElementById("xp")
        .innerText =
        xp;

    document
        .getElementById("count")
        .innerText =
        totalCaught;

    document
        .getElementById("level")
        .innerText =
        level;

    document
        .getElementById("xpFill")
        .style.width =
        progress + "%";

}


/* =====================================================
   DEX
===================================================== */

function openDex() {

    renderDex();

    document
        .getElementById("dexModal")
        .style.display =
        "flex";

}


function closeDex() {

    document
        .getElementById("dexModal")
        .style.display =
        "none";

}


function renderDex() {

    const grid =
        document
            .getElementById("dexGrid");

    grid.innerHTML = "";

    creatures.forEach(
        creature => {

            const caught =
                caughtCreatures.includes(
                    creature.id
                );

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "dexCard" +
                (
                    caught
                    ? ""
                    : " locked"
                );

            card.innerHTML = `

                <div class="dexNumber">
                    #${String(
                        creature.id
                    ).padStart(3,"0")}
                </div>

                <div class="dexEmoji">
                    ${
                        caught
                        ? creature.emoji
                        : "❔"
                    }
                </div>

                <div class="dexName">
                    ${
                        caught
                        ? creature.name
                        : "Onbekend"
                    }
                </div>

                <div class="dexType">
                    ${
                        caught
                        ? creature.type
                        : "???"
                    }
                </div>

                <div class="dexRarity">
                    ${
                        caught
                        ? creature.rarity
                        : "Nog niet ontdekt"
                    }
                </div>

            `;

            grid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   JOYSTICK
===================================================== */

function setupJoystick() {

    const joystick =
        document.getElementById(
            "joystick"
        );

    const stick =
        document.getElementById(
            "stick"
        );


    function start(event) {

        joystickActive =
            true;

        const rect =
            joystick.getBoundingClientRect();

        joystickCenter.x =
            rect.left +
            rect.width / 2;

        joystickCenter.y =
            rect.top +
            rect.height / 2;

        moveJoystick(event);

    }


    function move(event) {

        if (!joystickActive)
            return;

        moveJoystick(event);

    }


    function end() {

        joystickActive =
            false;

        moveX = 0;
        moveY = 0;

        stick.style.left =
            "50%";

        stick.style.top =
            "50%";

    }


    joystick.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    joystick.addEventListener(
        "touchmove",
        move,
        {passive:false}
    );

    joystick.addEventListener(
        "touchend",
        end
    );

    joystick.addEventListener(
        "mousedown",
        start
    );

    document.addEventListener(
        "mousemove",
        move
    );

    document.addEventListener(
        "mouseup",
        end
    );

}


/* =====================================================
   JOYSTICK MOVE
===================================================== */

function moveJoystick(event) {

    event.preventDefault();

    let x;
    let y;

    if (
        event.touches &&
        event.touches.length
    ) {

        x =
            event.touches[0].clientX;

        y =
            event.touches[0].clientY;

    } else {

        x =
            event.clientX;

        y =
            event.clientY;

    }

    let dx =
        x -
        joystickCenter.x;

    let dy =
        y -
        joystickCenter.y;

    const max =
        42;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (
        distance > max
    ) {

        dx =
            dx /
            distance *
            max;

        dy =
            dy /
            distance *
            max;

    }

    moveX =
        dx / max;

    moveY =
        dy / max;

    const stick =
        document.getElementById(
            "stick"
        );

    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px`;

}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

setInterval(
    movePlayer,
    50
);


function movePlayer() {

    if (
        !playerPosition ||
        (!moveX && !moveY)
    )
        return;

    const speed =
        0.000045;

    const lat =
        playerPosition[0] -
        moveY * speed;

    const lng =
        playerPosition[1] +
        moveX * speed;

    setPlayerPosition(
        lat,
        lng
    );

    map.panTo(
        playerPosition,
        {
            animate:false
        }
    );

}


/* =====================================================
   CENTER
===================================================== */

function centerPlayer() {

    if (!playerPosition)
        return;

    map.setView(
        playerPosition,
        18
    );

}


/* =====================================================
   DISTANCE
===================================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;

    const dLat =
        (lat2-lat1) *
        Math.PI / 180;

    const dLon =
        (lon2-lon1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat/2) *
        Math.sin(dLat/2)

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(dLon/2) *
        Math.sin(dLon/2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );

    return R * c;

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text) {

    document
        .getElementById("message")
        .innerText =
        text;

}

</script>
