<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CreatureGO</title>

<style>

/* =========================================================
   BASIS
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #08111f;
    color: white;
}

button {
    font-family: inherit;
    border: none;
    cursor: pointer;
}


/* =========================================================
   SCHERMEN
========================================================= */

.screen {
    position: fixed;
    inset: 0;
    display: none;
}

.screen.active {
    display: block;
}


/* =========================================================
   STARTSCHERM
========================================================= */

#startScreen {
    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(110, 80, 255, .35),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(0, 220, 170, .25),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #050914,
            #101b30
        );
}

.startContent {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 25px;
}

.logo {
    font-size: clamp(55px, 12vw, 110px);
    font-weight: 1000;
    letter-spacing: -6px;
}

.logo span {
    color: #8068ff;
}

.subtitle {
    margin-top: 15px;
    font-size: clamp(20px, 4vw, 30px);
}

.description {
    max-width: 650px;
    margin-top: 15px;

    color: #a9b5c8;
    font-size: 17px;
    line-height: 1.6;
}

.startButton {
    margin-top: 35px;

    padding: 18px 32px;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #8068ff,
            #5334e8
        );

    color: white;

    font-size: 18px;
    font-weight: bold;

    box-shadow:
        0 15px 50px
        rgba(83, 52, 232, .4);

    transition: .2s;
}

.startButton:hover {
    transform: translateY(-3px);
}

.features {
    display: flex;
    gap: 12px;

    margin-top: 35px;

    flex-wrap: wrap;
    justify-content: center;
}

.feature {
    width: 150px;

    padding: 15px;

    border-radius: 16px;

    background: rgba(255,255,255,.06);

    border:
        1px solid
        rgba(255,255,255,.08);
}

.featureIcon {
    font-size: 30px;
    margin-bottom: 7px;
}

.feature small {
    color: #8f9bb0;
}


/* =========================================================
   GAME
========================================================= */

#gameScreen {
    background: #9fc77c;
}

#game {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar {
    height: 70px;

    flex-shrink: 0;

    z-index: 100;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 10px 15px;

    background:
        rgba(10, 18, 32, .94);

    backdrop-filter: blur(15px);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.topButton {
    width: 46px;
    height: 46px;

    border-radius: 13px;

    background:
        rgba(255,255,255,.07);

    color: white;

    font-size: 20px;
}

.topButton:hover {
    background:
        rgba(255,255,255,.14);
}

.level {
    font-weight: bold;
}

.playerInfo {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 10px;
}

.xpContainer {
    width: 120px;
}

.xpText {
    color: #9daabe;
    font-size: 11px;
    margin-bottom: 4px;
}

.xpBar {
    width: 100%;
    height: 7px;

    background:
        rgba(255,255,255,.12);

    border-radius: 20px;

    overflow: hidden;
}

.xpFill {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #8068ff,
            #15d4ac
        );

    transition: .3s;
}

.avatar {
    width: 44px;
    height: 44px;

    border-radius: 13px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 22px;

    background:
        linear-gradient(
            135deg,
            #8068ff,
            #15c9a5
        );
}


/* =========================================================
   MAP
========================================================= */

#mapContainer {
    position: relative;

    flex: 1;

    min-height: 0;

    overflow: hidden;
}

#mapCanvas {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    cursor: grab;

    touch-action: none;
}

#mapCanvas.dragging {
    cursor: grabbing;
}


/* =========================================================
   MAP CONTROLS
========================================================= */

.mapControls {
    position: absolute;

    top: 15px;
    right: 15px;

    z-index: 20;

    display: flex;
    flex-direction: column;

    gap: 8px;
}

.mapButton {
    width: 46px;
    height: 46px;

    border-radius: 13px;

    background:
        rgba(12,22,38,.92);

    border:
        1px solid
        rgba(255,255,255,.1);

    color: white;

    font-size: 21px;
}

.mapButton:hover {
    background: #1c2a40;
}


/* =========================================================
   BOTTOM NAV
========================================================= */

.bottomNav {
    height: 78px;

    flex-shrink: 0;

    z-index: 100;

    display: flex;
    justify-content: space-around;
    align-items: center;

    background:
        rgba(10,18,32,.96);

    border-top:
        1px solid
        rgba(255,255,255,.08);
}

.navButton {
    width: 80px;
    height: 62px;

    border-radius: 13px;

    background: transparent;

    color: #8290a7;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 3px;
}

.navButton span {
    font-size: 22px;
}

.navButton small {
    font-size: 10px;
}

.navButton.active {
    color: white;

    background:
        rgba(255,255,255,.07);
}


/* =========================================================
   INFO POPUP
========================================================= */

#creaturePopup {
    position: absolute;

    left: 50%;
    bottom: 100px;

    transform:
        translateX(-50%)
        translateY(20px);

    width: min(380px, calc(100% - 30px));

    padding: 20px;

    border-radius: 22px;

    background:
        rgba(12,22,38,.97);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.45);

    z-index: 80;

    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

#creaturePopup.open {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);

    pointer-events: auto;
}

.popupTop {
    display: flex;
    align-items: center;

    gap: 15px;
}

.popupEmoji {
    width: 70px;
    height: 70px;

    border-radius: 18px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 42px;

    background:
        radial-gradient(
            circle,
            #ffffff25,
            #ffffff05
        );
}

.popupInfo {
    flex: 1;
}

.popupInfo h2 {
    margin-bottom: 5px;
}

.popupInfo small {
    color: #93a1b6;
}

.popupButtons {
    display: flex;

    gap: 10px;

    margin-top: 15px;
}

.catchButton {
    flex: 1;

    padding: 13px;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #15d4ac,
            #079b7f
        );

    color: #061812;

    font-weight: bold;
}

.closePopup {
    width: 42px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.08);

    color: white;
}


/* =========================================================
   TOAST
========================================================= */

#toast {
    position: absolute;

    left: 50%;
    bottom: 95px;

    transform:
        translateX(-50%)
        translateY(20px);

    padding: 12px 18px;

    border-radius: 13px;

    background:
        rgba(8,16,29,.96);

    border:
        1px solid
        rgba(255,255,255,.1);

    z-index: 500;

    opacity: 0;

    pointer-events: none;

    transition: .25s;

    white-space: nowrap;
}

#toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width: 650px) {

    .topbar {
        height: 62px;
    }

    .bottomNav {
        height: 70px;
    }

    .xpContainer {
        width: 85px;
    }

    .navButton {
        width: 65px;
    }

    .navButton small {
        font-size: 9px;
    }

    .feature {
        width: 135px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     START
======================================================= -->

<section
    id="startScreen"
    class="screen active"
>

    <div class="startContent">

        <div class="logo">
            CREATURE<span>GO</span>
        </div>

        <div class="subtitle">
            🌍 Jouw Creature-avontuur begint hier
        </div>

        <p class="description">

            Verken de wereld, ontdek wilde Creatures
            en bouw jouw eigen collectie.

        </p>

        <button
            id="startButton"
            class="startButton"
        >
            🚀 START AVONTUUR
        </button>


        <div class="features">

            <div class="feature">

                <div class="featureIcon">
                    🗺️
                </div>

                <b>Wereld</b>

                <br>

                <small>
                    Verken de kaart
                </small>

            </div>


            <div class="feature">

                <div class="featureIcon">
                    👾
                </div>

                <b>Creatures</b>

                <br>

                <small>
                    Ontdek ze
                </small>

            </div>


            <div class="feature">

                <div class="featureIcon">
                    ⭐
                </div>

                <b>Levels</b>

                <br>

                <small>
                    Word sterker
                </small>

            </div>


            <div class="feature">

                <div class="featureIcon">
                    🏆
                </div>

                <b>Collectie</b>

                <br>

                <small>
                    Verzamel ze
                </small>

            </div>

        </div>

    </div>

</section>



<!-- =======================================================
     GAME
======================================================= -->

<section
    id="gameScreen"
    class="screen"
>

    <div id="game">


        <!-- TOPBAR -->

        <header class="topbar">

            <button
                id="menuButton"
                class="topButton"
            >
                ☰
            </button>

            <button
                id="locationButton"
                class="topButton"
            >
                📍
            </button>

            <div class="level">
                Lv. <span id="levelText">1</span>
            </div>


            <div class="playerInfo">

                <div class="xpContainer">

                    <div class="xpText">

                        <span id="xpCurrent">
                            0
                        </span>

                        /

                        <span id="xpMax">
                            250
                        </span>

                        XP

                    </div>

                    <div class="xpBar">

                        <div
                            id="xpFill"
                            class="xpFill"
                        ></div>

                    </div>

                </div>


                <div class="avatar">
                    🧑‍🚀
                </div>

            </div>

        </header>



        <!-- MAP -->

        <div id="mapContainer">

            <canvas
                id="mapCanvas"
            ></canvas>


            <!-- MAP CONTROLS -->

            <div class="mapControls">

                <button
                    id="zoomIn"
                    class="mapButton"
                >
                    ＋
                </button>

                <button
                    id="zoomOut"
                    class="mapButton"
                >
                    −
                </button>

                <button
                    id="centerMap"
                    class="mapButton"
                >
                    ⌾
                </button>

            </div>



            <!-- CREATURE POPUP -->

            <div id="creaturePopup">

                <div class="popupTop">

                    <div
                        id="popupEmoji"
                        class="popupEmoji"
                    >
                        🔥
                    </div>


                    <div class="popupInfo">

                        <h2 id="popupName">
                            Flamora
                        </h2>

                        <small id="popupInfo">
                            Fire • Common
                        </small>

                    </div>

                </div>


                <div class="popupButtons">

                    <button
                        id="catchButton"
                        class="catchButton"
                    >
                        🎯 VANG CREATURE
                    </button>

                    <button
                        id="closePopup"
                        class="closePopup"
                    >
                        ✕
                    </button>

                </div>

            </div>


            <!-- TOAST -->

            <div id="toast"></div>

        </div>



        <!-- BOTTOM NAV -->

        <nav class="bottomNav">

            <button
                class="navButton active"
            >

                <span>
                    🗺️
                </span>

                <small>
                    Kaart
                </small>

            </button>


            <button
                class="navButton"
                id="collectionButton"
            >

                <span>
                    👾
                </span>

                <small>
                    Creatures
                </small>

            </button>


            <button
                class="navButton"
            >

                <span>
                    🎉
                </span>

                <small>
                    Events
                </small>

            </button>


            <button
                class="navButton"
            >

                <span>
                    👤
                </span>

                <small>
                    Profiel
                </small>

            </button>

        </nav>

    </div>

</section>



<script>

/* =========================================================
   CREATURE DATA
========================================================= */

const CREATURES = [

    {
        id: "flamora",
        name: "Flamora",
        type: "Fire",
        rarity: "Common",
        emoji: "🔥",
        xp: 25
    },

    {
        id: "aquari",
        name: "Aquari",
        type: "Water",
        rarity: "Common",
        emoji: "💧",
        xp: 25
    },

    {
        id: "leafin",
        name: "Leafin",
        type: "Nature",
        rarity: "Common",
        emoji: "🌿",
        xp: 25
    },

    {
        id: "sparko",
        name: "Sparko",
        type: "Electric",
        rarity: "Rare",
        emoji: "⚡",
        xp: 50
    },

    {
        id: "frostel",
        name: "Frostel",
        type: "Ice",
        rarity: "Rare",
        emoji: "❄️",
        xp: 50
    },

    {
        id: "mystia",
        name: "Mystia",
        type: "Mystic",
        rarity: "Epic",
        emoji: "🔮",
        xp: 100
    },

    {
        id: "lunari",
        name: "Lunari",
        type: "Mystic",
        rarity: "Legendary",
        emoji: "🌙",
        xp: 500
    }

];


/* =========================================================
   PLAYER DATA
========================================================= */

let player = JSON.parse(
    localStorage.getItem("creaturego-player")
) || {

    level: 1,

    xp: 0,

    coins: 100,

    caught: []

};


/* =========================================================
   SAVE
========================================================= */

function savePlayer() {

    localStorage.setItem(
        "creaturego-player",
        JSON.stringify(player)
    );

}


/* =========================================================
   XP
========================================================= */

function requiredXP() {

    return player.level * 250;

}


function addXP(amount) {

    player.xp += amount;


    while (
        player.xp >= requiredXP()
    ) {

        player.xp -= requiredXP();

        player.level++;

        showToast(
            "🎉 LEVEL UP! Level " +
            player.level
        );

    }


    savePlayer();

    updateUI();

}


/* =========================================================
   UI
========================================================= */

function updateUI() {

    document.getElementById(
        "levelText"
    ).textContent =
        player.level;


    document.getElementById(
        "xpCurrent"
    ).textContent =
        player.xp;


    document.getElementById(
        "xpMax"
    ).textContent =
        requiredXP();


    document.getElementById(
        "xpFill"
    ).style.width =

        Math.min(
            100,
            (
                player.xp /
                requiredXP()
            ) * 100
        ) + "%";

}


/* =========================================================
   START GAME
========================================================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    startGame
);


function startGame() {

    document.getElementById(
        "startScreen"
    ).classList.remove("active");


    document.getElementById(
        "gameScreen"
    ).classList.add("active");


    resizeCanvas();

    createWorld();

    spawnInitialCreatures();

    updateUI();

}


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById(
        "mapCanvas"
    );

const ctx =
    canvas.getContext("2d");


let map = {

    x: 0,

    y: 0,

    zoom: 1

};


function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    drawMap();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   WORLD
========================================================= */

function createWorld() {

    drawMap();

}


function drawMap() {

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    if (
        !width ||
        !height
    ) return;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* GRAS */

    ctx.fillStyle =
        "#afd184";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* GRID / VELDEN */

    const grid =
        100 * map.zoom;


    for (
        let x = -grid;
        x < width + grid;
        x += grid
    ) {

        for (
            let y = -grid;
            y < height + grid;
            y += grid
        ) {

            const tileX =
                Math.floor(x / grid);

            const tileY =
                Math.floor(y / grid);


            ctx.fillStyle =
                (
                    (tileX + tileY)
                    % 2 === 0
                )
                ? "#b5d68a"
                : "#acd080";


            ctx.fillRect(
                x +
                (
                    map.x *
                    width *
                    map.zoom
                ) % grid,

                y +
                (
                    map.y *
                    height *
                    map.zoom
                ) % grid,

                grid + 1,
                grid + 1
            );

        }

    }


    /* RIVIER */

    drawRiver(
        width,
        height
    );


    /* WEGEN */

    drawRoad(
        -100,
        height * .55,
        width + 100,
        height * .45
    );


    drawRoad(
        width * .65,
        -100,
        width * .58,
        height + 100
    );


    /* PARKEN */

    drawPark(
        width * .18,
        height * .25,
        90
    );


    drawPark(
        width * .80,
        height * .72,
        110
    );


    drawPark(
        width * .38,
        height * .82,
        70
    );


    /* GEBOUWEN */

    drawBuildings(
        width,
        height
    );


    /* POI'S */

    drawPOI(
        width * .22,
        height * .46,
        "🏪"
    );


    drawPOI(
        width * .72,
        height * .30,
        "🏥"
    );


    drawPOI(
        width * .48,
        height * .68,
        "🏛️"
    );


    drawPOI(
        width * .85,
        height * .57,
        "🌳"
    );


    /* CREATURES */

    creatureSpawns.forEach(
        spawn => {

            const pos =
                worldToScreen(
                    spawn.x,
                    spawn.y
                );


            if (
                pos.x < -60 ||
                pos.x > width + 60 ||
                pos.y < -60 ||
                pos.y > height + 60
            ) return;


            /* cirkel */

            ctx.beginPath();

            ctx.fillStyle =
                "rgba(255,255,255,.92)";

            ctx.arc(
                pos.x,
                pos.y,
                29,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* emoji */

            ctx.font =
                "30px Arial";

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                spawn.creature.emoji,
                pos.x,
                pos.y
            );


            /* naam */

            ctx.font =
                "11px Arial";

            ctx.fillStyle =
                "#182338";

            ctx.fillText(
                spawn.creature.name,
                pos.x,
                pos.y + 43
            );

        }
    );


    /* SPELER */

    drawPlayer(
        width,
        height
    );

}


/* =========================================================
   RIVIER
========================================================= */

function drawRiver(
    width,
    height
) {

    ctx.strokeStyle =
        "#68b4d2";

    ctx.lineWidth =
        48;

    ctx.lineCap =
        "round";


    ctx.beginPath();

    ctx.moveTo(
        -100,
        height * .20
    );


    ctx.bezierCurveTo(
        width * .25,
        height * .35,

        width * .45,
        height * .08,

        width * .70,
        height * .34
    );


    ctx.bezierCurveTo(
        width * .82,
        height * .48,

        width * .93,
        height * .32,

        width + 100,
        height * .44
    );


    ctx.stroke();


    ctx.strokeStyle =
        "#91d6e7";

    ctx.lineWidth =
        32;

    ctx.stroke();

}


/* =========================================================
   WEGEN
========================================================= */

function drawRoad(
    x1,
    y1,
    x2,
    y2
) {

    ctx.strokeStyle =
        "#d1bd8d";

    ctx.lineWidth =
        27;

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.stroke();


    ctx.strokeStyle =
        "#ead8a5";

    ctx.lineWidth =
        17;

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.stroke();

}


/* =========================================================
   PARK
========================================================= */

function drawPark(
    x,
    y,
    radius
) {

    ctx.fillStyle =
        "#8cbb6e";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const angle =
            i * .63;


        const treeX =
            x +
            Math.cos(angle) *
            radius *
            .65;


        const treeY =
            y +
            Math.sin(angle) *
            radius *
            .65;


        ctx.fillStyle =
            "#57935e";


        ctx.beginPath();

        ctx.arc(
            treeX,
            treeY,
            10,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* =========================================================
   GEBOUWEN
========================================================= */

function drawBuildings(
    width,
    height
) {

    for (
        let i = 0;
        i < 28;
        i++
    ) {

        const x =
            (
                i * 137
            ) % width;


        const y =
            (
                i * 83
            ) % height;


        const w =
            35 +
            (i % 3) * 14;


        const h =
            28 +
            (i % 2) * 12;


        ctx.fillStyle =
            "#d8d3c4";


        ctx.fillRect(
            x,
            y,
            w,
            h
        );


        ctx.fillStyle =
            "#9b7966";


        ctx.fillRect(
            x,
            y,
            w,
            8
        );

    }

}


/* =========================================================
   POI
========================================================= */

function drawPOI(
    x,
    y,
    emoji
) {

    ctx.beginPath();

    ctx.fillStyle =
        "white";

    ctx.arc(
        x,
        y,
        24,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.font =
        "23px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        emoji,
        x,
        y
    );

}


/* =========================================================
   SPELER
========================================================= */

function drawPlayer(
    width,
    height
) {

    const player =
        worldToScreen(
            .5,
            .55
        );


    ctx.beginPath();

    ctx.fillStyle =
        "rgba(80,110,255,.25)";

    ctx.arc(
        player.x,
        player.y,
        38,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.fillStyle =
        "#5c79ff";

    ctx.arc(
        player.x,
        player.y,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        4;

    ctx.stroke();

}


/* =========================================================
   WORLD → SCREEN
========================================================= */

function worldToScreen(
    x,
    y
) {

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    return {

        x:
            (x - map.x) *
            width *
            map.zoom +
            width / 2,

        y:
            (y - map.y) *
            height *
            map.zoom +
            height / 2

    };

}


/* =========================================================
   CREATURE SPAWNS
========================================================= */

let creatureSpawns = [];


function randomCreature() {

    const random =
        Math.random();


    if (
        random < .60
    ) {

        return CREATURES[
            Math.floor(
                Math.random() * 3
            )
        ];

    }


    if (
        random < .88
    ) {

        return CREATURES[
            3 +
            Math.floor(
                Math.random() * 2
            )
        ];

    }


    if (
        random < .98
    ) {

        return CREATURES[5];

    }


    return CREATURES[6];

}


/* =========================================================
   SPAWN
========================================================= */

function spawnCreature() {

    const creature =
        randomCreature();


    creatureSpawns.push({

        x:
            .10 +
            Math.random() * .80,

        y:
            .10 +
            Math.random() * .80,

        creature

    });


    drawMap();

}


/* =========================================================
   START CREATURES
========================================================= */

function spawnInitialCreatures() {

    creatureSpawns = [];


    for (
        let i = 0;
        i < 8;
        i++
    ) {

        spawnCreature();

    }

}


/* =========================================================
   AUTOMATISCHE SPAWN
========================================================= */

setInterval(
    () => {

        if (
            !document
                .getElementById(
                    "gameScreen"
                )
                .classList.contains("active")
        ) return;


        if (
            creatureSpawns.length < 10
        ) {

            spawnCreature();

        }

    },
    5000
);


/* =========================================================
   MAP SLEPEN
========================================================= */

let dragging = false;

let dragStartX = 0;
let dragStartY = 0;

let mapStartX = 0;
let mapStartY = 0;


canvas.addEventListener(
    "pointerdown",
    event => {

        dragging = true;

        canvas.classList.add(
            "dragging"
        );


        dragStartX =
            event.clientX;

        dragStartY =
            event.clientY;


        mapStartX =
            map.x;

        mapStartY =
            map.y;


        canvas.setPointerCapture(
            event.pointerId
        );

    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!dragging) return;


        const width =
            canvas.clientWidth;

        const height =
            canvas.clientHeight;


        map.x =
            mapStartX -
            (
                event.clientX -
                dragStartX
            ) /
            (
                width *
                map.zoom
            );


        map.y =
            mapStartY -
            (
                event.clientY -
                dragStartY
            ) /
            (
                height *
                map.zoom
            );


        drawMap();

    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        dragging = false;

        canvas.classList.remove(
            "dragging"
        );

    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        dragging = false;

        canvas.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   CREATURE KLIKKEN
========================================================= */

canvas.addEventListener(
    "click",
    event => {

        const rect =
            canvas.getBoundingClientRect();


        const clickX =
            event.clientX -
            rect.left;


        const clickY =
            event.clientY -
            rect.top;


        let closest = null;

        let closestDistance = 55;


        creatureSpawns.forEach(
            spawn => {

                const pos =
                    worldToScreen(
                        spawn.x,
                        spawn.y
                    );


                const distance =
                    Math.hypot(
                        pos.x - clickX,
                        pos.y - clickY
                    );


                if (
                    distance <
                    closestDistance
                ) {

                    closestDistance =
                        distance;

                    closest =
                        spawn;

                }

            }
        );


        if (closest) {

            openCreaturePopup(
                closest
            );

        }

    }
);


/* =========================================================
   POPUP
========================================================= */

let selectedCreature = null;


function openCreaturePopup(
    spawn
) {

    selectedCreature =
        spawn;


    const creature =
        spawn.creature;


    document.getElementById(
        "popupEmoji"
    ).textContent =
        creature.emoji;


    document.getElementById(
        "popupName"
    ).textContent =
        creature.name;


    document.getElementById(
        "popupInfo"
    ).textContent =

        creature.type +
        " • " +
        creature.rarity +
        " • +" +
        creature.xp +
        " XP";


    document.getElementById(
        "creaturePopup"
    ).classList.add(
        "open"
    );

}


/* =========================================================
   POPUP SLUITEN
========================================================= */

document.getElementById(
    "closePopup"
).addEventListener(
    "click",
    closeCreaturePopup
);


function closeCreaturePopup() {

    document.getElementById(
        "creaturePopup"
    ).classList.remove(
        "open"
    );


    selectedCreature = null;

}


/* =========================================================
   CREATURE VANGEN
========================================================= */

document.getElementById(
    "catchButton"
).addEventListener(
    "click",
    catchCreature
);


function catchCreature() {

    if (
        !selectedCreature
    ) return;


    const creature =
        selectedCreature.creature;


    const index =
        creatureSpawns.indexOf(
            selectedCreature
        );


    if (
        index !== -1
    ) {

        creatureSpawns.splice(
            index,
            1
        );

    }


    const alreadyCaught =
        player.caught.includes(
            creature.id
        );


    if (
        !alreadyCaught
    ) {

        player.caught.push(
            creature.id
        );

    }


    addXP(
        creature.xp
    );


    player.coins +=
        creature.rarity === "Legendary"
            ? 100
            : creature.rarity === "Epic"
                ? 40
                : creature.rarity === "Rare"
                    ? 20
                    : 10;


    savePlayer();


    closeCreaturePopup();

    drawMap();


    showToast(
        "🎉 " +
        creature.name +
        " gevangen! +" +
        creature.xp +
        " XP"
    );


    setTimeout(
        spawnCreature,
        1800
    );

}


/* =========================================================
   ZOOM
========================================================= */

document.getElementById(
    "zoomIn"
).addEventListener(
    "click",
    () => {

        map.zoom =
            Math.min(
                2.5,
                map.zoom * 1.2
            );


        drawMap();

    }
);


document.getElementById(
    "zoomOut"
).addEventListener(
    "click",
    () => {

        map.zoom =
            Math.max(
                .6,
                map.zoom / 1.2
            );


        drawMap();

    }
);


/* =========================================================
   CENTER
========================================================= */

document.getElementById(
    "centerMap"
).addEventListener(
    "click",
    () => {

        map.x = 0;

        map.y = 0;

        map.zoom = 1;


        drawMap();


        showToast(
            "⌾ Kaart gecentreerd"
        );

    }
);


/* =========================================================
   LOCATIE
========================================================= */

document.getElementById(
    "locationButton"
).addEventListener(
    "click",
    () => {

        if (
            !navigator.geolocation
        ) {

            showToast(
                "📍 Locatie wordt niet ondersteund."
            );

            return;

        }


        navigator.geolocation.getCurrentPosition(

            () => {

                showToast(
                    "📍 Locatie gevonden!"
                );

            },

            () => {

                showToast(
                    "⚠️ Locatie kon niet worden opgehaald."
                );

            }

        );

    }
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   INIT
========================================================= */

updateUI();

</script>
